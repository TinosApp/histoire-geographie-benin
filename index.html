.\nConsigne 4, Conséquences et solutions.\nConsigne 5, Bilan et opinion personnelle argumentée.\nConseil : rester collé au document (citer de courts extraits) et le compléter par ses connaissances."}, {"titre": "Réponds directement aux consignes", "texte": "Pas d'introduction ni de conclusion longues : répondre à chaque question dans l'ordre, avec des phrases complètes, des faits précis, des dates et des exemples. Numéroter les réponses comme les consignes."}]}, "cd": {"themes": {"CD-USA": "États-Unis : organisation et puissance économique", "CD-JAP": "Japon : contraintes naturelles, agriculture, environnement", "CD-ENV": "Environnement et développement durable", "CD-DEC": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "CD-BEN": "Bénin : commerce et échanges", "CD-ONU": "ONU : organes et bilan"}, "fiches": [{"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Fondements naturels", "texte": "• Vaste territoire (environ 9,8 millions de km²) ouvert sur l'Atlantique et le Pacifique\n• Relief varié : Appalaches, Rocheuses, grandes plaines fertiles ; grands fleuves (Mississippi, Missouri) et Grands Lacs\n• Climats variés, permettant des productions agricoles diverses\n• Sous-sol riche : charbon, pétrole, gaz, fer, cuivre, or"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Fondements humains et organisationnels", "texte": "• Population nombreuse (plus de 330 millions d'habitants), renouvelée par l'immigration, main-d'œuvre qualifiée\n• Universités, recherche-développement, pôles de haute technologie (Silicon Valley)\n• Grandes firmes multinationales, puissance financière (dollar, Wall Street), vaste marché intérieur, libéralisme économique"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Secteur secondaire", "texte": "• Première puissance industrielle : automobile, aéronautique et spatial, électronique, informatique, pétrochimie\n• Régions industrielles : Nord-Est (Manufacturing Belt), Californie, Texas, Floride (Sun Belt)"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Agriculture, l'« arme verte »", "texte": "• Grande puissance agricole et exportatrice : maïs, blé, soja, coton, élevage\n• Facteurs : grandes exploitations, mécanisation, engrais, biotechnologies, agrobusiness, soutien de l'État\n• Revers : érosion des sols, pollution par engrais et pesticides, baisse des nappes d'eau, monoculture"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Secteur tertiaire", "texte": "• Environ 4/5 du PIB\n• Finance (Wall Street), commerce, transport aérien et maritime, tourisme, numérique, services aux entreprises"}, {"groupe": "CD-USA", "titre": "États-Unis : organisation et puissance économique", "rubrique": "Difficultés et limites", "texte": "• Croissance moins forte qu'autrefois, forte dette publique et privée, déficit commercial\n• Inégalités sociales, coût de la santé, concurrence de la Chine et d'autres pays émergents\n• Environnement : pollution de l'air et de l'eau, émissions de gaz à effet de serre, déchets, catastrophes climatiques"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "Contraintes naturelles", "texte": "• Relief montagneux : environ les trois quarts du territoire, peu d'espace utile\n• Risques naturels : séismes (Kobé, 1995), tsunamis (mars 2011, accident nucléaire de Fukushima), typhons, volcans\n• Archipel morcelé (Honshu est la plus grande île) ; froid et neige au nord\n• Sols peu fertiles, sous-sol pauvre : forte dépendance énergétique et minière\n• Courants marins : Kuro Shivo (chaud) et Oya Shivo (froid) bordent les côtes, favorables à la pêche"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "Agriculture et pêche", "texte": "• Petites parcelles très intensives : riz, thé, légumes, fruits\n• Facteurs de réussite : engrais, mécanisation, recherche, coopératives, formation des agriculteurs\n• Pêche parmi les premières du monde\n• Limites : peu de terres cultivables, vieillissement des agriculteurs, forte dépendance aux importations alimentaires\n• Leçons pour le Bénin : intensifier, former, organiser les producteurs en coopératives, investir dans la recherche"}, {"groupe": "CD-JAP", "titre": "Japon : contraintes naturelles, agriculture, environnement", "rubrique": "Nuisances de l'industrie", "texte": "• Pollution de l'air et de l'eau, déchets, accident nucléaire de Fukushima\n• Réponses : normes environnementales, recyclage, technologies propres, économies d'énergie"}, {"groupe": "CD-ENV", "titre": "Environnement et développement durable", "rubrique": "Nuisances environnementales de l'industrie", "texte": "• Air : gaz, poussières, pluies acides\n• Eau et sols : rejets et déchets industriels\n• Climat : gaz à effet de serre et réchauffement\n• Santé et biodiversité : maladies, destruction d'habitats"}, {"groupe": "CD-ENV", "titre": "Environnement et développement durable", "rubrique": "Principe pollueur-payeur", "texte": "• Principe défini par l'OCDE (1972) : le pollueur prend en charge le coût des mesures de prévention et de lutte contre la pollution\n• Intérêt : responsabilise les entreprises et les particuliers, finance la protection de l'environnement\n• Limites : connaissance et application encore insuffisantes, surtout hors des grandes villes"}, {"groupe": "CD-ENV", "titre": "Environnement et développement durable", "rubrique": "Solutions", "texte": "• Normes et contrôles\n• Recyclage et énergies propres\n• Sensibilisation et éducation\n• Taxes et sanctions\n• Coopération internationale"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Formes de décolonisation", "texte": "• Pacifique ou négociée : Ghana (1957), colonies françaises d'Afrique noire dont le Dahomey\n• Violente : Algérie, Kenya, Angola\n• Précipitée et conflictuelle : Congo belge (1960)"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Conditions de la décolonisation violente", "texte": "• Forte présence de colons hostiles à l'indépendance\n• Volonté de la métropole de garder sa domination\n• Expropriation des terres et abus coloniaux (impôts, travail forcé, discrimination)\n• Refus des revendications des nationalistes\n• Cultures de rente imposées au détriment des cultures vivrières"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Algérie (1954-1962)", "texte": "• 1er novembre 1954 : début de l'insurrection du FLN\n• 13 mai 1958 : crise d'Alger et retour de de Gaulle\n• 16 septembre 1959 : droit à l'autodétermination reconnu aux Algériens\n• 1961 : putsch des généraux à Alger (avril), terrorisme de l'OAS\n• 18 mars 1962 : accords d'Évian ; 19 mars : cessez-le-feu\n• 1er juillet 1962 : référendum ; indépendance reconnue le 3 juillet et proclamée le 5 juillet 1962 ; Ahmed Ben Bella premier chef du gouvernement puis président"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Ghana", "texte": "• Ancienne Côte-de-l'Or britannique\n• Kwame Nkrumah et le Convention People's Party : grèves, boycotts, actions non violentes\n• 6 mars 1957 : premier pays d'Afrique noire indépendant, modèle pour les autres colonies"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Kenya", "texte": "• Terres prises par les colons européens, en particulier chez les Kikuyu\n• 1952 : révolte des Mau-Mau, état d'urgence, répression britannique ; arrestation de Jomo Kenyatta\n• 12 décembre 1963 : indépendance ; Kenyatta chef du gouvernement puis président"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Congo belge", "texte": "• Indépendance le 30 juin 1960 : Patrice Lumumba Premier ministre, Joseph Kasa-Vubu président\n• Crise immédiate : mutinerie, sécession du Katanga, intervention de l'ONU\n• 17 janvier 1961 : assassinat de Lumumba"}, {"groupe": "CD-DEC", "titre": "Décolonisation : formes et exemples (Algérie, Kenya, Ghana, Congo belge, Angola)", "rubrique": "Angola", "texte": "• Colonie portugaise ; refus du Portugal de reconnaître l'indépendance\n• 1961 : début de la lutte armée ; mouvements de libération MPLA, FNLA, UNITA\n• 1974 : révolution des Œillets au Portugal ; 11 novembre 1975 : indépendance, suivie d'une guerre civile"}, {"groupe": "CD-BEN", "titre": "Bénin : commerce et échanges", "rubrique": "Atouts du commerce béninois", "texte": "• Position sur le golfe de Guinée et proximité du Nigeria (grand marché)\n• Port autonome de Cotonou et corridors routiers vers le Niger, le Burkina Faso, le Mali\n• Grands marchés (Dantokpa), appartenance à la CEDEAO et à l'UEMOA"}, {"groupe": "CD-BEN", "titre": "Bénin : commerce et échanges", "rubrique": "Problèmes du commerce béninois", "texte": "• Commerce informel et réexportation dépendant de la politique du Nigeria (exemple : fermeture des frontières terrestres de 2019 à 2020)\n• Fraude et concurrence déloyale, lourdeurs administratives, coût du transport, faible transformation locale"}, {"groupe": "CD-ONU", "titre": "ONU : organes et bilan", "rubrique": "Organes principaux de l'ONU", "texte": "• Assemblée générale : tous les États membres, un État une voix, débat et recommandations\n• Conseil de sécurité : 15 membres dont 5 permanents avec veto\n• Secrétariat : dirigé par le Secrétaire général\n• Cour internationale de justice (La Haye) : règle les différends entre États\n• Conseil économique et social (ECOSOC) : coordination économique et sociale\n• Conseil de tutelle : activité suspendue depuis 1994"}, {"groupe": "CD-ONU", "titre": "ONU : organes et bilan", "rubrique": "Bilan de l'ONU", "texte": "• Réussites : évite une nouvelle guerre mondiale, casques bleus, décolonisation, droits de l'homme, aide humanitaire\n• Limites : veto, manque de moyens, conflits non résolus, inégalités entre pays riches et pays pauvres\n• Réformes demandées : élargir le Conseil de sécurité, mieux représenter l'Afrique"}], "epreuves": [{"id": "CD1", "num": "1", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation", "contexte": "Selon la nature de la puissance coloniale et les intérêts en jeu, la décolonisation a pu être pacifique ou violente.", "tache": "Pour montrer ta maîtrise de ce fait historique, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Expose les conditions dans lesquelles intervient la forme violente de la décolonisation en Afrique.", "Présente les causes et le déclenchement de la guerre d'Algérie (1954).", "Retrace les étapes de la fin de la guerre de 1958 à 1962."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : après la Seconde Guerre mondiale, de vastes mouvements d'indépendance touchent l'Afrique\n• Problématique : la décolonisation violente a marqué l'Algérie, dernier grand conflit colonial de la France\n• Plan : conditions, causes et déclenchement, fin de la guerre"}, {"label": "Consigne 1", "points": 3, "text": "• Forte présence de colons hostiles à l'indépendance (Algérie, Kenya, Rhodésie du Sud)\n• Volonté de la métropole de maintenir sa domination\n• Expropriation des terres et abus coloniaux (impôts, travail forcé, discrimination)\n• Refus des revendications des nationalistes\n• Cultures de rente imposées au détriment des cultures vivrières\n• Transition : l'Algérie illustre ces conditions"}, {"label": "Consigne 2", "points": 3, "text": "• Algérie considérée comme une partie de la France, avec un statut d'inégalité entre colons et Algériens\n• Répression de 1945 (Sétif), échec des voies légales, montée du nationalisme\n• Défaite de la France en Indochine (1954) qui encourage les nationalistes\n• 1er novembre 1954 : le FLN déclenche l'insurrection\n• Transition : la guerre s'étend et s'intensifie"}, {"label": "Consigne 3", "points": 3, "text": "• 13 mai 1958 : crise d'Alger, retour de de Gaulle au pouvoir\n• Échec de la victoire militaire, 16 septembre 1959 : droit à l'autodétermination\n• Avril 1961 : putsch des généraux ; terrorisme de l'OAS\n• 18 mars 1962 : accords d'Évian, cessez-le-feu le 19\n• 1er juillet 1962 : référendum ; indépendance reconnue le 3 juillet, proclamée le 5 juillet"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une guerre longue et meurtrière a conduit à l'indépendance de l'Algérie\n• Ouverture : conséquences pour les deux pays et pour la décolonisation africaine"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon", "contexte": "Le Japon est une grande puissance économique bien qu'il subisse de fortes contraintes naturelles.", "tache": "Pour expliquer la performance économique du Japon, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Expose les contraintes d'ordre naturel auxquelles le Japon est confronté.", "Présente les atouts humains et organisationnels de sa réussite.", "Détermine les limites de la performance industrielle japonaise sur le plan environnemental."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon, archipel d'Asie de l'Est, est l'une des premières économies du monde\n• Problématique : le pays a surmonté des contraintes naturelles grâce à ses atouts, mais son industrie a des limites environnementales\n• Plan : contraintes, atouts, limites"}, {"label": "Consigne 1", "points": 3, "text": "• Territoire montagneux (environ 3/4) : peu d'espace utile\n• Séismes (Kobé, 1995), tsunamis (2011) et accident de Fukushima, typhons, volcans\n• Archipel morcelé, froid et neige au nord\n• Sols peu fertiles et sous-sol pauvre : dépendance énergétique et minière\n• Transition : malgré ces contraintes, le pays a su se développer"}, {"label": "Consigne 2", "points": 3, "text": "• Humains : population nombreuse, instruite et disciplinée, forte épargne, faible absentéisme\n• Organisationnels : grandes firmes liées aux banques, sociétés de commerce, réseau de sous-traitants, coopération État-entreprises, cercles de qualité\n• Résultat : premières places dans l'automobile, l'électronique, la robotique et la construction navale\n• Transition : cette réussite a un coût"}, {"label": "Consigne 3", "points": 3, "text": "• Pollution de l'air et de l'eau, déchets industriels\n• Consommation énergétique élevée et émissions de gaz à effet de serre\n• Risques nucléaires (Fukushima)\n• Réponses : normes, recyclage, technologies propres, énergies renouvelables"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Japon montre qu'organisation et formation compensent la pauvreté en ressources\n• Ouverture : la question du développement durable"}]}]}, {"id": "CD2", "num": "2", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : ONU", "contexte": "Après des décennies d'existence, l'ONU dresse un bilan de son action et s'interroge sur ses perspectives.", "tache": "Réponds directement aux consignes suivantes pour expliquer les réussites et les limites de l'ONU.", "support": "", "consignes": ["Présente les réussites de l'ONU depuis 1945.", "Explique les limites de son action.", "Justifie la nécessité de réformer l'ONU."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Pas de nouvelle guerre mondiale depuis 1945\n• Casques bleus et opérations de maintien de la paix\n• Soutien à la décolonisation\n• Déclaration universelle des droits de l'homme (1948)\n• Action des agences : PAM, OMS, UNESCO, FAO contre la faim, la maladie et l'analphabétisme"}, {"label": "Consigne 2", "points": 3, "text": "• Conflits non résolus ou auxquels l'ONU intervient trop tard\n• Droit de veto des cinq membres permanents qui bloque les décisions\n• Manque de moyens et dépendance financière envers les grandes puissances\n• Écart persistant entre pays riches et pays pauvres"}, {"label": "Consigne 3", "points": 4, "text": "• Le veto contredit l'égalité des États\n• Besoin d'élargir le Conseil de sécurité (place de l'Afrique, de l'Inde, du Brésil)\n• Difficulté : les membres permanents refusent de perdre leurs privilèges\n• Les échecs tiennent aussi au manque de volonté des États\n• Pour rester utile, l'ONU doit s'adapter au monde actuel"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : États-Unis", "contexte": "Grâce à de nombreux fondements, les États-Unis se sont dotés d'une économie puissante, qui n'est pas exempte de faiblesses.", "tache": "Pour expliquer la puissance de l'économie américaine, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les fondements naturels du développement économique des États-Unis.", "Expose les aspects de leur puissance dans le secteur tertiaire.", "Identifie les difficultés de l'économie américaine sur le plan environnemental."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les États-Unis sont la première puissance économique mondiale\n• Problématique : leur puissance repose sur de solides atouts mais entraîne des nuisances\n• Plan : fondements naturels, tertiaire, difficultés environnementales"}, {"label": "Consigne 1", "points": 3, "text": "• Vaste territoire ouvert sur deux océans\n• Plaines fertiles, grands fleuves (Mississippi, Missouri), Grands Lacs\n• Climats variés\n• Sous-sol riche : charbon, pétrole, gaz, fer, cuivre\n• Transition : ces atouts ont nourri un tertiaire puissant"}, {"label": "Consigne 2", "points": 3, "text": "• Le tertiaire représente environ 4/5 du PIB\n• Finance : Wall Street, dollar, grandes banques\n• Commerce international et transport aérien et maritime\n• Tourisme et services aux entreprises\n• Numérique et haute technologie\n• Transition : cette puissance a un coût environnemental"}, {"label": "Consigne 3", "points": 3, "text": "• Pollution de l'air par l'industrie et les transports\n• Émissions de gaz à effet de serre parmi les plus élevées du monde\n• Pollution de l'eau et des sols, déchets\n• Catastrophes climatiques (ouragans, sécheresses)\n• Solutions possibles : énergies renouvelables, normes, recyclage"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : puissance réelle mais fragilisée par ses nuisances\n• Ouverture : la recherche d'un développement durable"}]}]}, {"id": "CD3", "num": "3", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : ONU", "contexte": "L'ONU fonctionne à partir de plusieurs organes qui ont chacun un rôle précis.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Cite les six organes principaux de l'ONU.", "Explique le rôle de l'Assemblée générale et du Secrétariat.", "Donne ton opinion sur la nécessité de réformer l'ONU."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Assemblée générale\n• Conseil de sécurité\n• Secrétariat\n• Cour internationale de justice\n• Conseil économique et social (ECOSOC)\n• Conseil de tutelle (activité suspendue depuis 1994)"}, {"label": "Consigne 2", "points": 3, "text": "• Assemblée générale : réunit tous les États membres (un État, une voix), débat de toutes les questions, adopte le budget, vote des recommandations\n• Secrétariat : administration de l'ONU dirigée par le Secrétaire général, qui applique les décisions et peut proposer sa médiation"}, {"label": "Consigne 3", "points": 4, "text": "• La réforme est nécessaire : le Conseil de sécurité reflète le monde de 1945, le veto bloque certaines décisions, l'Afrique et l'Amérique latine sont peu représentées\n• Elle est difficile : les membres permanents ne veulent pas perdre leurs privilèges\n• Propositions : élargir le Conseil, limiter l'usage du veto"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : États-Unis", "contexte": "Malgré sa puissance, l'économie américaine connaît des limites qui inquiètent ses dirigeants.", "tache": "Réponds directement aux consignes suivantes pour expliquer les limites de l'économie américaine.", "support": "", "consignes": ["Décris les limites de la croissance économique des États-Unis.", "Expose les facteurs qui expliquent cette situation.", "Montre les conséquences de ces limites et donne ton point de vue sur l'usage des droits de douane."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Croissance plus lente que lors des décennies précédentes\n• Faible chômage apparent mais sortie du marché du travail de travailleurs découragés\n• Épargne faible des ménages\n• Endettement élevé des entreprises et de l'État"}, {"label": "Consigne 2", "points": 3, "text": "• Manque de main-d'œuvre qualifiée\n• Faible pouvoir d'achat d'une partie de la population\n• Poids de la dette et faiblesse de l'investissement\n• Concurrence de la Chine et des pays émergents\n• Effets de la crise financière de 2008 et fluctuations du dollar"}, {"label": "Consigne 3", "points": 4, "text": "• Déficit de la balance commerciale\n• Perte de compétitivité face aux pays émergents\n• Inégalités et fragilité sociale\n• Recul de l'influence économique\n• Point de vue argumenté : les droits de douane protègent certaines industries à court terme, mais renchérissent les produits, risquent des représailles et ne règlent pas les problèmes de fond (formation, innovation, dette)"}]}]}, {"id": "CD4", "num": "4", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation", "contexte": "La décolonisation de l'Afrique a pris des formes différentes selon les puissances coloniales et les territoires.", "tache": "Pour montrer la diversité des formes de décolonisation, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente la décolonisation pacifique du Ghana.", "Expose la guerre de libération du Kenya.", "Explique les difficultés du Congo belge au lendemain de l'indépendance de 1960."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les colonies britanniques, françaises et belges n'ont pas suivi le même chemin vers l'indépendance\n• Problématique : Ghana, Kenya et Congo belge illustrent trois formes différentes\n• Plan : le Ghana, le Kenya, le Congo"}, {"label": "Consigne 1", "points": 3, "text": "• Ancienne Côte-de-l'Or britannique, rôle de Kwame Nkrumah et du Convention People's Party\n• Grèves, boycotts et actions non violentes\n• Réformes constitutionnelles progressives et négociations avec Londres\n• 6 mars 1957 : indépendance, premier État d'Afrique noire indépendant, modèle pour les autres colonies\n• Transition : ailleurs, la résistance des colons a mené à la violence"}, {"label": "Consigne 2", "points": 3, "text": "• Terres prises par les colons européens, surtout chez les Kikuyu\n• Révolte des Mau-Mau à partir de 1952, état d'urgence et répression britannique\n• Arrestation de Jomo Kenyatta\n• Pression internationale et négociations ; 12 décembre 1963 : indépendance\n• Transition : le cas du Congo belge montre les risques d'une indépendance précipitée"}, {"label": "Consigne 3", "points": 3, "text": "• 30 juin 1960 : indépendance, Lumumba Premier ministre et Kasa-Vubu président\n• Faible préparation de l'administration et des cadres africains\n• Mutinerie de la Force publique, sécession du Katanga, rivalités politiques\n• Intervention de l'ONU ; 17 janvier 1961 : assassinat de Lumumba"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : trois formes de décolonisation (pacifique, violente, précipitée)\n• Ouverture : les défis des États indépendants"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Bénin, commerce", "contexte": "Grâce à sa position géographique, le Bénin dispose d'atouts commerciaux, mais son commerce reste fragile.", "tache": "Pour expliquer la situation du commerce béninois, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts du commerce béninois.", "Détermine les problèmes auxquels il est confronté.", "Propose des solutions pour le renforcer."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Bénin, pays côtier, joue un rôle de carrefour commercial en Afrique de l'Ouest\n• Problématique : le commerce béninois a des atouts mais reste fragile\n• Plan : atouts, problèmes, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Position géographique sur le golfe de Guinée, proximité du Nigeria\n• Port autonome de Cotonou et corridors vers le Niger, le Burkina Faso et le Mali\n• Grands marchés (Dantokpa) et tradition commerciale\n• Appartenance à la CEDEAO et à l'UEMOA\n• Transition : ces atouts sont limités par plusieurs problèmes"}, {"label": "Consigne 2", "points": 3, "text": "• Dépendance vis-à-vis du Nigeria (exemple : fermeture des frontières terrestres de 2019 à 2020)\n• Poids du commerce informel et de la réexportation\n• Fraude et concurrence déloyale\n• Lourdeurs administratives et coût du transport\n• Faible transformation locale des produits exportés"}, {"label": "Consigne 3", "points": 3, "text": "• Diversifier les partenaires et les produits\n• Moderniser le port et les corridors, simplifier les procédures\n• Formaliser le commerce informel\n• Transformer sur place les produits agricoles\n• Renforcer les accords de la CEDEAO"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le commerce peut devenir un moteur du développement si les obstacles sont levés\n• Ouverture : intégration régionale"}]}]}, {"id": "CD5", "num": "5", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation (Algérie)", "contexte": "En 1959, alors que la guerre d'Algérie se poursuit, la France change de position sur l'avenir du pays.", "tache": "Réponds directement aux consignes suivantes pour expliquer l'évolution de la position française sur l'Algérie.", "support": "", "consignes": ["Présente l'annonce faite par le général de Gaulle le 16 septembre 1959.", "Explique les trois solutions proposées aux Algériens.", "Montre les réactions suscitées et la suite des événements jusqu'à l'indépendance."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Contexte : guerre d'Algérie depuis 1954, retour de de Gaulle au pouvoir en 1958\n• Discours de de Gaulle : les Algériens décideront de leur avenir par un vote libre quand la paix sera revenue\n• Reconnaissance, pour la première fois, du droit à l'autodétermination\n• Poursuite des opérations militaires en attendant"}, {"label": "Consigne 2", "points": 3, "text": "• Sécession : rupture avec la France\n• Association : autonomie en lien étroit avec la France\n• Francisation : intégration à la France\n• Offre ambiguë : les options sont orientées vers le maintien d'un lien avec la France"}, {"label": "Consigne 3", "points": 4, "text": "• Le FLN exige des négociations directes et l'indépendance\n• Les partisans de l'Algérie française et l'armée rejettent l'autodétermination (putsch d'Alger en 1961)\n• Référendum de janvier 1961 favorable à l'autodétermination\n• Accords d'Évian (mars 1962) et indépendance proclamée en juillet 1962"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : environnement", "contexte": "L'industrialisation apporte la croissance mais aussi des nuisances pour l'environnement.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Décris les nuisances environnementales de l'industrie.", "Définis le principe « pollueur-payeur » et donne ton point de vue sur ce principe.", "Propose deux solutions pour réduire ces nuisances."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Pollution de l'air (gaz, poussières, pluies acides)\n• Pollution de l'eau et des sols par les rejets et déchets\n• Émissions de gaz à effet de serre et réchauffement\n• Atteintes à la santé et à la biodiversité"}, {"label": "Consigne 2", "points": 3, "text": "• Définition : principe défini par l'OCDE en 1972, selon lequel le pollueur prend en charge le coût des mesures de prévention et de lutte contre la pollution\n• Point de vue : principe juste et utile, car il responsabilise et finance la protection de l'environnement\n• Limite : application encore faible, méconnaissance du principe, contrôle insuffisant en dehors des grandes villes"}, {"label": "Consigne 3", "points": 4, "text": "• Imposer des normes et des contrôles, avec des sanctions\n• Encourager le recyclage, les énergies propres et la sensibilisation"}]}]}, {"id": "CD6", "num": "6", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation (Angola)", "contexte": "Le Portugal a longtemps refusé d'accorder l'indépendance à ses colonies d'Afrique.", "tache": "Pour expliquer la décolonisation de l'Angola, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les causes de la guerre d'Angola.", "Décris les mouvements de libération et le déroulement de la lutte.", "Dégage les conséquences de la guerre pour le Portugal et l'Angola."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Portugal, puissance coloniale affaiblie mais attachée à son empire\n• Problématique : en Angola, le refus de l'indépendance a entraîné une longue guerre\n• Plan : causes, lutte, conséquences"}, {"label": "Consigne 1", "points": 3, "text": "• Refus du régime portugais d'accorder l'autonomie ou l'indépendance\n• Travail forcé, discrimination, exploitation économique\n• Inégalités entre colons et Africains\n• Influence des indépendances africaines de 1960"}, {"label": "Consigne 2", "points": 3, "text": "• Trois mouvements : MPLA, FNLA, UNITA\n• 1961 : début de la lutte armée\n• Guerre de guérilla, forte présence militaire portugaise\n• Soutiens extérieurs différents selon les mouvements, dans le contexte de la guerre froide"}, {"label": "Consigne 3", "points": 3, "text": "• Portugal : coût humain et financier de la guerre, mécontentement des officiers, révolution des Œillets (25 avril 1974)\n• Angola : indépendance le 11 novembre 1975, puis guerre civile entre mouvements rivaux\n• Conséquences régionales pour les autres colonies portugaises"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une décolonisation violente et tardive\n• Ouverture : difficultés de la construction nationale après l'indépendance"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : Chine", "contexte": "L'industrie chinoise occupe une place importante dans l'économie mondiale.", "tache": "Réponds directement aux consignes suivantes pour expliquer l'industrie chinoise.", "support": "", "consignes": ["Explique les facteurs de la réussite industrielle de la Chine.", "Expose les aspects de sa puissance industrielle.", "Détermine les limites de cette réussite et donne ton opinion sur l'impact des produits chinois sur l'économie africaine."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Réformes de 1978 (Deng Xiaoping)\n• Zones économiques spéciales et investissements étrangers\n• Main-d'œuvre nombreuse et peu coûteuse\n• Marché intérieur et politique volontariste de l'État"}, {"label": "Consigne 2", "points": 3, "text": "• Textile, électronique, machines, jouets\n• Une grande part de la production industrielle mondiale\n• Exportations vers tous les continents et grands ports"}, {"label": "Consigne 3", "points": 4, "text": "• Pollution de l'air et de l'eau\n• Hausse des salaires et perte de l'avantage du bas coût\n• Inégalités entre littoral et intérieur\n• Dépendance aux exportations\n• Opinion nuancée : les produits bon marché profitent aux consommateurs africains mais concurrencent les industries locales ; l'Afrique doit négocier des partenariats avec transfert de technologie"}]}]}, {"id": "CD7", "num": "7", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation (Kenya)", "contexte": "Au Kenya, la colonisation britannique a provoqué une résistance armée.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Présente les causes de la guerre du Kenya.", "Décris les manifestations de cette guerre.", "Donne les conséquences de la guerre sur l'accession du Kenya à l'indépendance."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Terres fertiles prises par les colons européens\n• Inégalités et discrimination raciale\n• Impôts, travail forcé et cultures imposées\n• Frustration des Kikuyu et échec des revendications pacifiques"}, {"label": "Consigne 2", "points": 3, "text": "• Révolte des Mau-Mau à partir de 1952\n• Attaques contre des fermes de colons et des collaborateurs\n• État d'urgence, répression britannique, camps de détention\n• Arrestation de Jomo Kenyatta"}, {"label": "Consigne 3", "points": 4, "text": "• Prise de conscience britannique du coût de la répression\n• Négociations constitutionnelles et pression internationale\n• 12 décembre 1963 : indépendance ; Jomo Kenyatta dirige le pays\n• Départ ou réduction du rôle des colons"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon (agriculture)", "contexte": "Le Japon dispose de peu de terres cultivables, mais son agriculture est très productive.", "tache": "Pour expliquer les succès agricoles du Japon et les leçons pour le Bénin, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les facteurs de la réussite agricole du Japon.", "Détermine les limites de l'agriculture japonaise.", "Dégage deux leçons que le Bénin peut en tirer."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon est un archipel montagneux\n• Problématique : malgré peu de terres, l'agriculture japonaise réussit grâce à l'intensification\n• Plan : facteurs de réussite, limites, leçons"}, {"label": "Consigne 1", "points": 3, "text": "• Petites parcelles intensément exploitées (riz, thé, légumes, fruits)\n• Engrais, mécanisation adaptée, recherche agronomique\n• Coopératives et encadrement des agriculteurs\n• Pêche parmi les premières du monde, favorisée par les courants Kuro Shivo et Oya Shivo\n• Transition : cette réussite reste limitée"}, {"label": "Consigne 2", "points": 3, "text": "• Peu de terres cultivables : dépendance aux importations alimentaires (céréales, soja, viande)\n• Vieillissement des agriculteurs et exode rural\n• Coût élevé de la production, risques naturels"}, {"label": "Consigne 3", "points": 3, "text": "• Intensifier et former les producteurs\n• Organiser les paysans en coopératives et investir dans la recherche"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'agriculture japonaise est un modèle d'intensification malgré ses limites\n• Ouverture : adapter ces leçons aux réalités béninoises"}]}]}, {"id": "CD8", "num": "8", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation (Bandung)", "contexte": "En avril 1955, des pays d'Asie et d'Afrique se réunissent à Bandung pour défendre leurs intérêts communs.", "tache": "Réponds directement aux consignes suivantes pour expliquer l'apport de la conférence de Bandung.", "support": "", "consignes": ["Présente la conférence de Bandung (1955).", "Explique les idées défendues par les participants.", "Montre ses limites, son importance et sa portée pour la décolonisation."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Réunion du 18 au 24 avril 1955 en Indonésie\n• 29 pays d'Asie et d'Afrique\n• Contexte : décolonisation de l'Asie, guerre froide, guerre d'Algérie naissante"}, {"label": "Consigne 2", "points": 3, "text": "• Condamnation du colonialisme sous toutes ses formes\n• Égalité des races et des nations, droit des peuples à disposer d'eux-mêmes\n• Coopération économique et culturelle entre pays du Sud\n• Coexistence pacifique et refus de s'aligner sur les deux blocs"}, {"label": "Consigne 3", "points": 4, "text": "• Limites : résolutions sans moyens de contrainte, participants aux régimes très différents, peu de représentants de l'Afrique noire encore colonisée\n• Importance : naissance du Tiers Monde et du non-alignement\n• Portée : encourage les nationalistes africains, renforce la pression sur l'ONU, prépare l'indépendance du Ghana (1957) et la vague de 1960"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : États-Unis (agriculture)", "contexte": "L'agriculture américaine est l'une des plus performantes du monde, mais elle a un coût pour l'environnement.", "tache": "Pour expliquer la puissance agricole des États-Unis, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Expose les performances de l'agriculture des États-Unis.", "Présente les revers de cette « arme verte » sur l'environnement.", "Propose deux solutions pour atténuer l'un de ces revers."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les États-Unis comptent parmi les premiers producteurs et exportateurs agricoles du monde\n• Problématique : une agriculture puissante mais qui a des conséquences environnementales\n• Plan : performances, revers, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Grandes exploitations, mécanisation, engrais, biotechnologies\n• Spécialisation régionale : Corn Belt (maïs), Wheat Belt (blé), soja, coton, élevage\n• Agrobusiness et soutien de l'État\n• Fortes exportations, arme de la diplomatie économique\n• Transition : cette puissance a des revers"}, {"label": "Consigne 2", "points": 3, "text": "• Érosion et appauvrissement des sols\n• Pollution des eaux par les engrais et pesticides\n• Baisse des nappes souterraines (irrigation)\n• Monoculture et perte de biodiversité\n• Transition : il faut donc atténuer ces effets"}, {"label": "Consigne 3", "points": 3, "text": "• Exemple : pollution par les engrais. Solutions : réduire et mieux cibler les intrants (agriculture de précision), développer l'agriculture biologique et la rotation des cultures\n• Autre exemple : baisse des nappes. Solutions : irrigation économe, cultures moins gourmandes en eau"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une agriculture performante mais qui doit devenir plus durable\n• Ouverture : agriculture et changement climatique"}]}]}, {"id": "CD9", "num": "9", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation", "contexte": "Après l'indépendance, plusieurs pays africains ont dû gérer un héritage colonial lourd.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Cite trois conséquences immédiates de la colonisation sur les nouveaux États africains.", "Explique pourquoi certains pays ont connu une décolonisation plus difficile que d'autres.", "Donne ton opinion sur les liens qui persistent entre certaines anciennes colonies et leur ancienne métropole."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Frontières héritées de la colonisation, souvent sans lien avec les réalités ethniques\n• Manque de cadres et d'administrateurs formés\n• Économies tournées vers l'exportation de matières premières, peu diversifiées"}, {"label": "Consigne 2", "points": 3, "text": "• Selon la présence de colons (nombreux en Algérie, au Kenya) opposés à l'indépendance\n• Selon l'attitude de la métropole (négociation en France, refus au Portugal)\n• Selon la préparation politique et administrative des territoires avant l'indépendance"}, {"label": "Consigne 3", "points": 4, "text": "• Opinion argumentée : des liens historiques, linguistiques et culturels perdurent utilement (coopération, éducation, commerce), mais ils peuvent aussi entretenir une dépendance économique et politique ; un partenariat équilibré doit remplacer les anciens rapports coloniaux"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon", "contexte": "Le Japon est souvent cité comme modèle pour les pays qui cherchent à se développer malgré des ressources naturelles limitées.", "tache": "Pour expliquer la stratégie industrielle du Japon, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les facteurs organisationnels de la réussite industrielle japonaise.", "Détermine les principales branches de cette industrie.", "Dégage les leçons que d'autres pays peuvent en tirer."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : sans grandes ressources naturelles, le Japon est devenu une puissance industrielle\n• Problématique : cette réussite repose sur une organisation particulière, transposable en partie ailleurs\n• Plan : facteurs organisationnels, branches industrielles, leçons"}, {"label": "Consigne 1", "points": 3, "text": "• Grandes firmes intégrées aux banques (keiretsu)\n• Sociétés de commerce (sôgo shosha) qui organisent import-export\n• Réseau dense de sous-traitants\n• Coopération étroite entre l'État et les entreprises\n• Cercles de qualité et forte discipline au travail\n• Transition : cette organisation a permis l'essor de branches précises"}, {"label": "Consigne 2", "points": 3, "text": "• Automobile et construction navale\n• Électronique et robotique\n• Sidérurgie et chimie, en amont des autres industries\n• Transition : cette expérience peut inspirer d'autres pays"}, {"label": "Consigne 3", "points": 3, "text": "• Investir dans la formation technique et la discipline de travail\n• Encourager la coopération entre l'État et les entreprises\n• Organiser les producteurs et sous-traitants en réseaux solidaires\n• Miser sur la qualité pour conquérir des marchés extérieurs"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le modèle japonais repose sur l'organisation plus que sur les ressources\n• Ouverture : l'adapter aux réalités africaines, sans le copier tel quel"}]}]}, {"id": "CD10", "num": "10", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation (Congo belge)", "contexte": "Colonie belge riche en ressources, le Congo accède à l'indépendance en 1960 dans un climat de crise.", "tache": "Pour expliquer l'indépendance mouvementée du Congo belge, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente la colonisation belge au Congo.", "Explique les étapes de l'accession à l'indépendance (1956-1960).", "Décris la crise congolaise après 1960."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : en 1960, de nombreux pays africains accèdent à l'indépendance\n• Problématique : pourquoi l'indépendance du Congo belge a-t-elle été suivie d'une grave crise ?\n• Plan : colonisation, marche vers l'indépendance, crise"}, {"label": "Consigne 1", "points": 3, "text": "• Congo d'abord propriété personnelle du roi Léopold II (1885), abus (caoutchouc, travail forcé) ; repris par la Belgique en 1908\n• Exploitation des richesses minières (cuivre du Katanga, diamant, uranium)\n• Paternalisme : enseignement primaire surtout missionnaire, très peu de cadres congolais formés\n• Discrimination et absence de droits politiques\n• Transition : ces frustrations nourrissent le nationalisme"}, {"label": "Consigne 2", "points": 3, "text": "• Émergence d'une élite (les « évolués ») et de partis : ABAKO de Joseph Kasa-Vubu, MNC de Patrice Lumumba (1958)\n• Émeutes de Léopoldville en janvier 1959\n• Table ronde de Bruxelles (janvier-février 1960) : date de l'indépendance fixée\n• Élections de mai 1960\n• Indépendance proclamée le 30 juin 1960 : Kasa-Vubu président, Lumumba Premier ministre\n• Transition : l'indépendance est très vite menacée"}, {"label": "Consigne 3", "points": 3, "text": "• Mutinerie de la Force publique en juillet 1960\n• Sécession du Katanga (Moïse Tshombé) puis du Sud-Kasaï\n• Intervention de l'ONU et rivalités entre grandes puissances (guerre froide)\n• Destitution puis assassinat de Lumumba (janvier 1961)\n• Prise du pouvoir par Mobutu (coup d'État de 1965)"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'indépendance du Congo a été mal préparée et a plongé le pays dans la crise\n• Ouverture : quelles leçons pour l'unité nationale des États africains ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : environnement", "contexte": "Les activités humaines exercent une pression croissante sur l'environnement, ce qui impose de repenser le développement.", "tache": "Pour montrer la nécessité d'un développement durable, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Décris les problèmes environnementaux actuels.", "Explique leurs causes et leurs conséquences.", "Présente les solutions apportées par le développement durable."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : la planète subit des atteintes de plus en plus graves\n• Problématique : comment concilier développement économique et protection de l'environnement ?\n• Plan : problèmes, causes et conséquences, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Déforestation et perte de biodiversité\n• Désertification et dégradation des sols\n• Pollution de l'air, de l'eau et des sols ; déchets plastiques\n• Réchauffement climatique\n• Transition : quelles en sont les causes et les effets ?"}, {"label": "Consigne 2", "points": 3, "text": "• Causes : croissance démographique, industrialisation, urbanisation, agriculture extensive (brûlis), usage des énergies fossiles\n• Conséquences : sécheresses, inondations, baisse des rendements, famines, maladies, migrations\n• Transition : face à ces dangers, des solutions sont recherchées"}, {"label": "Consigne 3", "points": 3, "text": "• Développement durable : répondre aux besoins du présent sans compromettre ceux des générations futures (piliers économique, social, environnemental)\n• Accords internationaux : Sommet de la Terre de Rio (1992), protocole de Kyoto (1997), accord de Paris (2015)\n• Actions concrètes : reboisement, énergies renouvelables, recyclage, éducation à l'environnement\n• Rôle des États, des ONG et des citoyens"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le développement durable est une nécessité pour l'avenir de l'humanité\n• Ouverture : quel rôle chacun peut-il jouer dans son pays ?"}]}]}, {"id": "CD11", "num": "11", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation (Ghana)", "contexte": "Colonie britannique appelée Gold Coast, le Ghana devient en 1957 le premier pays d'Afrique noire indépendant.", "tache": "Réponds directement aux consignes suivantes pour expliquer la signification de l'indépendance du Ghana.", "support": "", "consignes": ["Présente l'indépendance du Ghana (1957) et le rôle de Kwame Nkrumah.", "Explique l'idée de panafricanisme défendue par Nkrumah.", "Montre la portée et les limites de cette indépendance."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Colonie britannique appelée Gold Coast\n• Indépendance proclamée le 6 mars 1957 à Accra\n• Kwame Nkrumah, leader du Parti de la Convention du Peuple, devient Premier ministre\n• Premier pays d'Afrique noire indépendant"}, {"label": "Consigne 2", "points": 3, "text": "• L'indépendance du Ghana est incomplète tant que d'autres peuples africains restent colonisés\n• Solidarité africaine : conférences d'Accra (1958)\n• Fierté et dignité de l'homme noir : prouver la capacité des Africains à se gouverner\n• Appel au travail et à l'unité nationale"}, {"label": "Consigne 3", "points": 4, "text": "• Portée : effet d'entraînement sur les colonies ; modèle pour les nationalistes ; année 1960 dite « année de l'Afrique » ; création de l'OUA en 1963\n• Limites : difficultés économiques, pouvoir de plus en plus autoritaire, coup d'État de 1966\n• Unité africaine réalisée en partie seulement (OUA puis Union africaine en 2002)"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : Bénin, commerce", "contexte": "Situé sur le golfe de Guinée, le Bénin joue un rôle de pays de transit et d'échanges dans la sous-région.", "tache": "Réponds directement aux consignes suivantes pour montrer le rôle commercial du Bénin.", "support": "", "consignes": ["Présente les atouts du Bénin pour le commerce de transit.", "Cite les principaux produits échangés et les partenaires du Bénin.", "Montre les difficultés du commerce béninois."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Façade maritime et port autonome de Cotonou : débouché pour les pays sans accès à la mer (Niger, Burkina Faso, Mali)\n• Voisinage du Nigeria, grand marché de consommation\n• Corridors routiers (Cotonou–Malanville–Niamey) et aéroport\n• Marchés importants comme Dantokpa"}, {"label": "Consigne 2", "points": 3, "text": "• Exportations : coton, noix de cajou, autres produits agricoles\n• Importations : riz, produits pétroliers, véhicules d'occasion, produits manufacturés\n• Réexportation vers le Nigeria et les pays voisins\n• Partenaires : Chine, Inde, Union européenne, Nigeria et pays de la sous-région"}, {"label": "Consigne 3", "points": 4, "text": "• Forte dépendance vis-à-vis du coton\n• Commerce informel et contrebande, notamment vers le Nigeria\n• Effets des fermetures de frontière du Nigeria (2019-2020)\n• Congestion du port et insuffisance des infrastructures\n• Concurrence des ports voisins (Lomé, Tema, Lagos) et insécurité au Sahel"}]}]}, {"id": "CD12", "num": "12", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : ONU, bilan", "contexte": "L'ONU est née en 1945 pour préserver la paix, mais son bilan est contrasté.", "tache": "Réponds directement aux consignes suivantes pour dresser le bilan de l'ONU.", "support": "", "consignes": ["Présente les objectifs de l'ONU.", "Cite les succès de l'ONU.", "Montre les échecs et les limites de l'ONU."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Maintenir la paix et la sécurité internationales\n• Développer des relations amicales entre les nations\n• Favoriser la coopération économique, sociale et culturelle\n• Promouvoir les droits de l'homme\n• Création : Charte de San Francisco, entrée en vigueur le 24 octobre 1945"}, {"label": "Consigne 2", "points": 3, "text": "• Soutien à la décolonisation (résolution 1514 de 1960)\n• Opérations de maintien de la paix (Casques bleus)\n• Action des agences : OMS (lutte contre les maladies), FAO, UNESCO, UNICEF\n• Aide humanitaire (HCR, PAM)\n• Absence de troisième guerre mondiale"}, {"label": "Consigne 3", "points": 4, "text": "• Droit de veto qui bloque des décisions importantes\n• Conflits non résolus (Proche-Orient, Syrie…)\n• Manque de moyens propres, dépendance financière envers les grandes puissances\n• Échec de la prévention de certains drames (Rwanda en 1994)\n• Critiques sur la composition du Conseil de sécurité (peu représentative)"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : États-Unis (industrie)", "contexte": "Première puissance économique mondiale pendant des décennies, les États-Unis possèdent une industrie très développée.", "tache": "Réponds directement aux consignes suivantes pour expliquer la puissance industrielle américaine.", "support": "", "consignes": ["Présente les facteurs de la puissance industrielle des États-Unis.", "Cite les grandes régions industrielles.", "Montre les limites de cette puissance."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Ressources abondantes : charbon, pétrole, gaz, fer, cuivre\n• Capitaux importants et grandes entreprises\n• Innovation, recherche et universités performantes\n• Grand marché intérieur et main-d'œuvre qualifiée\n• Réseau de transports développé (routes, voies ferrées, fleuves, ports)"}, {"label": "Consigne 2", "points": 3, "text": "• Nord-Est et Grands Lacs (ceinture manufacturière) : automobile (Detroit), sidérurgie, machines\n• Californie : électronique, informatique, aéronautique (Silicon Valley)\n• Sud et Golfe du Mexique (Texas) : pétrole, pétrochimie"}, {"label": "Consigne 3", "points": 4, "text": "• Concurrence de l'Asie (notamment de la Chine)\n• Déclin de certaines régions industrielles anciennes\n• Déficit commercial important\n• Pollution et émissions élevées\n• Inégalités sociales"}]}]}, {"id": "CD13", "num": "13", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : ONU", "contexte": "Créée pour préserver la paix, l'ONU dispose de moyens pour prévenir et régler les conflits.", "tache": "Pour expliquer l'action de l'ONU en faveur de la paix, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente le Conseil de sécurité, principal organe chargé de la paix.", "Décris les moyens d'action de l'ONU pour maintenir la paix.", "Détermine les limites de cette action."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : après deux guerres mondiales, les États créent l'ONU en 1945\n• Problématique : de quels moyens l'ONU dispose-t-elle pour maintenir la paix et quelles en sont les limites ?\n• Plan : Conseil de sécurité, moyens d'action, limites"}, {"label": "Consigne 1", "points": 3, "text": "• 15 membres : 5 permanents (États-Unis, Russie, Chine, France, Royaume-Uni) disposant du droit de veto, et 10 non permanents élus pour deux ans\n• Responsabilité principale du maintien de la paix et de la sécurité internationales\n• Résolution adoptée avec 9 voix sur 15, sans veto d'un membre permanent\n• Décisions obligatoires pour les États membres\n• Transition : pour agir, le Conseil dispose de plusieurs moyens"}, {"label": "Consigne 2", "points": 3, "text": "• Médiation et négociations diplomatiques\n• Sanctions économiques et embargos\n• Casques bleus : observation, interposition, protection des civils\n• Cour internationale de Justice (La Haye) : règlement pacifique des différends entre États\n• Aide humanitaire (HCR, PAM)\n• Transition : malgré ces moyens, l'action de l'ONU reste limitée"}, {"label": "Consigne 3", "points": 3, "text": "• Droit de veto qui paralyse le Conseil (Syrie, conflits du Proche-Orient)\n• Absence d'armée propre : dépendance des contingents fournis par les États\n• Dépendance financière envers les grandes puissances\n• Non-respect de certaines résolutions\n• Échecs de prévention (Rwanda, 1994)"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'ONU a évité une troisième guerre mondiale mais son efficacité reste limitée\n• Ouverture : quelle réforme du Conseil de sécurité pour mieux représenter l'Afrique ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : États-Unis", "contexte": "Vaste pays doté d'infrastructures puissantes, les États-Unis dominent le commerce mondial.", "tache": "Pour expliquer le rôle des transports et du commerce dans la puissance américaine, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente le réseau de transports des États-Unis.", "Montre le rôle du commerce extérieur dans la puissance du pays.", "Détermine les limites de cette puissance commerciale."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les États-Unis sont la première puissance économique par la production et les échanges\n• Problématique : comment les transports et le commerce soutiennent-ils cette puissance, et quelles en sont les limites ?\n• Plan : transports, commerce extérieur, limites"}, {"label": "Consigne 1", "points": 3, "text": "• Réseau d'autoroutes très dense\n• Voies ferrées utilisées surtout pour le fret\n• Voies navigables : Mississippi et Grands Lacs\n• Grands ports (New York, Los Angeles–Long Beach) et grands aéroports\n• Oléoducs et gazoducs\n• Transition : ces infrastructures facilitent les échanges"}, {"label": "Consigne 2", "points": 3, "text": "• L'un des tout premiers exportateurs et importateurs du monde\n• Exportations : produits agricoles (soja, maïs, blé), avions, machines, produits de haute technologie\n• Importations : pétrole, produits électroniques, biens de consommation\n• Partenaires : Canada, Mexique, Chine, Union européenne\n• Rôle du dollar et de Wall Street, grandes firmes multinationales\n• Transition : cette puissance présente des limites"}, {"label": "Consigne 3", "points": 3, "text": "• Déficit commercial important\n• Vieillissement de certaines infrastructures et congestion urbaine\n• Pollution liée aux transports et dépendance à la voiture\n• Concurrence de la Chine et tensions commerciales"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : les transports et le commerce sont des piliers de la puissance américaine, mais celle-ci est contestée\n• Ouverture : quelle place pour les pays africains dans le commerce mondial ?"}]}]}, {"id": "CD14", "num": "14", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : décolonisation", "contexte": "Plusieurs causes, internes et externes, expliquent la marche des peuples colonisés vers l'indépendance.", "tache": "Réponds directement aux consignes suivantes pour expliquer les causes de la décolonisation.", "support": "", "consignes": ["Cite quatre facteurs internes de la décolonisation.", "Cite quatre facteurs externes de la décolonisation.", "Explique le rôle de la Seconde Guerre mondiale."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Rôle de l'école, qui diffuse les idées de liberté et d'égalité\n• Rôle des églises\n• Action des partis politiques, des syndicats et des intellectuels nationalistes\n• Rôle de la presse\n• Abus de la colonisation : travail forcé, impôts, discrimination\n• Retour des anciens combattants"}, {"label": "Consigne 2", "points": 3, "text": "• Charte de l'Atlantique (1941)\n• Création de l'ONU (1945) et affirmation du droit des peuples à disposer d'eux-mêmes\n• Indépendances asiatiques (Inde en 1947)\n• Attitude anticolonialiste des États-Unis et de l'URSS\n• Conférence de Bandung (1955)\n• Indépendance du Ghana (1957)"}, {"label": "Consigne 3", "points": 4, "text": "• Affaiblissement économique et politique de la France et du Royaume-Uni\n• Participation des colonies à la guerre (soldats, matières premières) et attentes de récompense\n• Chute du prestige de l'Européen (défaite de 1940)\n• Contact des soldats avec les idées de liberté\n• Promesses de réformes (conférence de Brazzaville, 1944)"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Japon", "contexte": "Malgré ses handicaps naturels, le Japon s'est imposé comme une grande puissance industrielle et commerciale.", "tache": "Pour expliquer la puissance industrielle et commerciale du Japon, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts de l'industrie japonaise.", "Décris les aspects de sa puissance commerciale.", "Détermine les limites de cette puissance."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : pays pauvre en ressources, le Japon est devenu l'une des premières puissances industrielles\n• Problématique : sur quoi reposent l'industrie et le commerce japonais, et quelles en sont les limites ?\n• Plan : atouts, puissance commerciale, limites"}, {"label": "Consigne 1", "points": 3, "text": "• Capital humain : éducation de qualité, discipline et sens du travail\n• Rôle de l'État dans l'orientation de l'économie après 1945\n• Grandes firmes (Toyota, Sony, Mitsubishi)\n• Recherche et innovation (électronique, robotique)\n• Ceinture industrielle du Pacifique et grands ports\n• Transition : cette industrie nourrit un puissant commerce extérieur"}, {"label": "Consigne 2", "points": 3, "text": "• Exportations : automobiles, électronique, machines, navires\n• Importations : pétrole, gaz, minerais, autres matières premières\n• Partenaires : Chine, États-Unis, pays d'Asie du Sud-Est\n• Investissements des firmes japonaises à l'étranger\n• Transition : cette puissance a pourtant des limites"}, {"label": "Consigne 3", "points": 3, "text": "• Dépendance énergétique et en matières premières\n• Vieillissement de la population et faible natalité\n• Concurrence de la Chine et de la Corée du Sud\n• Catastrophes naturelles (séismes, tsunamis, Fukushima en 2011)"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Japon est une puissance commerciale majeure mais fragile\n• Ouverture : quels enseignements pour le Bénin ?"}]}]}, {"id": "CD15", "num": "15", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "Thème : décolonisation (Afrique française)", "contexte": "Dans la plupart des colonies françaises d'Afrique noire, l'indépendance a été obtenue sans guerre, par étapes.", "tache": "Pour expliquer la décolonisation pacifique en Afrique noire française, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les réformes françaises de 1944 à 1956.", "Explique le référendum du 28 septembre 1958 et la création de la Communauté.", "Retrace l'accession à l'indépendance en 1960."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : après 1945, la France fait des concessions à ses colonies\n• Problématique : comment l'indépendance a-t-elle été obtenue sans guerre en Afrique noire française ?\n• Plan : réformes de 1944 à 1956, référendum de 1958, indépendances de 1960"}, {"label": "Consigne 1", "points": 3, "text": "• Conférence de Brazzaville (1944) : promesses de réformes\n• Union française (1946) : représentation des colonies à l'Assemblée nationale\n• Suppression de l'indigénat et du travail forcé (1946)\n• Loi-cadre Defferre (1956) : suffrage universel et autonomie interne (assemblées territoriales, conseils de gouvernement)\n• Transition : ces réformes préparent l'étape suivante"}, {"label": "Consigne 2", "points": 3, "text": "• Retour du général de Gaulle au pouvoir en 1958 et nouvelle Constitution\n• Référendum du 28 septembre 1958 : choix entre la Communauté (autonomie) et l'indépendance immédiate\n• Tous les territoires votent oui, sauf la Guinée de Sékou Touré, indépendante dès octobre 1958\n• La France conserve la défense, la diplomatie et la monnaie dans la Communauté\n• Transition : l'élan des indépendances s'accélère"}, {"label": "Consigne 3", "points": 3, "text": "• Revendication de l'indépendance par la Fédération du Mali (1960)\n• Possibilité d'accéder à l'indépendance tout en restant lié à la France\n• Indépendance du Dahomey le 1er août 1960 (Hubert Maga)\n• Dix-sept pays indépendants en 1960, « année de l'Afrique »\n• Admission de ces États à l'ONU"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : la décolonisation a été négociée et progressive, mais les liens avec la France demeurent\n• Ouverture : quels défis pour ces jeunes États après l'indépendance ?"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "Thème : environnement", "contexte": "Le réchauffement climatique est l'un des plus grands défis de la planète.", "tache": "Réponds directement aux consignes suivantes pour expliquer le réchauffement climatique.", "support": "", "consignes": ["Explique ce qu'est le réchauffement climatique et ses causes.", "Décris ses conséquences.", "Propose des solutions pour y faire face."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Élévation progressive de la température moyenne de la planète\n• Gaz à effet de serre : dioxyde de carbone, méthane\n• Causes : combustion du charbon, du pétrole et du gaz, industries, transports, déforestation, agriculture et élevage"}, {"label": "Consigne 2", "points": 3, "text": "• Fonte des glaciers et hausse du niveau de la mer\n• Inondations côtières et érosion du littoral (exemple : côte béninoise)\n• Sécheresses et pluies irrégulières\n• Baisse des rendements agricoles, famines, migrations\n• Multiplication des phénomènes extrêmes"}, {"label": "Consigne 3", "points": 4, "text": "• Réduire les émissions de gaz à effet de serre\n• Développer les énergies renouvelables (solaire, éolien)\n• Reboiser et protéger les forêts\n• Accords internationaux : Rio (1992), Kyoto (1997), Paris (2015)\n• Adaptation : cultures résistantes à la sécheresse, protection du littoral\n• Éducation et gestes individuels"}]}]}, {"id": "CD16", "num": "16", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "Thème : ONU", "contexte": "L'ONU agit à travers plusieurs organes et agences spécialisées dans tous les domaines de la vie des peuples.", "tache": "Réponds directement aux consignes suivantes pour présenter les organes et agences de l'ONU.", "support": "", "consignes": ["Cite quatre agences spécialisées de l'ONU et leur domaine d'action.", "Présente le rôle de l'Assemblée générale et de la Cour internationale de Justice.", "Montre l'importance de ces agences pour les pays africains."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• OMS : santé\n• FAO : alimentation et agriculture\n• UNESCO : éducation, science et culture\n• UNICEF : protection de l'enfance\n• PAM : aide alimentaire\n• HCR : réfugiés"}, {"label": "Consigne 2", "points": 3, "text": "• Assemblée générale : tous les États membres, une voix par État ; débat des grandes questions, recommandations, vote du budget, élection des membres non permanents du Conseil de sécurité\n• Cour internationale de Justice : siège à La Haye, règle les différends juridiques entre États et donne des avis consultatifs"}, {"label": "Consigne 3", "points": 4, "text": "• Vaccination et lutte contre les maladies (paludisme, sida)\n• Aide alimentaire lors des famines et soutien à l'agriculture\n• Développement de l'éducation et scolarisation des enfants\n• Assistance aux réfugiés et aux déplacés\n• Appui technique et financier aux projets de développement"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "Thème : Bénin, commerce", "contexte": "Le commerce est un secteur clé de l'économie béninoise, mais il fait face à de nombreux obstacles.", "tache": "Pour expliquer les atouts et les difficultés du commerce béninois, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts du commerce béninois.", "Décris les difficultés rencontrées.", "Propose des solutions pour y remédier."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Bénin occupe une position de carrefour commercial en Afrique de l'Ouest\n• Problématique : quels sont les atouts du commerce béninois, ses difficultés et les moyens de les surmonter ?\n• Plan : atouts, difficultés, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Port de Cotonou : débouché pour les pays sans littoral (Niger, Burkina Faso, Mali)\n• Voisinage du Nigeria, grand marché de consommation\n• Corridors routiers et aéroport international\n• Grands marchés comme Dantokpa\n• Appartenance à la CEDEAO et à l'UEMOA\n• Transition : ces atouts se heurtent à des difficultés"}, {"label": "Consigne 2", "points": 3, /* ================= État & stockage ================= */
let state = {
  serie:null, tab:'fiches', view:'home', filter:'', detail:null,
  epMode:'ep', scroll:0, pushed:false,
  rev:{ mode:'cards', f:'all', shuffle:false, deck:null, pos:0, shown:false, ok:0, redo:0 },
  rep:'chrono', test:false,
  quiz:{ screen:'groups', groupIdx:null, quizIdx:null, pos:0, picked:null, checked:false, ok:0 }
};
const SK = 'hgb_progress_v2';

function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k,fallback){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }

let P = load(SK, {});
function persist(){ save(SK, P); }
function prog(g){
  P[g] = P[g] || {};
  ['read','qa','ep','ex','qz'].forEach(k=>{ P[g][k] = P[g][k] || {}; });
  return P[g];
}
function hash(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function ficheKey(f){ return hash(f.groupe+'|'+f.rubrique); }
function qaKey(it){ return hash(it.sa+'|'+it.q); }
function rec(kind,id){
  const s = prog(groupKey())[kind];
  s[id] = s[id] || {sc:{}, dr:{}, sn:{}};
  return s[id];
}

/* ================= Utilitaires ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function fmt(n){ return String(n).replace('.',','); }
function rich(s){
  const lines = String(s||'').split('\n');
  let out='', inList=false;
  lines.forEach(l=>{
    if(l.startsWith('• ')){
      if(!inList){ out+='<ul class="bul">'; inList=true; }
      out += '<li>'+esc(l.slice(2))+'</li>';
    } else {
      if(inList){ out+='</ul>'; inList=false; }
      if(l.trim()) out += '<p class="rp0">'+esc(l)+'</p>';
    }
  });
  if(inList) out+='</ul>';
  return out;
}
function groupKey(){ return state.serie === 'AB' ? 'ab' : 'cd'; }
function currentData(){ return DATA[groupKey()]; }
function bar(label, pair){
  const a=pair[0], b=pair[1];
  const pct = b ? Math.round(100*a/b) : 0;
  return `<div class="bl"><span>${esc(label)}</span><span>${a}/${b}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
}

function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  save('theme', next);
}
(function initTheme(){
  let t = load('theme', null);
  if(!t){ try{ t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }catch(e){ t='light'; } }
  document.documentElement.setAttribute('data-theme', t);
})();
const FS = [100,112,125];
