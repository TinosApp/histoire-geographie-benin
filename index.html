<title>Histoire-Géo Bénin — Terminale</title>
<style>
:root{
  --bg:#faf7f2; --surface:#ffffff; --text:#20242b; --muted:#5b6270;
  --border:#e4ddd0; --accent:#1f4e78; --accent2:#b5502e; --chip:#eef2f6;
  --ok:#2e7d4f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#181a1f; --surface:#20232a; --text:#eceef1; --muted:#a3aab8;
  --border:#31353e; --accent:#7fb2e0; --accent2:#e08a63; --chip:#262b33; --ok:#7fd19f;
}
*{box-sizing:border-box;}
html{height:100%; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header.top{
  position:sticky; top:0; z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + .7rem) 1rem .7rem;
  background:var(--accent); color:#fff;
  display:flex; align-items:center; gap:.6rem;
}
header.top button.icon{
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); color:#fff;
  border-radius:8px; padding:.4rem .6rem; font-size:1rem; line-height:1;
}
header.top h1{font-size:1rem; margin:0; flex:1; font-weight:600;}
main{max-width:720px; margin:0 auto; padding:1rem 1rem calc(env(safe-area-inset-bottom,0px) + 4.5rem);}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:1rem 1.1rem; margin-bottom:.8rem;
}
.card.tap{cursor:pointer;}
.card.tap:active{transform:scale(.99);}
h2.sec{font-size:1.05rem; margin:1.4rem 0 .6rem; color:var(--accent);}
h2.sec:first-child{margin-top:.2rem;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.7rem;}
.big-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.3rem; padding:1.3rem .5rem; border-radius:16px; border:1px solid var(--border);
  background:var(--surface); font-size:1.3rem; font-weight:700; color:var(--accent);
}
.big-btn small{font-size:.72rem; font-weight:500; color:var(--muted);}
.tag{
  display:inline-block; background:var(--chip); color:var(--accent);
  font-size:.7rem; font-weight:700; padding:.15rem .5rem; border-radius:6px; margin-right:.3rem;
}
.muted{color:var(--muted); font-size:.85rem;}
.row{display:flex; align-items:center; gap:.5rem;}
.row.between{justify-content:space-between;}
input[type=search]{
  width:100%; padding:.65rem .9rem; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:.95rem;
}
.list-item{
  padding:.8rem .2rem; border-bottom:1px solid var(--border); cursor:pointer;
}
.list-item:last-child{border-bottom:none;}
.list-item h3{margin:0 0 .2rem; font-size:.95rem; font-weight:600;}
.list-item p{margin:0; font-size:.82rem; color:var(--muted); white-space:pre-line;}
.pill-row{display:flex; flex-wrap:wrap; gap:.4rem; margin:.5rem 0 1rem;}
.pill{
  padding:.35rem .8rem; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); font-size:.8rem; color:var(--text);
}
.pill.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.consigne-list{padding-left:1.1rem; margin:.4rem 0;}
.consigne-list li{margin:.3rem 0;}
.reveal-btn{
  margin-top:.8rem; padding:.6rem 1rem; border-radius:10px; border:none;
  background:var(--accent); color:#fff; font-weight:600; font-size:.85rem;
}
.corr-block{
  margin-top:.6rem; padding:.7rem .9rem; background:var(--chip); border-radius:10px;
  white-space:pre-line; font-size:.88rem; display:none;
}
.corr-block.shown{display:block;}
.qa-card .a{display:none; margin-top:.5rem; padding-top:.5rem; border-top:1px dashed var(--border); color:var(--ok); font-size:.9rem; white-space:pre-line;}
.qa-card .a.shown{display:block;}
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; max-width:720px; margin:0 auto;
}
nav.tabbar button{
  flex:1; background:none; border:none; padding:.6rem 0 .5rem; color:var(--muted);
  font-size:.68rem; display:flex; flex-direction:column; align-items:center; gap:.15rem;
}
nav.tabbar button .ic{font-size:1.15rem;}
nav.tabbar button.active{color:var(--accent); font-weight:700;}
.empty{text-align:center; color:var(--muted); padding:2rem 1rem; font-size:.9rem;}
.badge-pts{background:var(--chip); color:var(--accent); font-size:.72rem; font-weight:700; padding:.1rem .5rem; border-radius:6px;}
.center{text-align:center;}
.fade-in{animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
::selection{background:var(--accent); color:#fff;}
/* ---- v2 : ajouts ---- */
button{font-family:inherit;}
:root[data-theme="dark"] header.top{background:#1d3a57;}
:root[data-theme="dark"] .reveal-btn,
:root[data-theme="dark"] .pill.active{color:#0d2236;}
.corr-block, .qa-card .a{white-space:normal;}
.corr-block .el{margin:0 0 .9rem; padding-bottom:.7rem; border-bottom:1px dashed var(--border);}
.corr-block .el:last-of-type{border-bottom:none;}
.rp0{margin:.3rem 0;}
ul.bul{margin:.3rem 0; padding-left:1.15rem;}
ul.bul li{margin:.25rem 0; line-height:1.5;}
.body p, .body ul{line-height:1.6;}
.bar{height:6px; background:var(--chip); border-radius:6px; overflow:hidden; margin:.15rem 0 .6rem;}
.bar i{display:block; height:100%; background:var(--ok); border-radius:6px; transition:width .3s;}
.bl{display:flex; justify-content:space-between; font-size:.75rem; color:var(--muted); margin-top:.35rem;}
.serie-card{
  display:block; width:100%; text-align:left; background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:16px; padding:1rem 1.1rem; margin-bottom:.8rem;
}
.serie-card:active{transform:scale(.99);}
.serie-card .stitle{font-size:1.25rem; font-weight:700; color:var(--accent);}
.serie-card .go{font-size:1.8rem; color:var(--muted); line-height:1;}
.chip{display:inline-block; background:var(--chip); color:var(--muted); font-size:.7rem; font-weight:700; padding:.15rem .5rem; border-radius:6px; white-space:nowrap;}
.chip.ok{color:var(--ok);}
.okmark{color:var(--ok); font-weight:700;}
.grade{display:block; margin-top:.45rem; font-size:.8rem; color:var(--muted);}
.grade select{
  font-size:.85rem; padding:.2rem .4rem; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); color:var(--text);
}
.total{font-weight:700; color:var(--accent); margin:.4rem 0 0;}
details.draft{margin-top:.8rem;}
details.draft summary, details.meth summary{cursor:pointer; font-weight:600; color:var(--accent); font-size:.9rem;}
details.draft textarea{

<script>
const DATA = {"ab": {"sa": {"SA1": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "SA2": "L'ONU et la gestion du monde", "SA3": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "SA4": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "SA5": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "SA6": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO"}, "fiches": [{"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "Notions clés", "texte": "• Dépendance\n• Exportation de matières premières\n• Secteur informel\n• Commerce de transit"}, {"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "À retenir", "texte": "• Le coton est le produit d'exportation majeur\n• Le port de Cotonou alimente le commerce avec le Nigeria et l'hinterland\n• L'industrie est faible"}, {"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "Voie de sortie", "texte": "• Transformer sur place\n• Diversifier l'économie\n• Investir dans les infrastructures"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Création", "texte": "• 1945, à San Francisco, avec la Charte des Nations unies"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Organes", "texte": "• Assemblée générale\n• Conseil de sécurité (5 membres permanents : États-Unis, Russie, Royaume-Uni, France, Chine)\n• Secrétariat\n• Cour internationale de justice\n• ECOSOC"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Missions", "texte": "• Maintenir la paix (casques bleus)\n• Défendre les droits de l'homme\n• Favoriser le développement"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Dahomey", "texte": "• Admis à l'ONU en septembre 1960"}, {"groupe": "SA3", "titre": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "rubrique": "Notions clés", "texte": "• Puissance sans ressources\n• Valeur ajoutée\n• Firmes multinationales"}, {"groupe": "SA3", "titre": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "rubrique": "Espace", "texte": "• Industrie concentrée sur la façade pacifique (Tokyo, Osaka, Nagoya)"}, {"groupe": "SA3", "titre": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "rubrique": "Atouts", "texte": "• Technologie\n• Main-d'œuvre qualifiée\n• Exportations (automobile, électronique)"}, {"groupe": "SA3", "titre": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "rubrique": "Limites", "texte": "• Vieillissement de la population\n• Dépendance énergétique"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Repères chronologiques", "texte": "• Béhanzin (1892-1894)\n• AOF (1895)\n• Brazzaville (1944)\n• Bandung (1955)\n• Loi-cadre Defferre (1956)\n• Référendum de 1958"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Dahomey", "texte": "• Indépendance le 1er août 1960\n• Hubert Maga, premier président"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Acteurs", "texte": "• Partis politiques\n• Syndicats\n• Élites\n• Soutien de l'ONU"}, {"groupe": "SA5", "titre": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "rubrique": "Notion clé", "texte": "• Pays émergent : forte croissance mais inégalités persistantes"}, {"groupe": "SA5", "titre": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "rubrique": "Chine", "texte": "• Réformes de 1978\n• Zones économiques spéciales (Shenzhen)\n• « Atelier du monde »"}, {"groupe": "SA5", "titre": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "rubrique": "Brésil", "texte": "• Agriculture (soja, café, canne à sucre)\n• Industrie autour de São Paulo\n• Questions d'environnement (Amazonie)"}, {"groupe": "SA5", "titre": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "rubrique": "Point commun", "texte": "• Membres des BRICS"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "Notions clés", "texte": "• Regroupement économique : association de pays qui réduisent les obstacles à leurs échanges\n• Niveaux d'intégration : zone de libre-échange, union douanière, marché commun, union économique et monétaire\n• Autres exemples : Union européenne, ALENA/ACEUM, ASEAN, MERCOSUR"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "La CEDEAO en bref", "texte": "• Communauté Économique des États de l'Afrique de l'Ouest\n• Création : 28 mai 1975, traité de Lagos, 15 pays fondateurs\n• Traité révisé : Cotonou, 1993\n• Siège : Abuja (Nigeria)\n• Objectifs : union économique, libre circulation, développement commun, paix et stabilité"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "Organes principaux", "texte": "• Conférence des chefs d'État (organe suprême)\n• Conseil des ministres\n• Commission (organe exécutif, Abuja)\n• Parlement et Cour de justice\n• BIDC (banque d'investissement, Lomé)"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "Réalisations", "texte": "• Libre circulation : protocole de 1979\n• Paix et sécurité : ECOMOG (Libéria, Sierra Leone)\n• Infrastructures : corridors de transport (Abidjan-Lagos), énergie\n• Commerce : tarif extérieur commun\n• Monnaie : franc CFA (UEMOA) et projet de monnaie commune"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "Difficultés", "texte": "• Faible commerce entre pays membres\n• Insuffisance des infrastructures, lourdeurs administratives\n• Instabilité politique\n• Diversité des langues, monnaies et niveaux de développement\n• Retrait du Mali, du Burkina Faso et du Niger en 2025"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "Le Bénin et la CEDEAO", "texte": "• Pays côtier, port de Cotonou porte d'entrée de l'hinterland\n• Fort lien commercial avec le Nigeria\n• Accès à un grand marché et libre circulation\n• Défis : commerce informel, dépendance envers le voisin nigérian"}, {"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "Agriculture (atouts, problèmes)", "texte": "• Atouts : climats variés, relief peu accidenté, sols fertiles, vallées de l'Ouémé et du Mono, main-d'œuvre rurale nombreuse\n• Problèmes : agriculture surtout traditionnelle et peu mécanisée, aléas climatiques, dépendance au coton (cours mondiaux, coûts de production), difficultés d'accès au crédit, pistes rurales dégradées, faible transformation locale\n• Mesures de l'État : diversification (anacarde, ananas, riz, manioc, karité), mécanisation, aménagements hydro-agricoles, appui à la sécurité alimentaire (ONASA)"}, {"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "Industrie (atouts, problèmes, solutions)", "texte": "• Atouts : relief peu accidenté, ressources minières (calcaire, marbre, or, fer), cours d'eau, jeunesse de la population, marché sous-régional (CEDEAO, UEMOA), choix libéral depuis 1990, microfinance\n• Problèmes : tissu industriel faible et peu diversifié, industries légères de première transformation, équipements vieillissants, insuffisance d'énergie, manque de capitaux et de main-d'œuvre qualifiée, marché intérieur étroit, concurrence des produits importés frauduleusement\n• Solutions : transformer les matières premières locales, soutenir les PME/PMI, améliorer l'énergie, lutter contre la fraude, former, encourager l'investissement privé"}, {"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "Tourisme (potentialités, actions, solutions)", "texte": "• Atouts naturels : côte d'environ 125 km, Ganvié, parcs de la Pendjari et du W, chutes de Kota et de Tanougou, sources thermales (Possotomè), forêts sacrées\n• Atouts historiques et culturels : Vodoun, palais royaux d'Abomey, Ouidah (Porte du non-retour), tata somba, fêtes culturelles\n• Actions de l'État : promotion de la destination Bénin, textes encadrant le secteur, appui des partenaires, protection des aires protégées\n• Solutions : sécurité et hôtellerie de qualité, lutte contre la corruption et la pollution des sites, tarifs adaptés, partenariats avec les grands opérateurs"}, {"groupe": "SA1", "titre": "Organisation économique d'un pays à économie dominée : le cas du Bénin", "rubrique": "Transports", "texte": "• Rôle : le Bénin vit de l'agriculture, du commerce et du transit vers le Nigeria et les pays de l'hinterland ; de bons transports réduisent les coûts, créent des emplois, désenclavent les zones rurales\n• Problèmes : routes dégradées, insuffisance d'entretien, surcharge des camions, encombrement autour du port de Cotonou\n• Conséquences d'un mauvais réseau : hausse des coûts, accidents, isolement des villages, baisse des échanges"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Genèse de l'ONU (1941-1945)", "texte": "• Charte de l'Atlantique (août 1941)\n• Déclaration des Nations unies (1er janvier 1942)\n• Conférences de Moscou (octobre 1943) et de Téhéran (fin 1943)\n• Dumbarton Oaks (août-octobre 1944)\n• Yalta (février 1945)\n• San Francisco (avril-juin 1945), signature de la Charte le 26 juin ; entrée en vigueur le 24 octobre 1945"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Conseil de sécurité", "texte": "• 15 membres : 5 permanents avec droit de veto (États-Unis, Russie, Royaume-Uni, France, Chine) et 10 non permanents élus pour 2 ans\n• Présidence tournante chaque mois ; siège à New York\n• Décision de fond : 9 voix sur 15, sans veto d'un membre permanent (l'abstention ne bloque pas)\n• Pouvoirs : enquêter, recommander, imposer des sanctions, envoyer des casques bleus, autoriser l'usage de la force"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Problèmes liés au droit de veto", "texte": "• Contraire à l'égalité des États membres\n• Paralyse le Conseil quand un permanent défend ses intérêts\n• Décisions inégales selon les crises\n• Demande de réformes : élargissement du Conseil, meilleure représentation de l'Afrique"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Rôle dans la décolonisation", "texte": "• Charte de 1945 : droit des peuples à disposer d'eux-mêmes\n• Conseil de tutelle (suivi des territoires sous tutelle)\n• Déclaration du 14 décembre 1960 sur l'octroi de l'indépendance aux peuples coloniaux (résolution 1514)\n• Tribune des pays afro-asiatiques, admission des nouveaux États"}, {"groupe": "SA2", "titre": "L'ONU et la gestion du monde", "rubrique": "Agences et sigles (sièges)", "texte": "• PAM : Programme alimentaire mondial (Rome)\n• FAO : alimentation et agriculture (Rome)\n• OMS : Organisation mondiale de la santé (Genève)\n• FMI : Fonds monétaire international (Washington)\n• CNUCED : commerce et développement (Genève)\n• PNUD : Programme des Nations unies pour le développement (New York)\n• UNESCO : éducation, science et culture (Paris)\n• UNICEF : enfance (New York)\n• HCR : réfugiés (Genève)"}, {"groupe": "SA3", "titre": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "rubrique": "Atouts du Japon", "texte": "• Naturels : insularité (vaste zone économique exclusive, pêche, ports), pauvreté en ressources compensée par l'importation\n• Humains : population nombreuse et instruite, discipline, forte épargne, faible absentéisme, esprit de groupe\n• Organisationnels : grandes firmes intégrées aux banques, sociétés de commerce (sôgo shosha), nombreuses sous-traitantes, coopération État-entreprises (MITI), cercles de qualité"}, {"groupe": "SA3", "titre": "Organisation économique d'un pays à économie dominante : l'exemple du Japon", "rubrique": "Problèmes et stratégies du Japon", "texte": "• Problèmes : territoire exigu, dépendance en énergie et minerais, vieillissement de la population, concurrence (Chine, Corée du Sud, États-Unis, UE), déclin de certaines industries (textile), catastrophes naturelles\n• Stratégies : restructuration industrielle, recherche-développement, industries de haute technologie, délocalisations vers l'Asie du Sud-Est, diversification des partenaires\n• Attention : le rang du Japon (longtemps 3e puissance économique) évolue ; vérifier le classement actuel avant de l'enseigner"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Facteurs de la décolonisation", "texte": "• Facteurs internes : rôle de l'école et des églises (idées de liberté et d'égalité), intellectuels, partis politiques et syndicats, mouvements nationalistes\n• Facteurs externes : Seconde Guerre mondiale, ONU, hostilité des États-Unis et de l'URSS au colonialisme, conférence de Bandung (1955), indépendance de l'Asie et du Ghana (1957)"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Réformes françaises 1944-1956", "texte": "• Conférence de Brazzaville (30 janvier-8 février 1944) : réformes promises, indépendance et autonomie exclues\n• 27 octobre 1946 : Constitution de la IVe République, Union française ; représentation des colonies au Parlement, assemblées territoriales\n• 1946 : fin du travail forcé et du code de l'indigénat ; création du RDA (Bamako)\n• 23 juin 1956 : loi-cadre Defferre : collège unique, suffrage universel, conseils de gouvernement, assemblées territoriales renforcées, africanisation des cadres"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Référendum de 1958 et Guinée", "texte": "• Retour de de Gaulle en 1958 : Ve République et Communauté franco-africaine\n• Référendum du 28 septembre 1958 : « oui » (dont le Dahomey) ou « non »\n• La Guinée de Sékou Touré vote « non » et devient indépendante le 2 octobre 1958"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Étapes du Dahomey (1958-1960)", "texte": "• 4 décembre 1958 : République du Dahomey, État autonome dans la Communauté\n• 14 février 1959 : première Constitution\n• Avril 1959 : élections législatives ; mai 1959 : Hubert Maga chef du gouvernement\n• 1959 : participation aux regroupements (Fédération du Mali, Conseil de l'Entente)\n• 11 juillet 1960 : accord sur le transfert des compétences\n• 1er août 1960 : indépendance ; 1960 : admission à l'ONU"}, {"groupe": "SA4", "titre": "Les luttes pour l'indépendance en Afrique et au Bénin (ex Dahomey)", "rubrique": "Dahomey/Bénin après 1960", "texte": "• Difficultés : pauvreté, régionalisme, rivalités des trois grands leaders (Maga, Apithy, Ahomadégbé), grèves, dépendance envers la France\n• Coups d'État : octobre 1963 (Soglo), fin 1965 (Soglo), décembre 1967 et décembre 1969 (Kouandété), 1968 : Zinsou ; 1970 : Conseil présidentiel ; 26 octobre 1972 : Kérékou\n• 1975 : République populaire du Bénin ; février 1990 : Conférence nationale des forces vives ; 1990 : nouvelle Constitution ; 1991 : élection de Nicéphore Soglo"}, {"groupe": "SA5", "titre": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "rubrique": "Chine : fondements et puissance", "texte": "• Fondements : réformes de 1978 (Deng Xiaoping), zones économiques spéciales (Shenzhen), investissements étrangers, main-d'œuvre nombreuse, immense marché intérieur, entrée à l'OMC (2001)\n• Puissance commerciale : parmi les premiers exportateurs du monde (textile, électronique, machines), importante présence en Afrique\n• Limites : inégalités littoral/intérieur, pollution, vieillissement, dépendance aux exportations, tensions commerciales"}, {"groupe": "SA5", "titre": "Organisation économique d'un pays émergent : le succès chinois, le cas brésilien", "rubrique": "Brésil : croissance et fragilités", "texte": "• Atouts : agriculture puissante (soja, canne à sucre, café, viande), fer, pétrole, industrie du Sud-Est, grand marché intérieur\n• Croissance forte au début des années 2000, tirée par les matières premières et la consommation ; récession en 2015-2016 après la chute des cours et le ralentissement de la demande chinoise\n• Relations avec l'Afrique : liens historiques et culturels (dont le Bénin), échanges agricoles, investissements, coopération (coton)"}, {"groupe": "SA6", "titre": "Dossiers sur les regroupements économiques dans le monde : cas de la CEDEAO", "rubrique": "Sous-organisations de la CEDEAO (exemple)", "texte": "• OOAS (Organisation ouest-africaine de la santé) : créée en 1987, siège à Bobo-Dioulasso, harmonise les politiques de santé, la recherche, la formation et la surveillance des maladies\n• Infrastructures : route trans-côtière (Lagos-Abidjan-Dakar), télécommunications, énergie"}], "epreuves": [{"id": "E1", "num": "1", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA4", "contexte": "Après 1945, les peuples colonisés d'Afrique noire réclament plus de droits. La France leur accorde des réformes avant de leur reconnaître l'indépendance.", "tache": "Pour expliquer la marche du Dahomey vers l'indépendance, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente le rôle de la Seconde Guerre mondiale dans la décolonisation de l'Afrique noire.", "Décris les réformes accordées par la France à ses colonies de 1946 à 1956.", "Expose les étapes de la marche du Dahomey vers l'indépendance de 1958 à 1960."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : au lendemain de la Seconde Guerre mondiale, la contestation coloniale s'intensifie (indépendances en Asie dès 1945-1950)\n• Problématique : la marche du Dahomey vers l'indépendance résulte d'un contexte international favorable, de réformes françaises et d'étapes précises\n• Plan : rôle de la guerre, réformes de 1946 à 1956, étapes de 1958 à 1960"}, {"label": "Consigne 1", "points": 3, "text": "• Affaiblissement économique et politique de la France et du Royaume-Uni\n• Effort de guerre des colonies (soldats, matières premières) et attentes de récompense\n• Chute du mythe de l'invincibilité de l'Européen (défaite de 1940)\n• Charte de l'Atlantique (1941) et création de l'ONU (1945) : droit des peuples à disposer d'eux-mêmes\n• Rôle des États-Unis et de l'URSS, hostiles au colonialisme\n• Conférence de Brazzaville (1944) : promesses de réformes mais refus de l'indépendance\n• Transition : face à la pression, la France engage des réformes"}, {"label": "Consigne 2", "points": 3, "text": "• Constitution de 1946 : Union française, colonies devenues territoires d'outre-mer, représentation au Parlement français et dans des assemblées locales\n• Suppression du travail forcé (1946) et du code de l'indigénat\n• Liberté de créer des partis et syndicats (RDA, 1946)\n• Loi-cadre Defferre du 23 juin 1956 : collège unique, suffrage universel, conseils de gouvernement, pouvoirs accrus des assemblées territoriales, africanisation des cadres\n• Transition : au Dahomey, ces réformes ouvrent la voie à l'autonomie"}, {"label": "Consigne 3", "points": 3, "text": "• 28 septembre 1958 : référendum, le Dahomey vote « oui »\n• 4 décembre 1958 : République du Dahomey, État autonome de la Communauté\n• 14 février 1959 : première Constitution\n• Mai 1959 : Hubert Maga à la tête du gouvernement\n• 11 juillet 1960 : accord de transfert des compétences\n• 1er août 1960 : indépendance proclamée"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : fruit de la guerre, des réformes et de la mobilisation des Africains, l'indépendance du Dahomey est négociée\n• Ouverture : comment le Dahomey gère-t-il son indépendance après 1960 ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA1", "contexte": "Depuis l'indépendance, le Bénin cherche à industrialiser son économie, mais son industrie reste peu développée.", "tache": "Pour faire comprendre la situation de l'industrie béninoise, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts de développement de l'industrie béninoise.", "Détermine les problèmes auxquels elle est confrontée.", "Propose des pistes de solutions pour son développement harmonieux."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Bénin est un pays à économie dominée d'Afrique de l'Ouest\n• Problématique : l'industrie dispose d'atouts mais butte sur des obstacles qu'il faut lever\n• Plan : atouts, problèmes, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Naturels : relief peu accidenté, ressources minières (calcaire, marbre, or, fer), cours d'eau (Ouémé, Mono), matières premières agricoles (coton, anacarde, palmier à huile)\n• Humains : population jeune, formation technique et universitaire en progrès\n• Organisationnels : marché de la CEDEAO et de l'UEMOA, option libérale depuis 1990, structures de microfinance, port de Cotonou\n• Transition : malgré ces atouts, l'industrie est confrontée à des problèmes"}, {"label": "Consigne 2", "points": 3, "text": "• Tissu industriel embryonnaire, peu diversifié, dominé par la première transformation\n• Équipements vétustes, insuffisance et coût de l'énergie\n• Manque de capitaux, de technologies et de main-d'œuvre qualifiée\n• Marché intérieur étroit, concurrence des produits importés (dont la fraude)\n• Fiscalité jugée lourde, faible investissement privé\n• Transition : il faut donc proposer des solutions"}, {"label": "Consigne 3", "points": 3, "text": "• Transformer sur place les matières premières locales et soutenir les PME/PMI\n• Améliorer l'énergie (solaire, réduction des coûts)\n• Lutter contre la fraude et la concurrence déloyale\n• Former la main-d'œuvre, encourager l'investissement privé, alléger la fiscalité\n• Renforcer l'entretien des équipements"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'industrie béninoise a un réel potentiel qu'il faut valoriser\n• Ouverture : rôle des autres secteurs (agriculture, tourisme, services) dans le développement"}]}]}, {"id": "E2", "num": "2", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA2 / SA4", "contexte": "L'ONU, créée en 1945, a joué un rôle important dans la fin des empires coloniaux. En 1960, année des indépendances africaines, son Assemblée générale adopte un texte majeur.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'apport de l'ONU à la décolonisation.", "support": "Texte (adapté de la Déclaration sur l'octroi de l'indépendance aux pays et aux peuples coloniaux, résolution 1514 (XV), Assemblée générale de l'ONU, 14 décembre 1960) : « Il faut mettre rapidement et sans condition fin au colonialisme sous toutes ses formes. Soumettre des peuples à une domination et à une exploitation étrangères est contraire aux droits fondamentaux de l'homme et à la Charte, et menace la paix. Tous les peuples ont le droit de choisir librement leur destin. Le manque de préparation politique, économique ou social ne doit jamais servir de prétexte pour retarder l'indépendance. »", "consignes": ["Présente le texte.", "Explique les idées défendues dans le texte.", "Porte un jugement critique sur la portée réelle de cette déclaration.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : déclaration officielle (texte politique et juridique)\n• Source : résolution 1514 de l'Assemblée générale de l'ONU\n• Auteur : l'Assemblée générale de l'ONU\n• Destinataires : États membres, puissances coloniales, opinion internationale\n• Date : 14 décembre 1960, année où de nombreux pays africains deviennent indépendants\n• Idée générale : condamnation du colonialisme et droit des peuples à l'indépendance\n• Centres d'intérêt : 1) condamnation du colonialisme (jusqu'à « menace la paix »), 2) droit de choisir son destin et refus des prétextes pour retarder l'indépendance"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• La Charte de 1945 reconnaît l'égalité des peuples et leur droit à disposer d'eux-mêmes ; la Déclaration universelle de 1948 défend les droits de l'homme\n• Le colonialisme est présenté comme une exploitation et une menace pour la paix\n• Le prétexte du « manque de préparation » était utilisé par les puissances coloniales pour retarder l'indépendance\n• Le texte reflète le poids des pays afro-asiatiques à l'Assemblée depuis Bandung (1955), avec l'appui des États-Unis et de l'URSS"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Forme : texte clair, ton solennel\n• Fond : grande force morale, mais une résolution de l'Assemblée n'oblige pas juridiquement les États\n• Plusieurs puissances coloniales se sont abstenues\n• L'ONU n'a pas empêché les guerres coloniales (Algérie, Angola) ni le néocolonialisme\n• Le texte ne prévoit ni moyens de contrainte ni aide après l'indépendance"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : montre le rôle de tribune de l'ONU et la solidarité du Tiers Monde contre le colonialisme\n• Portée : accélère la décolonisation, base juridique du droit à l'autodétermination, création d'un comité de décolonisation (1961), admission de nombreux nouveaux États\n• Limite : les défis de l'après-indépendance restent entiers"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA3", "contexte": "Malgré la pauvreté de son sol en ressources, le Japon est devenu une puissance économique de premier plan.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'organisation économique du Japon.", "support": "Texte (rédigé pour l'exercice) : « Archipel montagneux, le Japon possède très peu de pétrole, de charbon et de minerais. Il importe donc presque toutes ses matières premières. Des usines installées sur la côte pacifique les transforment en automobiles, appareils électroniques et navires vendus dans le monde entier. Cette réussite repose sur une main-d'œuvre instruite et disciplinée, sur une forte épargne des ménages qui finance les investissements et sur une étroite coopération entre l'État et les grandes entreprises. Mais la population vieillit vite, la main-d'œuvre se raréfie et les industriels, concurrencés par la Chine et la Corée du Sud, doivent sans cesse innover. »", "consignes": ["Présente le texte.", "Explique les fondements de la puissance économique du Japon.", "Détermine les problèmes auxquels l'économie japonaise est confrontée.", "Expose les stratégies adoptées pour maintenir sa place.", "Donne ton opinion sur les leçons que le Bénin peut tirer du modèle japonais."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice, d'après des données générales sur l'économie japonaise\n• Cadre géographique : Japon, pays à économie dominante d'Asie de l'Est\n• Idée générale : le Japon, sans ressources, est une puissance grâce à la transformation, mais il fait face à des défis\n• Centres d'intérêt : 1) une puissance sans ressources, 2) les facteurs de réussite, 3) les difficultés actuelles"}, {"label": "Consigne 2", "points": 2, "text": "• Naturels : insularité (ports, pêche) ; importation des matières premières et transformation sur la côte pacifique\n• Humains : population nombreuse, instruite et disciplinée, forte épargne\n• Organisationnels : grandes firmes liées aux banques, réseau de sous-traitants, sociétés de commerce, coopération État-entreprises, cercles de qualité\n• Résultat : forte place dans l'automobile, l'électronique, la robotique et la construction navale"}, {"label": "Consigne 3", "points": 2, "text": "• Territoire exigu et dépendance énergétique et minière\n• Vieillissement de la population et manque de main-d'œuvre\n• Concurrence de la Chine, de la Corée du Sud, des États-Unis et de l'Union européenne\n• Déclin de certaines industries (textile)\n• Risques naturels (séismes, tsunamis)"}, {"label": "Consigne 4", "points": 2, "text": "• Restructuration industrielle et priorité à la recherche-développement\n• Passage aux industries de haute technologie\n• Délocalisation de certaines activités vers l'Asie du Sud-Est\n• Diversification des partenaires commerciaux et investissements à l'étranger"}, {"label": "Consigne 5", "points": 2, "text": "• Point : le Japon montre qu'un pays sans ressources peut réussir par la formation, la discipline et l'organisation\n• Opinion : le Bénin peut s'en inspirer en investissant dans l'éducation, la transformation locale et la coopération entre l'État et les entreprises, en tenant compte de ses propres réalités"}]}]}, {"id": "E3", "num": "3", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "SA2", "contexte": "Créée pour préserver la paix, l'ONU s'appuie sur le Conseil de sécurité, dont le fonctionnement est parfois critiqué.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Expose le fonctionnement du Conseil de sécurité de l'ONU.", "Énumère les problèmes de l'ONU liés au droit de veto.", "Détermine le rôle de l'ONU dans la décolonisation de l'Afrique."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Le Conseil de sécurité est l'organe chargé du maintien de la paix et de la sécurité internationales ; siège à New York\n• Il compte 15 membres : 5 permanents (États-Unis, Russie, Royaume-Uni, France, Chine) et 10 non permanents élus pour 2 ans\n• La présidence tourne chaque mois entre les membres\n• Une décision de fond exige 9 voix sur 15, sans opposition d'un membre permanent ; l'abstention d'un permanent ne bloque pas\n• Il peut enquêter, recommander, imposer des sanctions, envoyer des casques bleus ou autoriser l'usage de la force"}, {"label": "Consigne 2", "points": 3, "text": "• Le veto contredit l'égalité des États membres\n• Il paralyse le Conseil quand un membre permanent défend ses intérêts (exemples : crises de Syrie et d'Ukraine)\n• Il rend les décisions inégales selon les crises\n• Il dépend du bon vouloir de cinq États seulement\n• Il alimente les demandes de réforme (élargissement, meilleure représentation de l'Afrique)"}, {"label": "Consigne 3", "points": 4, "text": "• Condamnation du colonialisme et affirmation du droit des peuples à disposer d'eux-mêmes (Charte de 1945)\n• Suivi des territoires sous tutelle par le Conseil de tutelle\n• Déclaration de l'Assemblée générale du 14 décembre 1960 exigeant la fin rapide du colonialisme\n• Tribune offerte aux pays afro-asiatiques et admission des nouveaux États indépendants\n• Appui diplomatique et aide (agences comme le PNUD, l'UNESCO)"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA5", "contexte": "Les produits « made in China » sont présents sur tous les marchés du monde, signe de l'essor économique du pays.", "tache": "Pour expliquer l'émergence économique de la Chine, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Décris les fondements de la réussite économique de la Chine.", "Présente les aspects de sa puissance commerciale.", "Détermine les limites de cette émergence."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : la Chine, longtemps pauvre, est devenue une puissance après 1978\n• Problématique : comment la Chine a-t-elle réussi son émergence et quelles en sont les limites ?\n• Plan : fondements, puissance commerciale, limites"}, {"label": "Consigne 1", "points": 3, "text": "• Réformes de 1978 sous Deng Xiaoping : ouverture progressive de l'économie\n• Zones économiques spéciales sur le littoral (Shenzhen) : investissements étrangers\n• Main-d'œuvre nombreuse et peu coûteuse, immense marché intérieur\n• Infrastructures (ports, routes), entrée à l'OMC en 2001\n• Transition : ce dynamisme fait de la Chine une puissance commerciale"}, {"label": "Consigne 2", "points": 3, "text": "• Parmi les tout premiers exportateurs du monde (textile, électronique, machines)\n• Excédents commerciaux et réserves de change importantes\n• Forte présence en Afrique et en Asie (échanges, investissements, grands projets d'infrastructures)\n• Grandes entreprises et ports parmi les plus actifs du monde\n• Transition : cette réussite a pourtant des limites"}, {"label": "Consigne 3", "points": 3, "text": "• Inégalités entre le littoral et l'intérieur, entre villes et campagnes\n• Pollution et pression sur l'environnement\n• Vieillissement de la population\n• Dépendance à l'exportation et tensions commerciales avec certains partenaires\n• Contrôle politique et questions sociales"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : la Chine est une puissance émergente majeure mais son modèle reste fragile\n• Ouverture : quel enseignement pour le Bénin et l'Afrique dans leurs relations avec la Chine ?"}]}]}, {"id": "E4", "num": "4", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA4", "contexte": "Après l'euphorie du 1er août 1960, le Dahomey doit faire face aux difficultés de la gestion de son indépendance.", "tache": "Pour analyser la gestion de l'indépendance du Dahomey, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les difficultés économiques et sociales du Dahomey au lendemain de l'indépendance.", "Retrace les principaux coups d'État de 1963 à 1972.", "Porte un jugement critique sur les causes de l'instabilité politique."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : en 1960, le Dahomey accède à la souveraineté, mais avec une économie fragile\n• Problématique : le Dahomey a connu une longue instabilité politique après l'indépendance\n• Plan : difficultés, coups d'État, causes de l'instabilité"}, {"label": "Consigne 1", "points": 3, "text": "• Économie pauvre, dépendante de quelques produits agricoles et de l'aide extérieure\n• Budget déficitaire, poids des salaires des fonctionnaires, chômage des diplômés\n• Faible industrialisation, forte dépendance envers l'ancienne métropole\n• Mécontentements sociaux et grèves"}, {"label": "Consigne 2", "points": 3, "text": "• Octobre 1963 : coup d'État du colonel Christophe Soglo\n• 1964-1965 : Apithy président, Ahomadégbé chef du gouvernement ; nouvelle crise puis coup d'État fin 1965\n• Décembre 1967 : coup d'État des jeunes officiers (Kouandété)\n• 1968 : Émile Derlin Zinsou à la tête de l'État ; décembre 1969 : nouveau coup d'État\n• 1970 : Conseil présidentiel (Maga, Apithy, Ahomadégbé)\n• 26 octobre 1972 : coup d'État du commandant Mathieu Kérékou"}, {"label": "Consigne 3", "points": 3, "text": "• Régionalisme et rivalités des trois grands leaders\n• Fragilité des institutions et politisation de l'armée\n• Difficultés économiques et pression des syndicats\n• Ingérence de la France et dépendance persistante (néocolonialisme)\n• Jugement : l'indépendance a été mal préparée et la classe politique divisée ; l'armée s'est imposée comme arbitre"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : une décennie d'instabilité (six coups d'État en dix ans environ) freine le développement\n• Ouverture : le régime de Kérékou (1972) et la Conférence nationale de 1990"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA5", "contexte": "Le Brésil a connu une forte croissance, puis une crise, ce qui montre les fragilités d'un pays émergent.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer quelques aspects de l'économie brésilienne.", "support": "Texte (rédigé pour l'exercice) : « Grand pays émergent, le Brésil a connu une forte croissance au début des années 2000, portée par ses exportations de soja, de minerai de fer et de pétrole et par l'essor de la consommation intérieure. Cette réussite reposait beaucoup sur les matières premières vendues à la Chine. À partir de 2014, la chute des cours et le ralentissement de la demande chinoise ont provoqué une récession : la production a reculé, la monnaie s'est dépréciée et les investissements ont chuté. »", "consignes": ["Présente le texte.", "Décris les manifestations de la récession économique du Brésil.", "Expose les facteurs de la forte croissance de la période précédente.", "Détermine l'impact des échanges commerciaux du Brésil sur l'Afrique.", "Donne ton opinion sur les relations commerciales entre le Brésil et l'Afrique."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Brésil, pays émergent d'Amérique latine (BRICS)\n• Idée générale : croissance puis récession, révélatrices de la dépendance aux matières premières\n• Centres d'intérêt : 1) la croissance des années 2000, 2) la récession à partir de 2014"}, {"label": "Consigne 2", "points": 2, "text": "• Recul de la production et de l'investissement\n• Dépréciation de la monnaie\n• Baisse des exportations et des recettes\n• Endettement des grandes entreprises (secteur pétrolier)"}, {"label": "Consigne 3", "points": 2, "text": "• Exportations de soja, minerai de fer, pétrole, viande, canne à sucre\n• Forte demande chinoise\n• Essor de la consommation intérieure\n• Hausse des cours des matières premières"}, {"label": "Consigne 4", "points": 2, "text": "• Hausse des échanges : viande, sucre, produits manufacturés vers l'Afrique ; produits africains vers le Brésil\n• Investissements de firmes brésiliennes et coopération agricole (dont le coton)\n• Concurrence sur certains produits (coton, viande) ; risque de dépendance"}, {"label": "Consigne 5", "points": 2, "text": "• Point : relations utiles, fondées sur des liens historiques et culturels (dont le Bénin)\n• Opinion : l'Afrique doit chercher un partenariat équilibré : transferts de technologie, transformation locale, accès aux marchés"}]}]}, {"id": "E5", "num": "5", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "En 1958, le retour au pouvoir du général de Gaulle change la politique de la France envers ses colonies d'Afrique.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'offre de la France aux territoires d'Afrique noire.", "support": "Texte (adapté d'un discours du général de Gaulle, Conakry, 25 août 1958) : « La France propose aux territoires d'outre-mer une Communauté qui leur permettra de se développer sur les plans économique, social et culturel, et de défendre ensemble leurs libertés. Cette Communauté est une offre : nul n'est obligé d'y entrer. Ceux qui choisiront de ne pas y adhérer deviendront indépendants, mais devront assumer seuls les conséquences de ce choix. »", "consignes": ["Présente le texte.", "Explique les idées développées par l'auteur.", "Porte un jugement critique sur cette offre.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : discours politique (extrait adapté)\n• Auteur : Charles de Gaulle (1890-1970), chef du gouvernement français en 1958, puis président de la Ve République (1959-1969)\n• Destinataires : populations et dirigeants des territoires d'Afrique noire\n• Contexte : retour au pouvoir en mai 1958 pendant la crise algérienne ; préparation du référendum du 28 septembre 1958 sur la Constitution de la Ve République\n• Idée générale : la France propose une Communauté et laisse le choix du « non »\n• Centres d'intérêt : 1) l'offre de la Communauté, 2) la liberté de la refuser et ses conséquences"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• La Communauté franco-africaine : coopération économique, sociale et culturelle, défense commune\n• Chaque territoire peut choisir « oui » (autonomie dans la Communauté) ou « non » (indépendance immédiate)\n• Les territoires qui refusent perdent l'appui de la France"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Fond : l'offre est présentée comme libre, mais la Communauté conserve à la France des compétences majeures (défense, monnaie, politique étrangère)\n• Le « non » est rendu coûteux : menace implicite de rupture de l'aide\n• Le texte ne reconnaît pas clairement le droit à l'indépendance avec coopération\n• Forme : ton paternaliste mais habile"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : éclaire la stratégie de la France pour conserver son influence tout en évitant la rupture\n• Portée : la Guinée vote « non » et devient indépendante le 2 octobre 1958, les autres territoires (dont le Dahomey) votent « oui » ; la Communauté est vite dépassée, les indépendances de 1960 suivent"}]}, {"partie": "Géographie", "type": "Réponds directement aux consignes", "sa": "SA1", "contexte": "L'agriculture est la base de l'économie béninoise, mais elle reste sous-développée et très dépendante du coton.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Décris les problèmes liés à la monoculture du coton au Bénin.", "Présente les causes essentielles de l'état actuel de la production agricole.", "Propose deux pistes de solutions réalistes pour promouvoir l'agriculture."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Forte dépendance aux cours mondiaux et donc recettes instables\n• Sensibilité aux aléas climatiques\n• Coûts élevés des intrants (engrais, pesticides)\n• Appauvrissement des sols et concurrence avec les cultures vivrières\n• Faible transformation locale : valeur ajoutée captée à l'étranger"}, {"label": "Consigne 2", "points": 3, "text": "• Agriculture traditionnelle, peu mécanisée, avec de faibles rendements\n• Difficultés d'accès au crédit et aux intrants\n• Pistes rurales dégradées, mauvais accès aux marchés\n• Croissance de la population et pression foncière\n• Changement climatique et faible maîtrise de l'eau"}, {"label": "Consigne 3", "points": 4, "text": "• Mécaniser et moderniser : machines adaptées aux sols, formation des producteurs et financement pour acquérir le matériel\n• Diversifier et transformer : filières anacarde, ananas, riz, manioc avec des unités de transformation locales, aménagements hydro-agricoles"}]}]}, {"id": "E6", "num": "6", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "SA4", "contexte": "Entre 1955 et 1960, plusieurs événements accélèrent la marche vers les indépendances africaines.", "tache": "Réponds directement aux consignes suivantes.", "support": "", "consignes": ["Apprécie l'impact de la conférence de Bandung (1955) sur la décolonisation de l'Afrique noire.", "Le 28 septembre 1958, la Guinée de Sékou Touré a voté « non » au référendum. Explique les raisons de ce vote.", "Justifie le caractère négocié de la décolonisation du Dahomey."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Conférence tenue à Bandung (Indonésie) en avril 1955 par 29 pays d'Asie et d'Afrique\n• Condamnation du colonialisme, principes de coexistence pacifique et de non-alignement, naissance du Tiers Monde\n• Elle encourage les nationalistes africains, montre leur solidarité et leur donne une audience internationale\n• Elle prépare l'indépendance du Ghana (1957) et la pression sur l'ONU"}, {"label": "Consigne 2", "points": 3, "text": "• Sékou Touré (PDG-RDA) refuse une autonomie qui laisse à la France l'essentiel des pouvoirs\n• Il veut l'indépendance immédiate, symbolisée par une formule célèbre : préférer la liberté dans la pauvreté\n• Forte mobilisation syndicale et politique en Guinée\n• Conséquences : indépendance le 2 octobre 1958, retrait brutal de l'aide française, isolement puis rapprochement avec d'autres partenaires"}, {"label": "Consigne 3", "points": 4, "text": "• Pas de guerre de libération : négociation et réformes progressives (1946, 1956)\n• Vote « oui » au référendum de 1958, autonomie interne dans la Communauté\n• Négociations avec la France : accord de transfert des compétences de juillet 1960\n• Dirigeants modérés (Maga, Apithy, Ahomadégbé) privilégiant la coopération\n• Indépendance proclamée le 1er août 1960, avec accords de coopération maintenus"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA6", "contexte": "Pour surmonter la faiblesse de leurs économies, les États d'Afrique de l'Ouest se sont regroupés au sein d'une communauté régionale.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'intégration économique en Afrique de l'Ouest.", "support": "Texte (rédigé pour l'exercice) : « Créée en 1975 à Lagos, la CEDEAO réunit des pays francophones, anglophones et lusophones d'Afrique de l'Ouest. Elle poursuit la libre circulation des personnes et des biens, la construction d'infrastructures régionales, comme la route côtière entre Lagos et Dakar et les réseaux de télécommunication, et à terme une monnaie commune. Pourtant, les échanges entre pays membres restent faibles : routes en mauvais état, contrôles routiers multiples, monnaies différentes et barrières non tarifaires freinent le commerce. »", "consignes": ["Présente le texte.", "Explique de quoi il s'agit dans le texte.", "Expose les efforts fournis pour l'intégration économique de ses membres.", "Détermine les faiblesses de cette organisation et propose des solutions pour la redynamiser.", "Donne ton opinion comparative entre la CEDEAO et l'Union européenne."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Afrique de l'Ouest, pays à économie dominée\n• Idée générale : ambitions et limites de l'intégration au sein de la CEDEAO\n• Centres d'intérêt : 1) objectifs et réalisations, 2) obstacles au commerce régional"}, {"label": "Consigne 2", "points": 2, "text": "• La CEDEAO (Communauté économique des États de l'Afrique de l'Ouest) est née le 28 mai 1975 à Lagos (Nigeria)\n• Elle a compté 15 membres ; depuis janvier 2025, le Mali, le Burkina Faso et le Niger l'ont quittée\n• Objectif : union économique, libre circulation, développement commun, paix et stabilité"}, {"label": "Consigne 3", "points": 2, "text": "• Libre circulation des personnes (protocole de 1979)\n• Infrastructures : route côtière Lagos-Abidjan-Dakar, télécommunications, énergie\n• Tarif extérieur commun et libéralisation des échanges\n• Paix et sécurité (interventions, médiation)\n• Financement de projets par la BIDC"}, {"label": "Consigne 4", "points": 2, "text": "• Faiblesses : faible commerce entre pays membres, infrastructures insuffisantes et mal entretenues, barrières non tarifaires et contrôles multiples, monnaies non convertibles, instabilité politique, retraits récents de certains membres\n• Solutions : monnaie commune, entretien des routes et rail, application réelle des protocoles, diversification des économies, dialogue politique"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion : l'Union européenne a mieux réussi l'intégration (marché unique, monnaie commune) grâce à des économies complémentaires et des institutions fortes\n• La CEDEAO doit renforcer ses institutions et diversifier ses économies pour rattraper ce retard"}]}]}, {"id": "E7", "num": "7", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA2", "contexte": "Au lendemain de la Seconde Guerre mondiale, une organisation internationale est créée pour préserver la paix : l'ONU.", "tache": "Pour expliquer la création et le rôle de l'ONU, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Évoque les rencontres qui ont préparé la création de l'ONU de 1941 à 1945.", "Présente les principaux organes de l'ONU.", "Porte un jugement critique sur l'efficacité de l'ONU aujourd'hui."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : la Seconde Guerre mondiale a fait des dizaines de millions de morts ; les Alliés veulent éviter une nouvelle guerre\n• Problématique : l'ONU est née de plusieurs conférences, s'appuie sur des organes précis et son efficacité reste débattue\n• Plan : genèse, organes, bilan"}, {"label": "Consigne 1", "points": 3, "text": "• Charte de l'Atlantique (août 1941)\n• Déclaration des Nations unies (1er janvier 1942)\n• Moscou (octobre 1943) et Téhéran (fin 1943)\n• Dumbarton Oaks (août-octobre 1944) : projet d'organisation\n• Yalta (février 1945) : règle du vote au Conseil de sécurité\n• San Francisco (avril-juin 1945) : signature de la Charte le 26 juin ; entrée en vigueur le 24 octobre 1945"}, {"label": "Consigne 2", "points": 3, "text": "• Assemblée générale : tous les États, un État une voix\n• Conseil de sécurité : paix et sécurité, 5 permanents avec veto\n• Secrétariat dirigé par le Secrétaire général\n• Cour internationale de justice (La Haye)\n• Conseil économique et social (ECOSOC)\n• Conseil de tutelle (activité suspendue depuis 1994)"}, {"label": "Consigne 3", "points": 3, "text": "• Réussites : évite une nouvelle guerre mondiale, casques bleus, indépendance des peuples, droits de l'homme (Déclaration de 1948), aide humanitaire\n• Limites : veto des grandes puissances, manque de moyens, conflits non résolus, inégalités entre pays riches et pays pauvres\n• Jugement : indispensable mais à réformer"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'ONU reste un cadre irremplaçable de dialogue\n• Ouverture : réformer le Conseil de sécurité et donner plus de place à l'Afrique"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA1", "contexte": "Le Bénin possède un riche patrimoine naturel, historique et culturel qui peut nourrir le développement du tourisme.", "tache": "Pour montrer les possibilités de relance du tourisme au Bénin, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les potentialités touristiques du Bénin.", "Expose les actions menées par l'État pour dynamiser ce secteur.", "Propose des solutions réalisables pour rentabiliser la destination Bénin."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le tourisme est un levier de développement du secteur tertiaire\n• Problématique : le Bénin a de forts atouts touristiques qu'il doit mieux valoriser\n• Plan : potentialités, actions de l'État, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Naturelles : côte d'environ 125 km, cité lacustre de Ganvié, parcs de la Pendjari et du W, chutes de Kota et de Tanougou, sources thermales, forêts sacrées\n• Historiques et culturelles : Vodoun, palais royaux d'Abomey, Ouidah (Route des esclaves, Porte du non-retour), tata somba, fêtes culturelles\n• Transition : l'État a engagé plusieurs actions"}, {"label": "Consigne 2", "points": 3, "text": "• Promotion de la destination Bénin à l'international\n• Adoption de textes encadrant les métiers du tourisme (guides, sites)\n• Protection et sécurisation des aires protégées, gestion privée de certains parcs\n• Facilités d'accès et coopération avec les partenaires techniques et financiers\n• Transition : d'autres efforts restent nécessaires"}, {"label": "Consigne 3", "points": 3, "text": "• Améliorer l'hôtellerie et l'accueil, renforcer la sécurité des visiteurs\n• Lutter contre la corruption et les rançonnements\n• Protéger les sites contre la pollution (Ganvié, plages)\n• Proposer des tarifs attractifs et développer le tourisme de proximité\n• Nouer des partenariats avec de grandes agences internationales"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le tourisme peut devenir une source majeure de devises si les efforts sont maintenus\n• Ouverture : nécessité de relancer aussi les autres sous-secteurs"}]}]}, {"id": "E8", "num": "8", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "En 1944, alors que la guerre n'est pas terminée, la France réfléchit à l'avenir de ses colonies d'Afrique.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour préciser la position de la France à Brazzaville.", "support": "Texte (adapté des conclusions de la conférence de Brazzaville, 30 janvier-8 février 1944) : « L'œuvre de civilisation accomplie par la France dans ses colonies exclut toute idée d'autonomie et toute évolution en dehors de l'ensemble français. Il faut cependant améliorer les conditions de vie des populations, associer davantage les Africains à la gestion de leurs affaires, et supprimer progressivement les pratiques les plus contestées du régime colonial. »", "consignes": ["Présente le texte.", "Explique les positions exprimées.", "Porte un jugement critique sur ces positions.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : conclusions officielles d'une conférence\n• Source : conférence de Brazzaville, 30 janvier-8 février 1944\n• Auteurs : responsables français (administrateurs, gouverneurs, autour du général de Gaulle), sans représentants africains\n• Destinataires : gouvernement français, administrations coloniales, opinion\n• Contexte : Seconde Guerre mondiale, la France libre a besoin du soutien de ses colonies\n• Idée générale : réformes oui, autonomie ou indépendance non\n• Centres d'intérêt : 1) refus de l'autonomie, 2) réformes envisagées"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• La France veut conserver son empire sous une forme rénovée\n• Elle promet une amélioration des conditions de vie et une meilleure association des Africains\n• Elle annonce la fin progressive du travail forcé et de certaines pratiques (indigénat)"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Contradiction : promettre des réformes tout en fermant la voie à toute évolution politique\n• Aucun Africain n'a participé à la conférence\n• Réformes vagues et progressives, calendrier absent\n• Qualité : le texte reconnaît la nécessité de changement"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : montre l'état d'esprit colonial de la France en 1944\n• Portée : préparation de la Constitution de 1946 (Union française), suppression du travail forcé et de l'indigénat en 1946 ; la montée du nationalisme dépasse ces réformes"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA1", "contexte": "« La route du développement passe par le développement de la route. » Les décideurs béninois accordent une place importante aux transports.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour faire comprendre le rôle des transports au Bénin.", "support": "Texte (rédigé pour l'exercice) : « Le Bénin tire une part importante de ses revenus de l'agriculture, du commerce et du transit vers les pays voisins. Pour valoriser ces atouts, il a besoin de routes et de services de transport performants. De bonnes routes réduisent les coûts, créent des emplois, approvisionnent régulièrement les marchés et permettent l'accès aux services de base, surtout dans les villages enclavés. À l'inverse, des routes dégradées ralentissent les échanges et augmentent les prix. »", "consignes": ["Présente le texte.", "Explique le bien-fondé des actions du gouvernement dans le domaine des transports.", "Évoque les raisons pour lesquelles ces actions sont prioritaires.", "Détermine les conséquences socio-économiques du mauvais état des routes.", "Donne ton point de vue sur l'installation de postes de péage sur les routes principales."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Bénin, pays à économie dominée d'Afrique de l'Ouest\n• Idée générale : les transports sont un moteur du développement\n• Centres d'intérêt : 1) rôle des transports, 2) coût d'un mauvais réseau"}, {"label": "Consigne 2", "points": 2, "text": "• Réduire les coûts de transport et faciliter les échanges\n• Créer des emplois et approvisionner les marchés\n• Désenclaver les zones rurales et faciliter l'accès à l'école, à la santé\n• Soutenir l'activité du port de Cotonou et le transit vers le Nigeria et le Sahel"}, {"label": "Consigne 3", "points": 2, "text": "• Le Bénin vit du commerce et du transit\n• Les corridors routiers relient Cotonou à l'hinterland\n• Sans routes, les autres secteurs (agriculture, industrie, tourisme) ne se développent pas"}, {"label": "Consigne 4", "points": 2, "text": "• Hausse des coûts et des prix\n• Accidents et pertes de marchandises\n• Isolement des villages et exode rural\n• Baisse des recettes et perte de compétitivité"}, {"label": "Consigne 5", "points": 2, "text": "• Point de vue argumenté : les péages financent l'entretien des routes et sont acceptables s'ils sont bien gérés et transparents ; mais ils peuvent renchérir les prix et pénaliser les transporteurs si les routes restent mauvaises"}]}]}, {"id": "E9", "num": "9", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA2", "contexte": "Depuis 1945, les agences spécialisées de l'ONU interviennent dans la vie quotidienne de millions de personnes, y compris au Bénin.", "tache": "Pour expliquer l'action de l'ONU à travers ses agences, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente le rôle de trois agences spécialisées de l'ONU.", "Illustre leur action au Bénin ou en Afrique par des exemples précis.", "Porte un jugement critique sur les limites de cette action."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : l'ONU agit aussi par ses agences spécialisées, présentes dans presque tous les pays\n• Problématique : ces agences jouent un rôle important, mais leur action a des limites\n• Plan : rôle de trois agences, exemples en Afrique, limites"}, {"label": "Consigne 1", "points": 3, "text": "• OMS (Genève) : santé publique, vaccination, lutte contre les épidémies\n• UNICEF (New York) : protection et éducation de l'enfance\n• PAM (Rome) : aide alimentaire d'urgence"}, {"label": "Consigne 2", "points": 3, "text": "• OMS : campagnes de vaccination contre la poliomyélite et la rougeole en Afrique de l'Ouest\n• UNICEF : programmes scolaires et de nutrition infantile au Bénin\n• PAM : distributions alimentaires lors de crises (Sahel)"}, {"label": "Consigne 3", "points": 3, "text": "• Dépendance aux financements des pays riches, parfois irréguliers\n• Actions parfois ponctuelles, sans continuité suffisante\n• Risque de dépendance des États bénéficiaires envers l'aide extérieure"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : les agences de l'ONU apportent une aide réelle mais incomplète\n• Ouverture : nécessité pour les États de renforcer leurs propres services publics"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA1", "contexte": "La transformation locale des matières premières est présentée comme une solution à la dépendance économique du Bénin.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'intérêt de la transformation locale du coton au Bénin.", "support": "Texte (rédigé pour l'exercice) : « Premier produit d'exportation du Bénin, le coton est encore vendu en grande partie à l'état brut. En le transformant sur place en fil, en tissu ou en vêtements, le pays gagnerait davantage de valeur ajoutée, créerait des emplois industriels et réduirait sa dépendance aux cours mondiaux. Des unités de filature existent déjà, mais elles restent peu nombreuses, faute d'investissements suffisants et d'une énergie fiable et bon marché. »", "consignes": ["Présente le texte.", "Explique l'intérêt de la transformation locale du coton.", "Détermine les obstacles à cette transformation.", "Propose une solution pour lever l'un de ces obstacles."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Bénin, pays à économie dominée\n• Idée générale : la transformation du coton reste un enjeu majeur, mais elle bute sur des obstacles\n• Centres d'intérêt : 1) l'intérêt de la transformation, 2) les obstacles"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Plus grande valeur ajoutée qu'à l'exportation du coton brut\n• Création d'emplois industriels (filature, tissage, confection)\n• Réduction de la dépendance aux cours mondiaux du coton brut\n• Développement de filières locales (textile béninois)"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Manque d'investissements dans les unités de transformation\n• Coût et irrégularité de l'énergie\n• Concurrence des textiles importés, parfois à bas prix\n• Manque de main-d'œuvre qualifiée dans certains métiers du textile"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Exemple : pour l'énergie, développer les capacités solaires et améliorer le réseau afin de réduire son coût pour les unités industrielles"}]}]}, {"id": "E10", "num": "10", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA2", "contexte": "En 1945, au sortir de la Seconde Guerre mondiale, les États réunis à San Francisco adoptent le texte fondateur d'une nouvelle organisation internationale.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les ambitions des fondateurs de l'ONU.", "support": "Texte (adapté du préambule de la Charte des Nations Unies, San Francisco, 26 juin 1945) : « Nous, peuples des Nations Unies, résolus à préserver les générations futures du fléau de la guerre qui, deux fois en l'espace d'une vie humaine, a infligé à l'humanité d'indicibles souffrances, à proclamer à nouveau notre foi dans les droits fondamentaux de l'homme, dans la dignité et la valeur de la personne humaine, dans l'égalité de droits des hommes et des femmes, ainsi que des nations, grandes et petites, à favoriser le progrès social et instaurer de meilleures conditions de vie dans une liberté plus grande… »", "consignes": ["Présente le texte.", "Explique les objectifs que se donnent les fondateurs de l'ONU.", "Porte un jugement critique sur la réalisation de ces objectifs depuis 1945.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : préambule d'un traité fondateur (texte politique et juridique)\n• Source : Charte des Nations Unies\n• Auteurs : les représentants des États réunis à San Francisco\n• Date : signature le 26 juin 1945 ; entrée en vigueur le 24 octobre 1945\n• Destinataires : les peuples et les États du monde\n• Idée générale : engagement solennel à préserver la paix, défendre les droits humains et promouvoir le progrès\n• Centres d'intérêt : 1) refus de la guerre, 2) foi dans les droits de l'homme et l'égalité des nations, 3) progrès social"}, {"label": "Consigne 2 : Explication des idées", "points": 3, "text": "• Préserver la paix : éviter une nouvelle guerre après deux guerres mondiales (la SDN avait échoué) → Conseil de sécurité\n• Défendre les droits fondamentaux de la personne → Déclaration universelle des droits de l'homme (1948)\n• Égalité des nations grandes et petites → principe de l'égalité souveraine des États\n• Favoriser le progrès social et de meilleures conditions de vie → agences spécialisées (OMS, FAO, UNESCO, UNICEF)"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Réussites : pas de troisième guerre mondiale, soutien à la décolonisation, action humanitaire, campagnes de santé et d'éducation\n• Limites : conflits qui persistent (Proche-Orient, Syrie, Ukraine…)\n• Droit de veto qui paralyse parfois le Conseil de sécurité\n• Pauvreté et inégalités toujours présentes ; moyens limités de l'organisation\n• Bilan nuancé : l'idéal est partiellement atteint"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : texte fondateur qui exprime l'idéal de paix et de justice de l'après-guerre\n• Portée : base du droit international moderne et référence morale pour les États\n• Cadre de la coopération entre les nations\n• Limite : texte d'intention dont l'application dépend de la volonté des États"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA3", "contexte": "Archipel montagneux, exposé aux séismes et pauvre en matières premières, le Japon est pourtant l'une des premières puissances économiques du monde.", "tache": "Pour expliquer la puissance économique du Japon, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les contraintes naturelles du Japon et les moyens de les surmonter.", "Explique les facteurs de sa puissance industrielle.", "Détermine les limites de cette puissance."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon est un archipel de montagnes, de séismes et de volcans, mais aussi une grande puissance\n• Problématique : comment le Japon a-t-il transformé ses handicaps en atouts, et quelles sont les limites de sa réussite ?\n• Plan : contraintes et solutions, facteurs de puissance, limites"}, {"label": "Consigne 1", "points": 3, "text": "• Relief montagneux : peu de terres cultivables, population concentrée sur les plaines littorales\n• Solutions : terrasses, polders gagnés sur la mer, agriculture intensive et pêche\n• Séismes, tsunamis, typhons : normes de construction antisismiques, systèmes d'alerte\n• Pauvreté en pétrole et en minerais : importations massives par de grands ports\n• Transition : ces contraintes ont stimulé l'effort d'organisation et d'innovation"}, {"label": "Consigne 2", "points": 3, "text": "• Capital humain : éducation de qualité, discipline et sens du travail\n• Reconstruction après 1945 et rôle de l'État dans l'orientation de l'économie\n• Grandes firmes (Toyota, Sony, Mitsubishi…) très compétitives\n• Recherche et innovation : automobile, électronique, robotique\n• Transformation sur place des matières premières importées en produits à forte valeur ajoutée\n• Ceinture industrielle du Pacifique (Tokyo–Osaka) et ports actifs ; forte conquête des marchés extérieurs\n• Transition : cette puissance reste pourtant fragile"}, {"label": "Consigne 3", "points": 3, "text": "• Dépendance énergétique et en matières premières\n• Vieillissement de la population et baisse de la natalité\n• Catastrophes naturelles et accident de Fukushima (2011)\n• Concurrence de la Chine et de la Corée du Sud\n• Dette publique élevée, pollution liée à l'industrialisation passée"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Japon est une puissance qui s'est construite malgré les contraintes\n• Ouverture : quels enseignements pour le Bénin (éducation, valorisation locale des matières premières) ?"}]}]}, {"id": "E11", "num": "11", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "SA4", "contexte": "Les mouvements d'indépendance en Afrique noire ont aussi été favorisés par des événements venus de l'extérieur du continent.", "tache": "Réponds directement aux consignes suivantes pour montrer l'influence du contexte international.", "support": "", "consignes": ["Cite quatre facteurs externes de l'émancipation des peuples africains.", "Explique l'importance de la conférence de Bandung (1955).", "Montre l'influence de l'indépendance du Ghana (1957) sur les autres colonies."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Seconde Guerre mondiale : affaiblissement des puissances coloniales, participation des Africains au conflit\n• Charte de l'Atlantique (1941) et Charte de l'ONU (1945) : droit des peuples à disposer d'eux-mêmes\n• Indépendances de pays d'Asie (Inde en 1947, Indonésie…)\n• Attitude anticolonialiste des États-Unis et de l'URSS\n• Conférence de Bandung (1955) et action de l'ONU"}, {"label": "Consigne 2", "points": 3, "text": "• Réunion en avril 1955, en Indonésie, de 29 pays d'Asie et d'Afrique\n• Condamnation du colonialisme sous toutes ses formes\n• Affirmation de la solidarité afro-asiatique, du non-alignement et de la coexistence pacifique\n• Soutien moral aux mouvements de libération\n• Effet psychologique : les nationalistes africains se sentent encouragés"}, {"label": "Consigne 3", "points": 4, "text": "• Ghana (ex-Gold Coast), colonie britannique, devient indépendant le 6 mars 1957 sous Kwame Nkrumah\n• Premier pays d'Afrique noire à accéder à l'indépendance : preuve que c'est possible\n• Effet d'entraînement sur les autres colonies : montée des revendications\n• Développement du panafricanisme (conférences d'Accra en 1958)\n• Pression accrue sur la France : référendum de 1958, Guinée indépendante dès 1958, puis année 1960 « année de l'Afrique »"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA5", "contexte": "Premier pays d'Amérique latine par sa taille et son économie, le Brésil est classé parmi les pays émergents.", "tache": "Pour expliquer l'émergence économique du Brésil, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts du Brésil.", "Décris les aspects de son économie émergente.", "Détermine les faiblesses de cette émergence."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Brésil est un géant d'Amérique du Sud, membre des BRICS\n• Problématique : sur quoi repose l'émergence du Brésil et quelles en sont les faiblesses ?\n• Plan : atouts, aspects de l'économie, faiblesses"}, {"label": "Consigne 1", "points": 3, "text": "• Immense territoire, le plus vaste d'Amérique latine\n• Population nombreuse (plus de 200 millions d'habitants) : large marché intérieur\n• Ressources naturelles : fer, bauxite, manganèse, pétrole en mer, forte capacité hydroélectrique, terres agricoles, forêt amazonienne\n• Façade atlantique et grands ports (Santos)\n• Transition : ces atouts ont permis un essor économique rapide"}, {"label": "Consigne 2", "points": 3, "text": "• Agriculture puissante : premier exportateur de café et de soja, canne à sucre (éthanol), élevage bovin\n• Industrie diversifiée : automobile, aéronautique (Embraer), sidérurgie, agroalimentaire ; pôle de São Paulo\n• Grandes entreprises (Petrobras, Vale) et ouverture commerciale (Mercosur, BRICS)\n• Transition : cette réussite reste inégale"}, {"label": "Consigne 3", "points": 3, "text": "• Inégalités sociales très fortes (favelas) et déséquilibres régionaux (Sud-Est riche, Nord-Est pauvre)\n• Dépendance vis-à-vis des matières premières et des cours mondiaux\n• Déforestation de l'Amazonie et atteintes à l'environnement\n• Insécurité, infrastructures insuffisantes\n• Crises économiques périodiques (par exemple 2015-2016)"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Brésil est un pays émergent majeur mais encore fragile\n• Ouverture : quelles leçons pour les pays africains qui veulent émerger ?"}]}]}, {"id": "E12", "num": "12", "parts": [{"partie": "Histoire", "type": "Réponds directement aux consignes", "sa": "SA2", "contexte": "Malgré son rôle essentiel dans les affaires du monde, l'ONU est souvent critiquée pour ses limi
