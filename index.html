tes.", "tache": "Réponds directement aux consignes suivantes pour montrer les limites de l'action de l'ONU.", "support": "", "consignes": ["Cite les membres permanents du Conseil de sécurité et le droit dont ils disposent.", "Explique comment le droit de veto limite l'action de l'ONU.", "Présente d'autres difficultés rencontrées par l'ONU."], "elements": [{"label": "Consigne 1", "points": 3, "text": "• Cinq membres permanents : États-Unis, Russie (ex-URSS), Chine, France, Royaume-Uni\n• Droit de veto\n• Conseil de sécurité : 15 membres (5 permanents et 10 non permanents élus pour 2 ans)\n• Une résolution de fond exige 9 voix sur 15, sans veto d'un membre permanent"}, {"label": "Consigne 2", "points": 3, "text": "• Un seul veto suffit à bloquer une résolution, même soutenue par la majorité\n• Utilisation du veto selon les intérêts nationaux (guerre froide, conflit israélo-arabe, Syrie, Ukraine)\n• Paralysie du Conseil de sécurité face à certaines crises\n• Demandes de réforme : élargir le nombre de membres permanents (Afrique, Inde, Brésil…)"}, {"label": "Consigne 3", "points": 4, "text": "• Absence d'armée propre : dépendance des contingents fournis par les États\n• Dépendance financière envers les grandes puissances (contributions, retards de paiement)\n• Non-respect de certaines résolutions par des États\n• Lenteur et lourdeur de l'organisation\n• Échecs de prévention de certains drames (Rwanda en 1994)"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA6", "contexte": "Créée en 1975, la CEDEAO est l'un des principaux regroupements économiques d'Afrique, mais son intégration reste inachevée.", "tache": "Pour expliquer le bilan de la CEDEAO, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente la CEDEAO (création, objectifs, organes).", "Décris ses réalisations.", "Détermine les obstacles à son intégration."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : les États d'Afrique de l'Ouest cherchent à s'unir pour mieux se développer\n• Problématique : quelles sont les réalisations et les limites de la CEDEAO ?\n• Plan : présentation, réalisations, obstacles"}, {"label": "Consigne 1", "points": 3, "text": "• Créée le 28 mai 1975 à Lagos (traité de Lagos) ; siège à Abuja\n• Objectifs : intégration économique, libre circulation des personnes et des biens, coopération monétaire, paix et sécurité\n• Organes : Conférence des chefs d'État, Conseil des ministres, Commission, Parlement, Cour de justice\n• Transition : ces objectifs ont donné lieu à des réalisations concrètes"}, {"label": "Consigne 2", "points": 3, "text": "• Libre circulation des personnes (passeport CEDEAO)\n• Tarif extérieur commun pour les échanges avec l'extérieur\n• Missions de maintien de la paix (ECOMOG au Liberia et en Sierra Leone)\n• Projets d'infrastructures (routes, gazoduc ouest-africain) et institutions de financement (BIDC)\n• Projet de monnaie unique (Eco)\n• Transition : malgré ces acquis, des obstacles demeurent"}, {"label": "Consigne 3", "points": 3, "text": "• Faiblesse des échanges entre pays de la région\n• Barrières non tarifaires et lenteurs aux frontières\n• Infrastructures insuffisantes\n• Insécurité (terrorisme au Sahel) et tensions politiques, dont le retrait de certains États\n• Monnaies différentes (franc CFA et monnaies nationales) ; dépendance extérieure"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : la CEDEAO a avancé, mais son intégration reste incomplète\n• Ouverture : quel intérêt pour le Bénin de renforcer son rôle dans la CEDEAO ?"}]}]}, {"id": "E13", "num": "13", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA2", "contexte": "Pour garantir la paix, la sécurité et la coopération entre les nations, l'ONU s'est dotée d'organes spécialisés.", "tache": "Pour expliquer le fonctionnement de l'ONU, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les principaux organes de l'ONU.", "Explique le rôle de l'Assemblée générale et du Conseil de sécurité.", "Détermine les missions de l'ONU dans le monde."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : au sortir de la Seconde Guerre mondiale, les nations veulent éviter une nouvelle guerre ; l'ONU naît à San Francisco en 1945\n• Problématique : comment l'ONU est-elle organisée et quelles missions remplit-elle ?\n• Plan : les organes, le rôle des deux organes majeurs, les missions"}, {"label": "Consigne 1", "points": 3, "text": "• Assemblée générale : tous les États membres\n• Conseil de sécurité : 15 membres dont 5 permanents\n• Secrétariat dirigé par le Secrétaire général\n• Cour internationale de justice (La Haye)\n• Conseil économique et social (ECOSOC)\n• Conseil de tutelle (sans activité depuis 1994, les territoires sous tutelle ayant accédé à l'indépendance)\n• Transition : parmi ces organes, deux jouent un rôle central"}, {"label": "Consigne 2", "points": 3, "text": "• Assemblée générale : un État = une voix, session annuelle à partir de septembre, débats et recommandations, vote du budget, admission des nouveaux membres\n• Conseil de sécurité : maintien de la paix et de la sécurité internationales, décisions de fond à 9 voix sur 15 sans veto d'un permanent\n• Il peut imposer des sanctions, envoyer des casques bleus, autoriser l'usage de la force\n• Transition : ces organes servent des missions précises"}, {"label": "Consigne 3", "points": 3, "text": "• Maintenir la paix et la sécurité (casques bleus, médiation)\n• Défendre les droits de l'homme (Déclaration universelle de 1948)\n• Favoriser le développement et la coopération (PNUD, FAO, OMS, UNESCO, UNICEF)\n• Apporter une aide humanitaire (PAM, HCR)\n• Aider à la décolonisation (Conseil de tutelle, résolution 1514 de 1960)"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'ONU est organisée en organes complémentaires pour la paix, les droits et le développement\n• Ouverture : l'ONU peut-elle agir efficacement malgré le droit de veto ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA1", "contexte": "Le Bénin est un pays à économie dominée où l'agriculture occupe la majorité de la population active, mais elle ne permet pas encore au pays de se développer pleinement.", "tache": "Pour faire comprendre la situation de l'agriculture béninoise, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les atouts de l'agriculture béninoise.", "Détermine les problèmes auxquels elle est confrontée.", "Propose des solutions pour son développement."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Bénin est un pays à économie dominée d'Afrique de l'Ouest dont l'agriculture emploie la majorité des actifs\n• Problématique : l'agriculture béninoise dispose d'atouts mais bute sur des obstacles qu'il faut lever\n• Plan : atouts, problèmes, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Naturels : climats variés (subéquatorial au sud, soudanien au nord), relief peu accidenté, sols fertiles, vallées de l'Ouémé et du Mono\n• Humains : main-d'œuvre rurale nombreuse, savoir-faire paysan\n• Cultures variées : coton, anacarde, ananas, riz, maïs, igname, manioc, palmier à huile\n• Mesures de l'État : diversification, appui aux filières\n• Transition : malgré ces atouts, l'agriculture rencontre des difficultés"}, {"label": "Consigne 2", "points": 3, "text": "• Agriculture surtout traditionnelle et peu mécanisée\n• Aléas climatiques (irrégularité des pluies)\n• Dépendance au coton : variation des cours mondiaux et coûts de production\n• Difficultés d'accès au crédit\n• Pistes rurales dégradées, mauvaise évacuation des récoltes\n• Faible transformation locale des produits\n• Transition : il faut des solutions durables"}, {"label": "Consigne 3", "points": 3, "text": "• Mécaniser et moderniser (engrais, semences améliorées, irrigation)\n• Transformer sur place les produits (anacarde, coton, manioc) pour créer de la valeur ajoutée\n• Diversifier les cultures pour réduire la dépendance au coton\n• Faciliter l'accès au crédit et former les producteurs\n• Aménager les pistes rurales et organiser les filières"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : bien soutenue, l'agriculture peut devenir un moteur de développement et de sortie de la dépendance\n• Ouverture : comment relier agriculture et industrie pour un développement durable ?"}]}]}, {"id": "E14", "num": "14", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA2", "contexte": "L'ONU a pour mission première de préserver la paix. Dans les régions en conflit, elle intervient parfois grâce à des soldats appelés casques bleus.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer le rôle de l'ONU dans le maintien de la paix.", "support": "Texte (rédigé pour l'exercice, d'après des données générales sur les opérations de maintien de la paix de l'ONU) : « Pour préserver la paix, l'ONU envoie parfois des soldats, appelés casques bleus, dans les régions en conflit. Ces soldats ne font pas la guerre : ils séparent les belligérants, surveillent les cessez-le-feu et protègent les populations civiles. Leur mission est décidée par le Conseil de sécurité avec l'accord des États concernés. Mais l'ONU n'a pas d'armée permanente : elle dépend des soldats que les États acceptent de lui prêter, et les moyens manquent souvent. »", "consignes": ["Présente le texte.", "Explique les idées défendues dans le texte.", "Porte un jugement critique sur le texte.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (présentation d'une mission de l'ONU)\n• Source : texte rédigé pour l'exercice, d'après des données générales\n• Auteur : non précisé ; destinataires : élèves, grand public\n• Idée générale : les casques bleus contribuent à la paix mais l'ONU manque de moyens propres\n• Centres d'intérêt : 1) le rôle des casques bleus, 2) le cadre de leur mission, 3) les limites"}, {"label": "Consigne 2", "points": 3, "text": "• Les casques bleus séparent les belligérants, surveillent les cessez-le-feu, protègent les civils\n• Ils ne font pas la guerre : ils sont déployés avec l'accord des États concernés\n• La décision revient au Conseil de sécurité (15 membres, 9 voix nécessaires, sans veto)\n• L'ONU n'a pas d'armée permanente : elle dépend des contingents prêtés par les États"}, {"label": "Consigne 3", "points": 3, "text": "• Forme : texte clair et structuré, ton neutre\n• Fond : bonne description du rôle des casques bleus, mais texte incomplet (n'évoque pas les échecs : Rwanda en 1994, Srebrenica en 1995)\n• Limites : manque de moyens, mandats parfois flous, droit de veto qui bloque certaines décisions\n• Réussites : missions en Afrique, comme en Côte d'Ivoire ou au Libéria, qui ont aidé à stabiliser des pays"}, {"label": "Consigne 4", "points": 2, "text": "• Intérêt : montre l'action concrète de l'ONU pour la paix\n• Portée : l'ONU reste utile mais dépend de la volonté des États membres\n• Actualité : la réforme du Conseil de sécurité et le financement des opérations restent débattus"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA1", "contexte": "Le Bénin, pays côtier ouvert sur le golfe de Guinée, tire une part importante de ses revenus du commerce de transit.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour faire comprendre le rôle du port de Cotonou dans l'économie béninoise.", "support": "Texte (rédigé pour l'exercice) : « Le port autonome de Cotonou est la principale porte d'entrée maritime du Bénin. Il reçoit chaque année de grandes quantités de marchandises, dont une grande partie est destinée au Nigeria voisin et aux pays enclavés du Sahel comme le Niger, le Burkina Faso et le Mali. Ce commerce de transit fait travailler des transporteurs, des dockers et des commerçants. Mais l'encombrement du port, l'état des routes et les lenteurs administratives augmentent les coûts, et une décision douanière du Nigeria peut ralentir brutalement l'activité. »", "consignes": ["Présente le texte.", "Explique le rôle du port de Cotonou dans l'économie béninoise.", "Détermine les problèmes qui freinent l'efficacité du port et du transit.", "Expose les solutions possibles pour améliorer le transit.", "Donne ton opinion sur l'importance de diversifier l'économie pour limiter la dépendance vis-à-vis du Nigeria."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice ; cadre géographique : Bénin, golfe de Guinée\n• Idée générale : le port de Cotonou est essentiel mais ses performances dépendent de facteurs internes et externes\n• Centres d'intérêt : 1) rôle du port, 2) emplois créés, 3) difficultés"}, {"label": "Consigne 2", "points": 2, "text": "• Porte d'entrée maritime du pays et des pays de l'hinterland (Niger, Burkina Faso, Mali)\n• Source de recettes douanières et de revenus pour l'État\n• Créateur d'emplois : transporteurs, dockers, commerçants, transitaires\n• Moteur du commerce de réexportation vers le Nigeria"}, {"label": "Consigne 3", "points": 2, "text": "• Encombrement du port\n• Routes et corridors dégradés\n• Lenteurs administratives et multiplication des contrôles\n• Dépendance vis-à-vis des décisions douanières du Nigeria"}, {"label": "Consigne 4", "points": 2, "text": "• Moderniser le port (extension, équipements, guichet unique)\n• Entretenir et aménager les corridors (route, rail)\n• Simplifier les procédures et lutter contre la corruption\n• Développer des ports secs et la logistique"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : une économie diversifiée résiste mieux aux chocs extérieurs\n• Pistes : transformer sur place les produits agricoles, développer l'industrie légère, le tourisme et les services\n• Conclure en reliant diversification et réduction de la dépendance"}]}]}, {"id": "E15", "num": "15", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA4", "contexte": "Après la Seconde Guerre mondiale, les peuples colonisés d'Afrique noire réclament leur liberté sous l'effet de causes internes et externes.", "tache": "Pour expliquer le processus de la décolonisation en Afrique noire, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les facteurs externes de la décolonisation.", "Explique les facteurs internes de l'émancipation des Africains.", "Décris les réformes engagées par la France pour répondre à cette contestation."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : après 1945, les empires coloniaux sont contestés (indépendances en Asie dès 1945-1950)\n• Problématique : comment expliquer l'émancipation de l'Afrique noire française ?\n• Plan : facteurs externes, facteurs internes, réponses de la France"}, {"label": "Consigne 1", "points": 3, "text": "• Seconde Guerre mondiale : affaiblissement de la France, participation des colonies\n• Charte de l'Atlantique (1941) et création de l'ONU (1945) : droit des peuples à disposer d'eux-mêmes\n• Hostilité des États-Unis et de l'URSS au colonialisme\n• Conférence de Bandung (1955) et indépendance de l'Asie et du Ghana (1957)\n• Transition : ces influences extérieures trouvent un écho en Afrique"}, {"label": "Consigne 2", "points": 3, "text": "• Rôle de l'école et des églises : diffusion des idées de liberté et d'égalité\n• Intellectuels africains et nationalistes\n• Partis politiques (RDA) et syndicats\n• Anciens combattants revenus de la guerre\n• Transition : face à cette pression, la France réagit"}, {"label": "Consigne 3", "points": 3, "text": "• Conférence de Brazzaville (1944) : réformes promises, indépendance exclue\n• Constitution de 1946 : Union française ; fin du travail forcé et du code de l'indigénat\n• Loi-cadre Defferre (23 juin 1956) : collège unique, suffrage universel, conseils de gouvernement\n• Communauté franco-africaine (référendum du 28 septembre 1958)"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'indépendance résulte de facteurs externes, de la mobilisation des Africains et des réformes françaises\n• Ouverture : quelle gestion de l'indépendance par les nouveaux États ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA3", "contexte": "Malgré sa puissance industrielle, le Japon fait face à des difficultés qui menacent son rang dans l'économie mondiale.", "tache": "Pour montrer comment le Japon cherche à maintenir sa place, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente l'organisation de l'espace industriel du Japon.", "Détermine les problèmes de l'économie japonaise.", "Expose les stratégies adoptées pour y faire face."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : le Japon est un pays à économie dominante d'Asie de l'Est, pauvre en ressources\n• Problématique : comment l'économie japonaise surmonte-t-elle ses difficultés ?\n• Plan : espace industriel, problèmes, stratégies"}, {"label": "Consigne 1", "points": 3, "text": "• Industrie concentrée sur la façade pacifique : Tokyo, Nagoya, Osaka\n• Grands ports qui importent les matières premières et exportent les produits\n• Plaines littorales aménagées, marché de consommateurs important\n• Intérieur montagneux, moins peuplé et moins industrialisé\n• Transition : cette organisation s'accompagne de difficultés"}, {"label": "Consigne 2", "points": 3, "text": "• Territoire exigu, dépendance énergétique et minière\n• Vieillissement de la population, manque de main-d'œuvre\n• Concurrence de la Chine, de la Corée du Sud, des États-Unis et de l'Union européenne\n• Déclin de certaines industries (textile)\n• Risques naturels (séismes, tsunamis), pollution\n• Transition : le pays met en œuvre des stratégies d'adaptation"}, {"label": "Consigne 3", "points": 3, "text": "• Restructuration industrielle et industries de haute technologie\n• Recherche-développement et innovation\n• Délocalisations vers l'Asie du Sud-Est\n• Diversification des partenaires et des sources d'énergie\n• Robotisation pour compenser le manque de main-d'œuvre"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : en innovant et en s'adaptant, le Japon préserve sa puissance\n• Ouverture : quelles leçons pour un pays comme le Bénin ?"}]}]}, {"id": "E16", "num": "16", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "En 1958, la France propose à ses colonies d'Afrique une Communauté, tout en laissant la possibilité de choisir l'indépendance immédiate.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour faire comprendre l'importance du référendum de 1958 dans la marche vers les indépendances.", "support": "Texte (rédigé pour l'exercice, d'après des données générales sur le référendum du 28 septembre 1958) : « Le 28 septembre 1958, les populations des colonies françaises d'Afrique sont appelées à voter sur la Constitution de la Ve République. Elles doivent répondre « oui » pour rester dans la Communauté, en association avec la France, ou « non » pour choisir l'indépendance immédiate. Dans la quasi-totalité des territoires, le « oui » l'emporte. Seule la Guinée de Sékou Touré choisit le « non » et devient indépendante le 2 octobre 1958, mais elle est aussitôt privée de l'aide française. »", "consignes": ["Présente le texte.", "Explique le choix proposé aux populations africaines.", "Porte un jugement critique sur la liberté réelle de ce choix.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte historique et politique\n• Source : texte rédigé pour l'exercice ; date : référendum du 28 septembre 1958\n• Idée générale : le référendum de 1958 offre un choix entre Communauté et indépendance immédiate\n• Centres d'intérêt : 1) l'enjeu du vote, 2) le résultat général, 3) le cas de la Guinée"}, {"label": "Consigne 2", "points": 3, "text": "• « Oui » : rester dans la Communauté franco-africaine, avec autonomie interne mais défense, monnaie et politique étrangère aux mains de la France\n• « Non » : indépendance immédiate, sans l'appui de la France\n• Le Dahomey vote « oui » et devient, le 4 décembre 1958, une République autonome"}, {"label": "Consigne 3", "points": 3, "text": "• Choix proposé dans un contexte de pressions : menace de rupture de l'aide en cas de « non »\n• Information limitée, forte influence des administrateurs et des élites favorables à la Communauté\n• Le « oui » ne signifie pas toujours un refus de l'indépendance mais le choix de la prudence\n• La Guinée paie son choix (retrait brutal de l'aide française)"}, {"label": "Consigne 4", "points": 2, "text": "• Intérêt : le référendum est une étape décisive vers les indépendances de 1960\n• Portée : la Communauté éclate rapidement ; en 1960, la plupart des territoires accèdent à l'indépendance, dont le Dahomey (1er août 1960)\n• L'exemple de la Guinée montre le prix de l'indépendance mais encourage les autres leaders"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA3", "contexte": "Pays montagneux et pauvre en ressources, le Japon a concentré son industrie sur quelques régions littorales.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'organisation de l'espace industriel japonais.", "support": "Texte (rédigé pour l'exercice) : « Au Japon, l'industrie est concentrée sur la façade pacifique de l'île de Honshu, où s'alignent Tokyo, Nagoya et Osaka. Ces régions disposent de grands ports qui reçoivent le pétrole, le fer et le charbon importés, de vastes plaines littorales aménagées pour installer les usines et d'un important marché de consommateurs. Le reste de l'archipel, très montagneux, est moins peuplé et moins industrialisé. Cette concentration provoque cependant une forte pollution, des prix fonciers très élevés et une grande exposition aux séismes. »", "consignes": ["Présente le texte.", "Explique les raisons de la concentration industrielle sur la façade pacifique.", "Détermine les inconvénients de cette concentration.", "Expose les mesures susceptibles de corriger ces déséquilibres.", "Donne ton opinion sur l'intérêt d'un aménagement équilibré du territoire pour le Bénin."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse géographique)\n• Source : texte rédigé pour l'exercice ; cadre : Japon, île de Honshu\n• Idée générale : l'industrie japonaise se concentre sur le littoral pacifique, avec des avantages et des inconvénients\n• Centres d'intérêt : 1) localisation, 2) raisons, 3) conséquences"}, {"label": "Consigne 2", "points": 2, "text": "• Ports importateurs de matières premières et exportateurs de produits finis\n• Plaines littorales aménagées, marché de consommateurs important\n• Proximité des grandes villes (main-d'œuvre, capitaux, services)\n• Relief montagneux de l'intérieur peu favorable aux usines"}, {"label": "Consigne 3", "points": 2, "text": "• Pollution\n• Prix fonciers très élevés\n• Surpeuplement et congestion\n• Exposition aux séismes et aux tsunamis\n• Déséquilibre entre régions"}, {"label": "Consigne 4", "points": 2, "text": "• Décentralisation industrielle vers d'autres régions\n• Développement des industries de haute technologie, moins polluantes\n• Normes environnementales\n• Aménagement des transports (trains à grande vitesse)"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : une répartition équilibrée des activités limite la congestion et réduit les inégalités\n• Application au Bénin : concentration sur Cotonou et le littoral, nécessité de développer l'intérieur (Parakou, Natitingou, Djougou)\n• Conclure sur l'équilibre entre développement et aménagement"}]}]}, {"id": "E17", "num": "17", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA2", "contexte": "La Seconde Guerre mondiale et l'échec de la Société des Nations conduisent les puissances alliées à imaginer une nouvelle organisation internationale.", "tache": "Pour expliquer la création de l'ONU, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente le contexte qui conduit à l'idée d'une nouvelle organisation internationale.", "Retrace les étapes de la création de l'ONU de 1941 à 1945.", "Détermine les buts de l'ONU énoncés dans la Charte."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : la Seconde Guerre mondiale (1939-1945) fait des dizaines de millions de morts\n• Problématique : comment et pourquoi l'ONU est-elle créée en 1945 ?\n• Plan : contexte, étapes, buts"}, {"label": "Consigne 1", "points": 3, "text": "• Échec de la Société des Nations (créée en 1919) face aux agressions des années 1930\n• Horreurs de la guerre : bombardements, génocide, destructions\n• Volonté des Alliés d'éviter une nouvelle guerre mondiale\n• Transition : les Alliés préparent un nouveau cadre dès 1941"}, {"label": "Consigne 2", "points": 3, "text": "• Charte de l'Atlantique (août 1941)\n• Déclaration des Nations unies (1er janvier 1942)\n• Conférences de Moscou et de Téhéran (1943)\n• Dumbarton Oaks (1944)\n• Yalta (février 1945)\n• San Francisco (avril-juin 1945), Charte signée le 26 juin ; entrée en vigueur le 24 octobre 1945"}, {"label": "Consigne 3", "points": 3, "text": "• Maintenir la paix et la sécurité internationales\n• Développer des relations amicales entre les nations fondées sur l'égalité et le droit des peuples à disposer d'eux-mêmes\n• Réaliser la coopération internationale (économique, sociale, culturelle, humanitaire)\n• Promouvoir les droits de l'homme"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : née de la guerre et de l'échec de la SDN, l'ONU vise la paix et la coopération entre les nations\n• Ouverture : l'ONU a-t-elle atteint ses objectifs ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA5", "contexte": "Chine et Brésil connaissent depuis plusieurs décennies une forte croissance, mais leur émergence reste inachevée.", "tache": "Pour faire comprendre les limites de l'émergence économique, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les signes de l'émergence économique de la Chine et du Brésil.", "Détermine les limites de cette émergence.", "Propose des conditions d'une émergence durable."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : la Chine et le Brésil sont membres des BRICS\n• Problématique : pourquoi leur émergence reste-t-elle fragile ?\n• Plan : signes, limites, conditions d'une émergence durable"}, {"label": "Consigne 1", "points": 3, "text": "• Chine : réformes de 1978, zones économiques spéciales (Shenzhen), atelier du monde, entrée à l'OMC (2001)\n• Brésil : agriculture puissante (soja, café, canne à sucre), fer, pétrole, industrie du Sud-Est (São Paulo), grand marché intérieur\n• Rôle croissant dans le commerce mondial et en Afrique\n• Transition : cette réussite ne doit pas masquer des fragilités"}, {"label": "Consigne 2", "points": 3, "text": "• Inégalités sociales et régionales (littoral/intérieur en Chine ; pauvreté et favelas au Brésil)\n• Pollution et atteintes à l'environnement (déforestation de l'Amazonie)\n• Dépendance aux exportations et aux cours des matières premières (récession brésilienne de 2015-2016)\n• Vieillissement de la population chinoise\n• Transition : des conditions doivent être réunies pour durer"}, {"label": "Consigne 3", "points": 3, "text": "• Réduire les inégalités (éducation, santé, emploi)\n• Diversifier l'économie et monter en gamme\n• Protéger l'environnement et promouvoir un développement durable\n• Renforcer le marché intérieur et l'innovation"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : l'émergence est réelle mais fragile ; elle suppose un développement plus équilibré\n• Ouverture : quelles leçons pour les pays africains comme le Bénin ?"}]}]}, {"id": "E18", "num": "18", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA2", "contexte": "Au sein de l'ONU, le Conseil de sécurité est l'organe le plus puissant, mais sa composition est de plus en plus critiquée.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les limites du droit de veto et les demandes de réforme du Conseil de sécurité.", "support": "Texte (rédigé pour l'exercice) : « Depuis 1945, cinq États seulement — les États-Unis, la Russie, le Royaume-Uni, la France et la Chine — disposent d'un siège permanent au Conseil de sécurité et du droit de veto. Un seul vote négatif de l'un d'eux suffit à bloquer une décision, même soutenue par tous les autres membres. Plusieurs pays, dont des États africains, demandent que le Conseil reflète mieux le monde actuel, car l'Afrique, qui compte de nombreux membres de l'ONU, ne dispose d'aucun siège permanent. »", "consignes": ["Présente le texte.", "Explique les idées défendues dans le texte.", "Porte un jugement critique sur le texte.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif et critique\n• Source : texte rédigé pour l'exercice ; objet : composition du Conseil de sécurité\n• Idée générale : le veto et la composition du Conseil sont contestés, en particulier par l'Afrique\n• Centres d'intérêt : 1) le privilège des cinq permanents, 2) la critique et la demande de réforme"}, {"label": "Consigne 2", "points": 3, "text": "• Cinq États permanents détiennent le droit de veto depuis 1945\n• Un seul veto suffit à bloquer une décision, même soutenue par les autres membres\n• Les demandeurs de réforme jugent la composition dépassée : l'Afrique n'a aucun siège permanent\n• Les décisions de fond nécessitent 9 voix sur 15, sans veto d'un permanent"}, {"label": "Consigne 3", "points": 3, "text": "• Forme : texte clair, ton critique mais mesuré\n• Fond : critique fondée (paralysies dans les crises de Syrie et d'Ukraine)\n• Mais le veto a aussi servi de garde-fou et d'équilibre entre grandes puissances\n• Difficulté : les permanents refusent de renoncer à leur privilège ; la réforme exige leur accord"}, {"label": "Consigne 4", "points": 2, "text": "• Intérêt : met en évidence les limites de l'ONU dans le maintien de la paix\n• Portée : demandes d'élargissement du Conseil, meilleure représentation de l'Afrique, de l'Amérique latine et de l'Asie\n• Débat toujours ouvert aujourd'hui"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA5", "contexte": "Le Brésil est la première puissance économique d'Amérique du Sud, mais son développement soulève des questions économiques et environnementales.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les forces et les fragilités de l'économie brésilienne.", "support": "Texte (rédigé pour l'exercice) : « Premier producteur mondial de café et l'un des tout premiers producteurs de soja, le Brésil tire une grande part de ses revenus de ses exportations agricoles. Les fronts pionniers gagnent peu à peu sur la forêt amazonienne, au prix d'une déforestation qui inquiète le monde entier. L'industrie, concentrée autour de São Paulo, reste dépendante des cours des matières premières, comme l'a montré la récession de 2015-2016. »", "consignes": ["Présente le texte.", "Explique les atouts agricoles du Brésil.", "Détermine les problèmes liés à son modèle de développement.", "Expose les mesures pour un développement durable.", "Donne ton opinion sur les leçons que le Bénin peut tirer de l'expérience brésilienne."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse économique et environnementale)\n• Source : texte rédigé pour l'exercice ; cadre géographique : Brésil\n• Idée générale : le Brésil est une puissance agricole mais son modèle est fragile\n• Centres d'intérêt : 1) force agricole, 2) pression sur l'Amazonie, 3) dépendance industrielle"}, {"label": "Consigne 2", "points": 2, "text": "• Vastes terres, climats variés, agriculture mécanisée\n• Productions majeures : café, soja, canne à sucre, viande\n• Position de leader sur les marchés mondiaux\n• Revenus d'exportation importants"}, {"label": "Consigne 3", "points": 2, "text": "• Déforestation de l'Amazonie\n• Dépendance aux cours mondiaux des matières premières\n• Industrie sensible aux crises (récession 2015-2016)\n• Inégalités sociales"}, {"label": "Consigne 4", "points": 2, "text": "• Protection de l'Amazonie et contrôle de la déforestation\n• Diversification et transformation des produits sur place\n• Pratiques agricoles durables\n• Investissements dans l'éducation et l'innovation"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : diversifier et transformer sur place pour réduire la dépendance\n• Liens historiques et culturels Bénin-Brésil, coopération agricole possible\n• Importance de concilier croissance et protection de l'environnement"}]}]}, {"id": "E19", "num": "19", "parts": [{"partie": "Histoire", "type": "Dissertation", "sa": "SA4", "contexte": "Après près de dix-huit ans de régime militaro-marxiste, le Bénin connaît en 1990 un tournant politique majeur.", "tache": "Pour expliquer la transition démocratique de 1990, tu es invité(e) à produire une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les causes de la crise du régime de Mathieu Kérékou à la fin des années 1980.", "Décris le déroulement de la Conférence nationale de février 1990.", "Détermine les résultats de la Conférence nationale."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : après l'instabilité de 1960 à 1972, Kérékou prend le pouvoir le 26 octobre 1972 et instaure en 1975 la République populaire du Bénin\n• Problématique : comment le Bénin passe-t-il du régime militaro-marxiste à la démocratie ?\n• Plan : causes de la crise, déroulement de la Conférence, résultats"}, {"label": "Consigne 1", "points": 3, "text": "• Crise économique et financière (faillite des banques d'État, endettement)\n• Retards de paiement des salaires, grèves des travailleurs et des étudiants\n• Contestation politique, régime autoritaire et parti unique\n• Contexte international : chute du bloc soviétique, vent de démocratisation en Afrique\n• Transition : le pouvoir accepte le dialogue"}, {"label": "Consigne 2", "points": 3, "text": "• Conférence nationale des forces vives de la nation, du 19 au 28 février 1990, à Cotonou\n• Participation des partis, syndicats, Églises, associations et anciens dirigeants\n• Présidée par Mgr Isidore de Souza\n• Déclaration de la Conférence souveraine : les décisions s'imposent au pouvoir\n• Fin du marxisme-léninisme et du parti unique"}, {"label": "Consigne 3", "points": 3, "text": "• Mise en place d'un gouvernement de transition dirigé par Nicéphore Soglo\n• Adoption d'une nouvelle Constitution (référendum de décembre 1990)\n• Retour du multipartisme, des libertés et du pluralisme\n• Élections de 1991 et alternance pacifique : Soglo est élu président et Kérékou reconnaît sa défaite"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : la Conférence nationale ouvre l'ère du renouveau démocratique et devient un modèle pour d'autres pays africains\n• Ouverture : comment consolider la démocratie et le développement ?"}]}, {"partie": "Géographie", "type": "Dissertation", "sa": "SA6", "contexte": "Membre de la CEDEAO depuis sa création, le Bénin occupe une position stratégique en Afrique de l'Ouest.", "tache": "Pour faire comprendre la place du Bénin dans la CEDEAO, produis une dissertation à partir des consignes suivantes.", "support": "", "consignes": ["Présente les avantages tirés par le Bénin de son appartenance à la CEDEAO.", "Détermine les difficultés que le Bénin rencontre dans cet espace.", "Propose des solutions pour mieux profiter de l'intégration régionale."], "elements": [{"label": "Introduction et transitions", "points": 0.5, "text": "• Préambule : la CEDEAO est créée le 28 mai 1975 par le traité de Lagos ; le Bénin en est membre fondateur\n• Problématique : comment le Bénin profite-t-il de la CEDEAO et quels obstacles doit-il surmonter ?\n• Plan : avantages, difficultés, solutions"}, {"label": "Consigne 1", "points": 3, "text": "• Accès à un vaste marché ouest-africain (Nigeria notamment)\n• Libre circulation des personnes et des biens (protocole de 1979)\n• Port de Cotonou, porte d'entrée de l'hinterland (Niger, Burkina Faso, Mali)\n• Corridors et projets d'infrastructures (route trans-côtière Lagos-Abidjan)\n• Paix et sécurité régionales, coopération sanitaire (OOAS)\n• Transition : ces avantages restent limités par des difficultés"}, {"label": "Consigne 2", "points": 3, "text": "• Commerce informel et contrebande\n• Forte dépendance vis-à-vis du Nigeria\n• Infrastructures insuffisantes, lourdeurs administratives, multiples barrages\n• Diversité des monnaies, des langues et des niveaux de développement\n• Instabilité politique dans certains pays membres\n• Transition : des solutions s'imposent"}, {"label": "Consigne 3", "points": 3, "text": "• Formaliser le commerce et simplifier les procédures douanières\n• Moderniser le port et entretenir les corridors\n• Développer l'industrie et la transformation locale pour mieux profiter du marché régional\n• Diversifier les partenaires commerciaux\n• Renforcer la coopération politique et la paix"}, {"label": "Conclusion", "points": 0.5, "text": "• Point : le Bénin tire d'importants avantages de la CEDEAO, à condition de surmonter ses fragilités\n• Ouverture : quel avenir pour l'intégration régionale africaine ?"}]}]}, {"id": "E20", "num": "20", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "En 1956, la France adopte une loi qui transforme la vie politique de ses territoires d'Afrique noire.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'apport de la loi-cadre Defferre à la marche vers l'indépendance.", "support": "Texte (rédigé pour l'exercice, d'après des données générales sur la loi-cadre du 23 juin 1956) : « La loi-cadre du 23 juin 1956 transforme profondément la vie politique des territoires d'Afrique noire française. Le suffrage universel et le collège unique remplacent le vote réservé à une minorité. Des conseils de gouvernement composés d'Africains élus gèrent désormais les affaires locales, tandis que la France conserve la défense, la monnaie et la politique étrangère. Mais cette loi, qui multiplie les petits gouvernements, divise l'Afrique occidentale en territoires isolés, ce que dénoncent certains leaders, partisans d'États fédéraux. »", "consignes": ["Présente le texte.", "Explique les idées défendues dans le texte.", "Porte un jugement critique sur le texte.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte historique et juridique\n• Source : texte rédigé pour l'exercice ; objet : la loi-cadre Defferre du 23 juin 1956\n• Idée générale : la loi-cadre accorde une autonomie interne mais divise les territoires\n• Centres d'intérêt : 1) les avancées démocratiques, 2) les limites"}, {"label": "Consigne 2", "points": 3, "text": "• Suffrage universel et collège unique : tous les citoyens votent sur un pied d'égalité\n• Conseils de gouvernement composés d'Africains élus, dotés de pouvoirs sur les affaires locales\n• La France garde la défense, la monnaie et la politique étrangère\n• Division de l'AOF en territoires distincts : certains leaders (comme Senghor) dénoncent la « balkanisation »"}, {"label": "Consigne 3", "points": 3, "text": "• Forme : texte clair et équilibré\n• Fond : l'autonomie reste partielle, la France garde les domaines essentiels\n• La loi prépare les élites africaines à gouverner, mais divise l'Afrique occidentale\n• Les partisans d'États fédéraux jugent la loi dangereuse pour l'unité africaine"}, {"label": "Consigne 4", "points": 2, "text": "• Intérêt : étape décisive vers l'indépendance, qui forme une génération de dirigeants\n• Portée : prépare le référendum de 1958 et les indépendances de 1960\n• Au Dahomey : le territoire gagne en autonomie politique"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA6", "contexte": "La CEDEAO ambitionne de créer un espace économique intégré en Afrique de l'Ouest, mais les échanges entre ses membres restent faibles.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les difficultés de l'intégration économique ouest-africaine.", "support": "Texte (rédigé pour l'exercice) : « Pour faciliter les échanges entre ses États membres, la CEDEAO a adopté la libre circulation des personnes et un tarif extérieur commun. Pourtant, les échanges entre pays membres restent faibles : les routes sont souvent en mauvais état, les contrôles sur les corridors se multiplient et chaque pays garde ses habitudes administratives. De plus, les crises politiques fragilisent la solidarité régionale. »", "consignes": ["Présente le texte.", "Explique les mesures prises pour faciliter les échanges dans la CEDEAO.", "Détermine les obstacles qui freinent l'intégration.", "Expose les solutions possibles pour dynamiser les échanges.", "Donne ton opinion sur l'intérêt de l'intégration régionale pour le Bénin."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif (analyse économique)\n• Source : texte rédigé pour l'exercice ; cadre géographique : Afrique de l'Ouest\n• Idée générale : malgré des mesures favorables, l'intégration reste limitée\n• Centres d'intérêt : 1) mesures prises, 2) obstacles"}, {"label": "Consigne 2", "points": 2, "text": "• Libre circulation des personnes (protocole de 1979)\n• Tarif extérieur commun\n• Corridors de transport, projets d'infrastructures\n• Objectif : un marché ouest-africain unifié"}, {"label": "Consigne 3", "points": 2, "text": "• Routes en mauvais état et infrastructures insuffisantes\n• Contrôles multiples sur les corridors, lourdeurs administratives\n• Diversité des monnaies, des langues et des niveaux de développement\n• Économies peu complémentaires, concurrence entre productions similaires\n• Instabilité politique et crises de confiance"}, {"label": "Consigne 4", "points": 2, "text": "• Moderniser et entretenir les infrastructures\n• Réduire les barrages routiers et simplifier les formalités\n• Développer l'industrie et la transformation locale pour diversifier les échanges\n• Harmoniser les politiques et progresser vers une monnaie commune"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : l'intégration élargit le marché pour un pays de petite taille comme le Bénin\n• Elle facilite le transit via Cotonou et attire les investisseurs\n• Elle exige cependant de diversifier l'économie et de limiter la dépendance au Nigeria"}]}]}, {"id": "E21", "num": "21", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "Colonie britannique appelée Gold Coast, le Ghana devient en 1957 le premier pays d'Afrique noire indépendant.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer la signification de l'indépendance du Ghana.", "support": "Texte (adapté, non littéral, d'après un discours de Kwame Nkrumah, Accra, 6 mars 1957) : « Le Ghana est enfin libre. Notre indépendance restera incomplète tant que d'autres peuples d'Afrique demeureront sous domination étrangère. Nous devons désormais prouver que l'homme noir est capable de gérer ses propres affaires. Nous voulons montrer au monde que nous sommes prêts à bâtir notre pays par notre travail et notre unité. »", "consignes": ["Présente le texte.", "Explique les idées défendues dans le texte.", "Porte un jugement critique sur la portée de ces idées.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : discours politique\n• Auteur : Kwame Nkrumah, Premier ministre du Ghana, chef du Parti de la Convention du Peuple\n• Lieu et date : Accra, 6 mars 1957, jour de l'indépendance\n• Destinataires : le peuple ghanéen, les Africains, le monde\n• Idée générale : célébration de l'indépendance et appel à libérer tout le continent\n• Centres d'intérêt : 1) joie de l'indépendance, 2) solidarité panafricaine, 3) engagement à construire le pays"}, {"label": "Consigne 2 : Explication des idées", "points": 3, "text": "• Indépendance incomplète tant que l'Afrique n'est pas libre → idée panafricaine\n• Fierté et dignité de l'homme noir\n• Défi : prouver la capacité des Africains à gouverner\n• Appel au travail et à l'unité nationale"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Le discours a nourri l'élan des indépendances de 1960 et la création de l'OUA (1963, Addis-Abeba)\n• Mais le Ghana a connu des difficultés : crise économique, pouvoir de plus en plus autoritaire, coup d'État de 1966\n• Idéal d'unité africaine réalisé en partie seulement (OUA puis Union africaine en 2002)"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : document majeur du panafricanisme\n• Portée : modèle pour les nationalistes africains, symbole de la fin de la domination coloniale en Afrique noire\n• Limite : les idéaux affichés se sont heurtés aux réalités politiques et économiques"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA5", "contexte": "L'industrie chinoise occupe une place importante dans l'économie mondiale.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'industrie chinoise.", "support": "Texte (rédigé pour l'exercice) : « Depuis les réformes de 1978, la Chine a bâti une puissante industrie sur son littoral. Les zones économiques spéciales ont attiré les capitaux étrangers, et une main-d'œuvre nombreuse a permis de produire à bas coût. Aujourd'hui, la Chine fabrique une grande partie des textiles, des appareils électroniques et des machines vendus dans le monde. Mais cette réussite a un prix : les usines polluent l'air et l'eau, les salaires augmentent et les régions de l'intérieur restent en retard. »", "consignes": ["Présente le texte.", "Explique les facteurs de la réussite industrielle de la Chine.", "Expose les aspects de la puissance industrielle chinoise.", "Détermine les limites de cette réussite.", "Donne ton opinion sur l'impact des produits chinois sur l'économie africaine."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Chine, pays émergent d'Asie\n• Idée générale : industrialisation rapide mais déséquilibrée\n• Centres d'intérêt : 1) réformes et réussite, 2) coût de cette réussite"}, {"label": "Consigne 2", "points": 2, "text": "• Réformes de 1978 (Deng Xiaoping)\n• Zones économiques spéciales et investissements étrangers\n• Main-d'œuvre nombreuse et peu coûteuse\n• Marché intérieur et politique volontariste de l'État"}, {"label": "Consigne 3", "points": 2, "text": "• Textile, électronique, machines, jouets\n• Une grande part de la production industrielle mondiale\n• Exportations vers tous les continents et grands ports"}, {"label": "Consigne 4", "points": 2, "text": "• Pollution de l'air et de l'eau\n• Hausse des salaires et perte de l'avantage du bas coût\n• Inégalités littoral/intérieur\n• Dépendance aux exportations"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion nuancée : les produits chinois bon marché profitent aux consommateurs africains et facilitent l'équipement, mais ils concurrencent les industries locales et peuvent freiner l'industrialisation ; l'Afrique doit négocier des partenariats avec transfert de technologie"}]}]}, {"id": "E22", "num": "22", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "En avril 1955, des pays d'Asie et d'Afrique se réunissent à Bandung pour défendre leurs intérêts communs.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'apport de la conférence de Bandung à la décolonisation.", "support": "Texte (adapté du communiqué final de la conférence de Bandung, avril 1955) : « La conférence condamne le colonialisme sous toutes ses formes, affirme l'égalité de toutes les races et de toutes les nations, et demande le respect des droits fondamentaux de l'homme. Elle appelle à la coopération économique et culturelle entre pays d'Asie et d'Afrique et déclare que la paix mondiale exige la coexistence pacifique et le droit des peuples à disposer d'eux-mêmes. »", "consignes": ["Présente le texte.", "Explique les idées défendues par les participants.", "Porte un jugement critique sur les limites de cette conférence.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : communiqué final (texte politique)\n• Source : conférence de Bandung (Indonésie), 18-24 avril 1955\n• Auteurs : les représentants de 29 pays d'Asie et d'Afrique\n• Destinataires : opinion mondiale, puissances coloniales, deux blocs de la guerre froide\n• Contexte : décolonisation de l'Asie, guerre froide, guerre d'Algérie naissante\n• Idée générale : condamnation du colonialisme et solidarité afro-asiatique\n• Centres d'intérêt : 1) condamnation du colonialisme et égalité des peuples, 2) coopération et coexistence pacifique"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Le colonialisme est une injustice à combattre\n• Égalité des races et des nations, droit des peuples à disposer d'eux-mêmes\n• Coopération économique et culturelle entre pays du Sud\n• Refus de s'aligner sur les blocs : coexistence pacifique"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Résolution sans moyens de contrainte\n• Pays participants aux régimes et intérêts très différents\n• Peu de représentants de l'Afrique noire, encore largement colonisée\n• Divergences sur le rapport aux deux blocs"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : naissance du Tiers Monde et du non-alignement\n• Portée : encourage les nationalistes africains, renforce la pression sur l'ONU, prépare l'indépendance du Ghana (1957) et la vague de 1960"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA1", "contexte": "Pays à économie dominée, le Bénin cherche à transformer sur place ses matières premières pour créer des richesses et des emplois.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les efforts et les difficultés de l'industrialisation du Bénin.", "support": "Texte (rédigé pour l'exercice) : « Le Bénin cherche à transformer sur place une partie de ses matières premières. La création de zones industrielles dans le sud du pays vise à attirer des investisseurs et à créer des emplois. Mais l'électricité reste chère, les entreprises manquent parfois de main-d'œuvre qualifiée et la concurrence des produits importés est vive. Pour réussir, le pays doit améliorer ses infrastructures et former ses jeunes. »", "consignes": ["Présente le texte.", "Décris les efforts d'industrialisation du Bénin.", "Explique les obstacles rencontrés.", "Montre l'importance de la transformation locale pour l'économie béninoise.", "Donne ton opinion sur le rôle de la jeunesse dans l'industrialisation du pays."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Bénin, pays à économie dominée\n• Idée générale : une industrialisation en marche mais freinée par des difficultés\n• Centres d'intérêt : 1) efforts d'industrialisation, 2) obstacles, 3) conditions de réussite"}, {"label": "Consigne 2", "points": 2, "text": "• Transformation sur place d'une partie des matières premières (coton, noix de cajou, etc.)\n• Création de zones industrielles pour attirer des investisseurs\n• Objectif : créer des emplois et de la valeur ajoutée"}, {"label": "Consigne 3", "points": 2, "text": "• Électricité chère\n• Manque de main-d'œuvre qualifiée\n• Concurrence des produits importés\n• Infrastructures insuffisantes, difficultés de financement"}, {"label": "Consigne 4", "points": 2, "text": "• Plus de valeur ajoutée et de revenus pour le pays\n• Création d'emplois, notamment pour les jeunes\n• Réduction de la dépendance aux exportations de produits bruts\n• Moins de sorties de devises pour les importations"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : la jeunesse est une force (nombreuse, dynamique) si elle est formée aux métiers techniques et soutenue dans l'entrepreneuriat ; l'État et le secteur privé doivent investir dans la formation"}]}]}, {"id": "E23", "num": "23", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA2", "contexte": "Après des décennies d'existence, l'ONU dresse un bilan de son action et s'interroge sur ses perspectives.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les réussites et les limites de l'ONU.", "support": "Texte (rédigé pour l'exercice) : « Depuis 1945, l'ONU a contribué à éviter une nouvelle guerre mondiale, elle a accompagné les peuples colonisés vers l'indépendance et défendu les droits de l'homme. Ses agences luttent contre la faim, la maladie et l'analphabétisme. Pourtant, le monde connaît encore des guerres dans lesquelles l'Organisation intervient trop tard ou pas du tout. Le droit de veto des cinq membres permanents du Conseil de sécurité bloque souvent les décisions, et l'écart entre pays riches et pays pauvres continue de se creuser. Pour rester utile, l'ONU doit se réformer. »", "consignes": ["Présente le texte.", "Explique le bilan positif et négatif de l'ONU dressé dans le texte.", "Porte un jugement critique sur l'idée que l'ONU doit se réformer.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : analyse (texte de bilan)\n• Source : texte rédigé pour l'exercice\n• Auteur : un observateur des relations internationales\n• Destinataires : opinion publique, États membres\n• Contexte : monde d'après la guerre froide, débat sur le rôle de l'ONU\n• Idée générale : l'ONU a un bilan contrasté et doit se réformer\n• Centres d'intérêt : 1) les réussites, 2) les échecs et le veto, 3) la nécessité de réformes"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• Réussites : pas de guerre mondiale depuis 1945, casques bleus, décolonisation, Déclaration universelle des droits de l'homme (1948), actions du PAM, de l'OMS, de l'UNESCO\n• Échecs : conflits non résolus, veto qui paralyse le Conseil, manque de moyens, inégalités persistantes"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Le texte est clair et équilibré\n• Il a raison sur le veto, qui contredit l'égalité des États\n• Mais certaines réformes (élargissement du Conseil) sont difficiles car les permanents refusent de perdre leurs privilèges\n• Les échecs tiennent aussi au manque de volonté des États, pas seulement à l'institution"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : présente un bilan honnête de l'ONU\n• Portée : nourrit les débats sur la réforme du Conseil de sécurité et sur la place de l'Afrique"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA3", "contexte": "Malgré sa puissance, le Japon doit affronter des défis qui menacent son avenir économique.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les limites de la puissance économique du Japon.", "support": "Texte (rédigé pour l'exercice) : « Le Japon est resté longtemps l'une des premières économies du monde. Pourtant, sa population vieillit vite et la natalité est faible. Le pays importe presque toute son énergie et subit régulièrement séismes et typhons. La concurrence de la Chine et de la Corée du Sud a réduit la place de certaines industries. Pour garder sa puissance, le gouvernement encourage la robotique et l'accueil de travailleurs étrangers. »", "consignes": ["Présente le texte.", "Décris les limites de la puissance économique du Japon.", "Explique les facteurs de ces difficultés.", "Montre les solutions avancées par le Japon.", "Donne ton opinion sur ce que le Bénin peut retenir de l'expérience japonaise."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Japon, pays à économie dominante\n• Idée générale : une puissance durable mais confrontée à de sérieuses limites\n• Centres d'intérêt : 1) vieillissement et dépendance, 2) concurrence, 3) réponses du gouvernement"}, {"label": "Consigne 2", "points": 2, "text": "• Vieillissement rapide de la population et faible natalité\n• Dépendance énergétique presque totale\n• Exposition aux séismes, tsunamis et typhons\n• Industries concurrencées"}, {"label": "Consigne 3", "points": 2, "text": "• Pauvreté du sous-sol en pétrole et en minerais\n• Archipel montagneux exposé aux catastrophes naturelles\n• Concurrence de la Chine et de la Corée du Sud\n• Natalité faible : baisse de la main-d'œuvre"}, {"label": "Consigne 4", "points": 2, "text": "• Développement de la robotique et de l'automatisation\n• Accueil de travailleurs étrangers\n• Économies d'énergie, énergies renouvelables, innovation technologique"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : le Bénin peut retenir la valeur de l'éducation, de la discipline, de l'innovation et de la valorisation locale des ressources, en les adaptant à ses réalités"}]}]}, {"id": "E24", "num": "24", "parts": [{"partie": "Histoire", "type": "Commentaire de texte", "sa": "SA4", "contexte": "En 1959, alors que la guerre d'Algérie se poursuit, la France change de position sur l'avenir du pays.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer l'attitude de la France face à la décolonisation de l'Algérie.", "support": "Texte (adapté d'un discours du général de Gaulle, 16 septembre 1959) : « Les Algériens décideront eux-mêmes de leur avenir, par un vote libre, quand la paix sera revenue. Ils pourront choisir de rompre avec la France, de s'unir étroitement à elle ou de rester en association avec elle. Le gouvernement s'engage à respecter leur choix. En attendant, l'armée continuera de rétablir l'ordre. »", "consignes": ["Présente le texte.", "Explique les idées développées par l'auteur.", "Porte un jugement critique sur cette position.", "Dégage l'intérêt et la portée du texte."], "elements": [{"label": "Consigne 1 : Présentation du texte", "points": 2, "text": "• Nature : discours politique (extrait adapté)\n• Auteur : Charles de Gaulle, président de la République française\n• Destinataires : Algériens, Français, opinion internationale\n• Contexte : guerre d'Algérie (depuis 1954), retour de de Gaulle en 1958\n• Idée générale : reconnaissance du droit des Algériens à choisir leur avenir\n• Centres d'intérêt : 1) l'autodétermination, 2) les trois options, 3) la poursuite des opérations militaires"}, {"label": "Consigne 2 : Explication", "points": 3, "text": "• La France reconnaît pour la première fois le droit des Algériens à l'autodétermination\n• Trois solutions : sécession, association, francisation\n• Le vote aura lieu après le retour de la paix, donc l'armée doit d'abord rétablir l'ordre"}, {"label": "Consigne 3 : Jugement critique", "points": 3, "text": "• Avancée majeure, mais offre ambiguë : les options sont orientées vers le maintien d'un lien avec la France\n• La condition du retour à la paix retarde l'application\n• Le FLN exige des négociations directes et l'indépendance\n• Les partisans de l'Algérie française et l'armée rejettent l'autodétermination (putsch de 1961)"}, {"label": "Consigne 4 : Intérêt et portée", "points": 2, "text": "• Intérêt : marque un tournant de la politique française\n• Portée : ouvre la voie aux négociations, aux accords d'Évian (mars 1962) et à l'indépendance de juillet 1962"}]}, {"partie": "Géographie", "type": "Commentaire de texte", "sa": "SA6", "contexte": "Depuis 1975, les États d'Afrique de l'Ouest tentent de construire un espace économique commun, mais l'intégration est lente.", "tache": "Tu es invité(e) à commenter le texte ci-dessous pour expliquer les limites de l'intégration au sein de la CEDEAO.", "support": "Texte (rédigé pour l'exercice) : « Depuis 1975, les États de la CEDEAO ont levé plusieurs obstacles à la circulation des personnes et des biens. Pourtant, les échanges entre pays de la région restent faibles : les routes sont insuffisantes, les contrôles aux frontières sont nombreux et les économies produisent des biens semblables. La région fait aussi face à l'insécurité dans le Sahel. Une intégration réelle suppose des infrastructures, des règles respectées et davantage de confiance entre les États. »", "consignes": ["Présente le texte.", "Décris les acquis de la CEDEAO.", "Explique les obstacles à l'intégration.", "Montre les conséquences de ces obstacles pour les économies de la région.", "Donne ton opinion sur l'intérêt de l'intégration régionale pour le Bénin."], "elements": [{"label": "Consigne 1", "points": 2, "text": "• Nature : texte explicatif\n• Source : texte rédigé pour l'exercice\n• Cadre géographique : Afrique de l'Ouest, CEDEAO (créée en 1975)\n• Idée générale : des acquis réels mais une intégration incomplète\n• Centres d'intérêt : 1) acquis, 2) obstacles, 3) conditions de réussite"}, {"label": "Consigne 2", "points": 2, "text": "• Libre circulation des personnes (passeport CEDEAO)\n• Tarif extérieur commun\n• Missions de paix (ECOMOG)\n• Projets d'infrastructures et institutions de financement"}, {"label": "Consigne 3", "points": 2, "text": "• Routes insuffisantes et lenteurs aux frontières\n• Économies peu complémentaires (produits semblables)\n• Insécurité au Sahel et tensions politiques\n• Monnaies différentes"}, {"label": "Consigne 4", "points": 2, "text": "• Faibles échanges intra-régionaux\n• Dépendance vis-à-vis des marchés extérieurs\n• Marchés nationaux trop petits pour industrialiser\n• Frein au développement et à l'emploi"}, {"label": "Consigne 5", "points": 2, "text": "• Opinion argumentée : pour le Bénin, pays de transit et de petit marché, l'intégration élargit les débouchés, facilite les échanges et attire les investisseurs ; elle exige des routes, des règles respectées et la confiance entre États"}]}]}], "exercices": [{"id": "E1", "sa": "SA1", "niveau": "Avancé", "enonce": "Le coton est le principal produit d'exportation du Bénin. Expliquez pourquoi cette spécialisation entretient la dépendance du pays, puis proposez deux solutions argumentées.", "total": 10}, {"id": "E2", "sa": "SA2", "niveau": "Avancé", "enonce": "L'ONU réussit-elle toujours à maintenir la paix ? Répondez en vous appuyant sur ses organes et sur deux exemples d'actions ou de limites.", "total": 10}, {"id": "E3", "sa": "SA3", "niveau": "Avancé", "enonce": "Malgré la pauvreté de son sol en ressources, le Japon est une puissance économique. Expliquez ce paradoxe.", "total": 10}, {"id": "E4", "sa": "SA4", "niveau": "Avancé", "enonce": "Montrez que l'indépendance du Dahomey résulte à la fois de la lutte des Dahoméens et du contexte international.", "total": 10}, {"id": "E5", "sa": "SA5", "niveau": "Avancé", "enonce": "Comparez le modèle de développement de la Chine et celui du Brésil, puis montrez leurs limites communes.", "total": 10}, {"id": "E6", "sa": "SA6", "niveau": "Avancé", "enonce": "La CEDEAO a-t-elle atteint ses objectifs d'intégration ? Discutez avec des réalisations et des difficultés, puis expliquez l'intérêt du Bénin.", "total": 10}], "corriges_exercices": [{"id": "E1", "ordre": 1, "element": "Définitions", "points": 2, "texte": "Une économie dominée dépend de l'extérieur pour ses revenus et ses produits manufacturés."}, {"id": "E1", "ordre": 2, "element": "Causes de la dépendance", "points": 4, "texte": "• Coton exporté surtout à l'état brut, peu de transformation locale\n• Prix dépendant des cours mondiaux, donc recettes instables\n• Importation de produits finis plus chers\n• La spécialisation freine la diversification"}, {"id": "E1", "ordre": 3, "element": "Deux solutions", "points": 3, "texte": "• Transformer le coton sur place (filature, textile) pour gagner de la valeur ajoutée\n• Diversifier l'économie (autres cultures, agro-industrie, services autour du port de Cotonou)"}, {"id": "E1", "ordre": 4, "element": "Méthode", "points": 1, "texte": "Introduction, plan, conclusion, clarté."}, {"id": "E2", "ordre": 1, "element": "Missions et organes", "points": 3, "texte": "La Charte de 1945 confie le maintien de la paix au Conseil de sécurité, qui peut décider de sanctions et de missions de casques bleus."}, {"id": "E2", "ordre": 2, "element": "Deux exemples", "points": 3, "texte": "• Une réussite : des missions de paix ont aidé à stabiliser certains pays après des conflits\n• Une limite : des crises où l'ONU n'a pas pu agir à temps"}, {"id": "E2", "ordre": 3, "element": "Limites", "points": 3, "texte": "• Droit de veto des cinq membres permanents\n• Manque de moyens financiers et militaires\n• Dépendance à la volonté des États membres"}, {"id": "E2", "ordre": 4, "element": "Conclusion nuancée", "points": 1, "texte": "L'ONU joue un rôle utile, mais son efficacité reste limitée."}, {"id": "E3", "ordre": 1, "element": "Le paradoxe", "points": 2, "texte": "Le Japon est pauvre en ressources (pétrole, minerais) mais figure parmi les premières puissances économiques."}, {"id": "E3", "ordre": 2, "element": "Facteurs", "points": 4, "texte": "• Importation de matières premières, transformées en produits à forte valeur ajoutée\n• Technologie et recherche (automobile, électronique, robotique)\n• Main-d'œuvre qualifiée et disciplinée\n• Grandes firmes (Toyota, Sony) et exportations mondiales"}, {"id": "E3", "ordre": 3, "element": "Organisation de l'espace", "points": 2, "texte": "Industries et ports concentrés sur la façade pacifique, autour de Tokyo, Osaka et Nagoya."}, {"id": "E3", "ordre": 4, "element": "Limites", "points": 2, "texte": "Vieillissement de la population, dépendance énergétique, risques naturels."}, {"id": "E4", "ordre": 1, "element": "Facteurs internes", "points": 4, "texte": "• Résistance armée de Béhanzin (1892-1894)\n• Après 1945 : partis politiques, syndicats, élites (Apithy, Maga, Ahomadégbé)\n• Refus du travail forcé et de l'injustice coloniale"}, {"id": "E4", "ordre": 2, "element": "Facteurs externes", "points": 3, "texte": "• Conséquences de la Seconde Guerre mondiale\n• Rôle de l'ONU et de la Charte\n• Bandung (1955), loi-cadre Defferre (1956), référendum de 1958"}, {"id": "E4", "ordre": 3, "element": "Étapes et dates", "points": 2, "texte": "République autonome en 1958, puis indépendance le 1er août 1960."}, {"id": "E4", "ordre": 4, "element": "Conclusion", "points": 1, "texte": "L'indépendance est le résultat de la lutte des Dahoméens et d'un contexte international favorable."}, {"id": "E5", "ordre": 1, "element": "Chine", "points": 3, "texte": "• Réformes de 1978 sous Deng Xiaoping\n• Zones économiques spéciales (Shenzhen) et investissements étrangers\n• Main-d'œuvre nombreuse, « atelier du monde »"}, {"id": "E5", "ordre": 2, "element": "Brésil", "points": 3, "texte": "• Agriculture puissante (soja, café, canne à sucre) et ressources minières\n• Industrie et services du Sud-Est (São Paulo)\n• Grand marché intérieur"}, {"id": "E5", "ordre": 3, "element": "Limites communes", "points": 3, "texte": "Inégalités sociales et territoriales, atteintes à l'environnement (pollution en Chine, déforestation de l'Amazonie), dépendance aux marchés extérieurs."}, {"id": "E5", "ordre": 4, "element": "Comparaison", "points": 1, "texte": "La Chine mise surtout sur l'industrie exportatrice, le Brésil davantage sur les matières premières et le marché intérieur."}, {"id": "E6", "ordre": 1, "element": "Objectifs", "points": 2, "texte": "Créée à Lagos en 1975 : union économique, libre circulation, paix en Afrique de l'Ouest."}, {"id": "E6", "ordre": 2, "element": "Réalisations", "points": 3, "texte": "Protocole de libre circulation (1979), interventions pour la paix (ECOMOG), infrastructures (corridors routiers, énergie)."}, {"id": "E6", "ordre": 3, "element": "Difficultés", "points": 3, "texte": "• Commerce faible entre pays membres, aux économies proches\n• Instabilité politique et conflits\n• Obstacles administratifs\n• Retrait du Mali, du Burkina Faso et du Niger en 2025"}, {"id": "E6", "ordre": 4, "element": "Le Bénin", "points": 2, "texte": "Le port de Cotonou dessert l'hinterland, et le marché nigérian offre un fort potentiel, mais avec des risques de dépendance."}], "questions": [{"partie": "Histoire", "sa": "SA4", "q": "Cite trois facteurs internes du processus d'émancipation des peuples d'Afrique.", "r": "Le rôle de l'école (idées de liberté et d'égalité), le rôle des églises, l'action des partis politiques, syndicats et intellectuels nationalistes."}, {"partie": "Histoire", "sa": "SA4", "q": "Énonce les raisons de l'adoption de la loi-cadre du 23 juin 1956.", "r": "Agitation nationaliste croissante, contexte international défavorable au colonialisme (Bandung, Ghana), volonté de la France de canaliser le mouvement, échec des réformes de 1946, guerre d'Algérie."}, {"partie": "Histoire", "sa": "SA4", "q": "Évoque quelques réformes de la loi-cadre du 23 juin 1956.", "r": "Collège unique, suffrage universel, conseils de gouvernement, assemblées territoriales aux pouvoirs élargis, africanisation des cadres."}, {"partie": "Histoire", "sa": "SA4", "q": "Décris le contenu de la Constitution de 1946 (Union française).", "r": "Les colonies deviennent des territoires d'outre-mer ; représentation au Parlement français et dans des assemblées locales ; citoyenneté pour les cadres ; le pouvoir reste à Paris."}, {"partie": "Histoire", "sa": "SA4", "q": "Cite les étapes de la décolonisation au Dahomey.", "r": "1946 : représentation et partis ; 1956 : loi-cadre ; 28 septembre 1958 : référendum ; 4 décembre 1958 : République autonome ; 1959 : Constitution et gouvernement Maga ; 11 juillet 1960 : transfert des compétences ; 1er août 1960 : indépendance."}, {"partie": "Histoire", "sa": "SA4", "q": "Au débat, un camarade dit : « Le Dahomey a eu une indépendance octroyée ». Donne ton point de vue.", "r": "On peut le nuancer : l'indépendance a été négociée, obtenue sans guerre, après des réformes accordées par la France ; mais elle résulte aussi de la pression des nationalistes et d'un contexte international favorable. Elle est donc à la fois octroyée et conquise."}, {"partie": "Histoire", "sa": "SA4", "q": "Donne les contraintes de la gestion du Bénin après l'indépendance.", "r": "Pauvreté, dépendance envers la France, régionalisme, rivalités politiques, grèves, manque de cadres, coups d'État à répétition."}, {"partie": "Histoire", "sa": "SA4", "q": "Que retiens-tu de la Conférence nationale de février 1990 ?", "r": "Réunion des forces vives de la Nation ; fin du régime marxiste-léniniste ; ouverture au multipartisme ; adoption d'une Constitution en décembre 1990 ; élection présidentielle de 1991."}, {"partie": "Histoire", "sa": "SA4", "q": "Donne les raisons de l'anticolonialisme des États-Unis.", "r": "Leur propre histoire (indépendance contre la Grande-Bretagne), intérêts économiques (ouvrir les marchés), rivalité avec l'URSS, principes de la Charte de l'Atlantique."}, {"partie": "Histoire", "sa": "SA4", "q": "Cite les formes de lutte pour l'indépendance avec un exemple.", "r": "Pacifique : Ghana ; négociée : Dahomey et la plupart des colonies françaises d'Afrique noire ; armée : Algérie, Angola, Kenya."}, {"partie": "Histoire", "sa": "SA4", "q": "Présente les causes et conséquences de la guerre d'Algérie (1954-1962).", "r": "Causes : refus de l'indépendance, inégalités entre colons et Algériens, montée du FLN. Conséquences : accords d'Évian (mars 1962), indépendance en juillet 1962, exode des Européens, chute de la IVe République et retour de de Gaulle."}, {"partie": "Histoire", "sa": "SA2", "q": "Donne ton opinion sur le droit d'ingérence exercé par l'ONU dans certaines crises.", "r": "Utile pour protéger les civils en cas de crimes graves ; mais risque d'abus, d'application inégale (veto) et d'atteinte à la souveraineté ; il faut un mandat clair et une intervention encadrée."}, {"partie": "Histoire", "sa": "SA2", "q": "Cite les actions de l'ONU dans l'émancipation des peuples colonisés.", "r": "Charte de 1945, Conseil de tutelle, résolution 1514 (1960), comité de décolonisation, tribune des pays afro-asiatiques, admission des nouveaux États."}, {"partie": "Histoire", "sa": "SA2", "q": "Qui a été secrétaire général de l'ONU de 1997 à 2006 ? Donne sa nationalité.", "r": "Kofi Annan, diplomate ghanéen, prix Nobel de la paix en 2001."}, {"partie": "Géographie", "sa": "SA6", "q": "Cite trois sous-organisations ou institutions de la CEDEAO.", "r": "BIDC (Lomé), OOAS (Bobo-Dioulasso), Parlement et Cour de justice ; Commission à Abuja."}, {"partie": "Géographie", "sa": "SA5", "q": "Donne deux limites communes de l'émergence de la Chine et du Brésil.", "r": "Fortes inégalités sociales et territoriales ; atteintes à l'environnement ; dépendance aux exportations."}], "reperes": [{"cat": "Chronologie", "a": "1941", "b": "Charte de l'Atlantique"}, {"cat": "Chronologie", "a": "1944", "b": "Conférence de Brazzaville (30 janvier-8 février)"}, {"cat": "Chronologie", "a": "1945", "b": "Fin de la Seconde Guerre mondiale ; création de l'ONU (Charte signée le 26 juin)"}, {"cat": "Chronologie", "a": "1946", "b": "Constitution de la IVe République et Union française (27 octobre) ; création du RDA ; fin du travail forcé"}, {"cat": "Chronologie", "a": "1948", "b": "Déclaration universelle des droits de l'homme (10 décembre)"}, {"cat": "Chronologie", "a": "1954", "b": "Défaite de la France à Dien Bien Phu ; début de la guerre d'Algérie"}, {"cat": "Chronologie", "a": "1955", "b": "Conférence de Bandung"}, {"cat": "Chronologie", "a": "1956", "b": "Loi-cadre Defferre (23 juin)"}, {"cat": "Chronologie", "a": "1957", "b": "Indépendance du Ghana"}, {"cat": "Chronologie", "a": "1958", "b": "Retour de de Gaulle ; référendum du 28 septembre ; 2 octobre : indépendance de la Guinée ; 4 décembre : République du Dahomey"}, {"cat": "Chronologie", "a": "1960", "b": "Année des indépendances africaines ; 1er août : indépendance du Dahomey ; 14 décembre : résolution 1514 de l'ONU"}, {"cat": "Chronologie", "a": "1962", "b": "Indépendance de l'Algérie"}, {"cat": "Chronologie", "a": "1963", "b": "Premier coup d'État au Dahomey (octobre)"}, {"cat": "Chronologie", "a": "1972", "b": "Coup d'État de Mathieu Kérékou (26 octobre)"}, {"cat": "Chronologie", "a": "1975", "b": "Création de la CEDEAO (28 mai, Lagos) ; le Dahomey devient République populaire du Bénin (30 novembre)"}, {"cat": "Chronologie", "a": "1978", "b": "Réformes de Deng Xiaoping en Chine"}, {"cat": "Chronologie", "a": "1990", "b": "Conférence nationale des forces vives de la Nation (février) ; Constitution (décembre)"}, {"cat": "Chronologie", "a": "2001", "b": "Entrée de la Chine à l'OMC"}, {"cat": "Chronologie", "a": "2025", "b": "Retrait du Mali, du Burkina Faso et du Niger de la CEDEAO"}, {"cat": "Personnage", "a": "Hubert Maga", "b": "Homme politique dahoméen ; chef du gouvernement en 1959 ; premier président du Dahomey (1960-1963)"}, {"cat": "Personnage", "a": "Sourou Migan Apithy", "b": "Né en 1913 à Porto-Novo ; chef du gouvernement autonome (1957-1959) ; président du Dahomey (1964-1965)"}, {"cat": "Personnage", "a": "Justin Ahomadégbé", "b": "Né en 1917 à Abomey ; Premier ministre (1964-1965) ; président du Conseil présidentiel en 1972"}, {"cat": "Personnage", "a": "Mathieu Kérékou", "b": "Chef de l'État à partir du coup d'État du 26 octobre 1972"}, {"cat": "Personnage", "a": "Charles de Gaulle", "b": "Général, chef de la France libre ; retour au pouvoir en 1958 ; fondateur de la Ve République ; président de 1959 à 1969"}, {"cat": "Personnage", "a": "Félix Houphouët-Boigny", "b": "Leader du RDA, ministre en France, premier président de la Côte d'Ivoire ; auteur de la loi supprimant le travail forcé"}, {"cat": "Personnage", "a": "Kwame Nkrumah", "b": "Père de l'indépendance du Ghana (1957) ; panafricaniste"}, {"cat": "Personnage", "a": "Léopold Sédar Senghor", "b": "Poète, premier président du Sénégal (1960-1980)"}, {"cat": "Personnage", "a": "Sékou Touré", "b": "Premier président de la Guinée indépendante ; a fait voter « non » en 1958"}, {"cat": "Personnage", "a": "Modibo Keïta", "b": "Premier président du Mali (1960-1968) ; panafricaniste"}, {"cat": "Personnage", "a": "Patrice Lumumba", "b": "Premier Premier ministre du Congo indépendant (1960), assassiné en 1961"}, {"cat": "Personnage", "a": "Kofi Annan", "b": "Secrétaire général de l'ONU (1997-2006) ; prix Nobel de la paix (2001)"}, {"cat": "Personnage", "a": "Boutros Boutros-Ghali", "b": "Secrétaire général de l'ONU (1992-1996)"}, {"cat": "Personnage", "a": "Ban Ki-moon", "b": "Secrétaire général de l'ONU (2007-2016)"}, {"cat": "Personnage", "a": "Albert Tévoédjrè", "b": "Homme politique et universitaire béninois ; médiateur de la République (2006-2013)"}], "methodes": [{"titre": "Format de l'épreuve", "texte": "Une épreuve d'Histoire-Géographie comporte deux parties : Histoire et Géographie. Chaque partie présente :\n• le contexte d'évaluation (la situation),\n• la tâche (ce que l'élève doit produire),\n• un support éventuel (texte, carte, tableau),\n• les consignes numérotées.\nTrois types de travail se rencontrent : la dissertation (3 consignes), le commentaire de document (4 consignes en Histoire, 5 en Géographie) et les questions à réponse directe (3 consignes). Le barème utilisé dans ce fichier (10 points par partie) est indicatif : à ajuster selon la grille officielle."}, {"titre": "Dissertation (Histoire ou Géographie)", "texte": "Introduction, en 3 temps : préambule (entrée en matière, sujet situé dans le temps et l'espace), problématique (formulée de façon affirmative, tirée de la tâche et des consignes), plan (annonce des parties, une par consigne).\nCorps du devoir : une partie par consigne, dans l'ordre, avec une transition entre chaque partie (elle rappelle la consigne précédente et annonce la suivante).\nConclusion : le point (bilan de ce qui a été dit) et l'ouverture (nouvelle question ou nouveau problème).\nÀ éviter : réciter le cours sans répondre à la consigne, oublier les transitions, mélanger les parties."}, {"titre": "Commentaire de texte historique (4 consignes)", "texte": "Consigne 1, Présenter le texte en 7 points : nature, source, auteur, destinataire, contexte historique, idée générale, centres d'intérêt (découpage du texte avec un titre par centre d'intérêt).\nConsigne 2, Expliquer : reprendre chaque centre d'intérêt, expliquer les mots et allusions importants, apporter des connaissances (quoi ? comment ? pourquoi ?).\nConsigne 3, Critique : juger le fond (erreurs, omissions, objectivité de l'auteur, qualités) et la forme (clarté, style).\nConsigne 4, Intérêt et portée : ce que le texte apprend (intérêt) et ses conséquences dans la suite des événements (portée).\nÀ éviter : la paraphrase, l'explication mot à mot, l'anachronisme, les critiques sans preuve."}, {"titre": "Commentaire de document géographique (5 consignes)", "texte": "Consigne 1, Présenter : nature, source, cadre géographique, idée générale, centres d'intérêt.\nConsigne 2, Interpréter : décrire ou expliquer le phénomène évoqué.\nConsigne 3, Causes : donner les raisons du phénomène
