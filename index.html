/* ================= Navigation ================= */
function pushHist(){
  try{ history.pushState({d:1}, ''); state.pushed = true; }catch(e){ state.pushed = false; }
}
function closeDetail(){
  state.detail = null; state.pushed = false; render();
  requestAnimationFrame(()=>window.scrollTo(0, state.scroll||0));
}
window.addEventListener('popstate', ()=>{ if(state.detail) closeDetail(); });

function goHome(){ state.serie=null; state.view='home'; state.detail=null; save('serie', null); render(); window.scrollTo(0,0); }
function chooseSerie(s){
  state.serie=s; state.view='tabs'; state.detail=null; state.filter='';
  state.rev.deck=null; state.epMode='ep';
  state.tab = load('tab','fiches');
  save('serie', s); render(); window.scrollTo(0,0);
}
function setTab(t){
  if(t==='quiz' && state.tab!=='quiz'){ state.quiz = { screen:'groups', groupIdx:null, quizIdx:null, pos:0, picked:null, checked:false, ok:0 }; }
  state.tab=t; state.view='tabs'; state.detail=null; state.filter='';
  save('tab', t); render(); window.scrollTo(0,0);
}
function openDetail(kind, idx){
  if(!state.detail){ state.scroll = window.scrollY || 0; pushHist(); }
  state.detail = {kind, idx}; render(); window.scrollTo(0,0);
}
function showFiche(i){ state.detail = {kind:'fiche', idx:i}; render(); window.scrollTo(0,0); }
function goBack(){
  if(state.detail){
    if(state.pushed){
      try{ history.back(); setTimeout(()=>{ if(state.detail) closeDetail(); }, 200); return; }catch(e){}
    }
    closeDetail(); return;
  }
  if(state.view === 'tabs') goHome();
}

function screenTitleFor(){
  if(state.view === 'home') return 'Histoire-Géo Bénin';
  const serieLabel = state.serie === 'AB' ? 'Séries A / B' : 'Séries C / D';
  if(state.detail){
    const k=state.detail.kind, i=state.detail.idx;
    if(k==='fiche') return ficheListCache[i] ? ficheListCache[i].rubrique : 'Fiche';
    if(k==='epreuve') return 'Épreuve n°' + currentData().epreuves[i].num;
    if(k==='ex') return 'Exercice avancé n°' + currentData().exercices[i].id.slice(1);
  }
  const labels = {fiches:'Fiches de cours', epreuves:'Épreuves & exercices', quiz:'Quiz', questions:'Révision', reperes:'Repères', methodes:'Méthodes'};
  return serieLabel + ' · ' + (labels[state.tab]||'');
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('backBtn').style.display = (state.view!=='home') ? 'inline-block':'none';
  document.getElementById('tabbar').style.display = (state.view==='tabs' && !state.detail) ? 'flex':'none';
  document.getElementById('screenTitle').textContent = screenTitleFor();
  if(state.view === 'tabs'){
    document.querySelectorAll('nav.tabbar button').forEach(b=>{ b.classList.toggle('active', b.dataset.tab === state.tab); });
  }
  if(state.view === 'home'){ app.innerHTML = renderHome(); return; }
  if(state.detail){
    const k=state.detail.kind, i=state.detail.idx, d=currentData();
    if(k==='fiche') app.innerHTML = renderFicheDetail(i);
    else if(k==='epreuve') app.innerHTML = renderEpreuveDetail(d.epreuves[i]);
    else app.innerHTML = renderExDetail(d.exercices[i]);
    return;
  }
  const t = state.tab;
  app.innerHTML = t==='fiches' ? renderFichesTab()
    : t==='epreuves' ? renderEpreuvesTab()
    : t==='quiz' ? renderQuizTab()
    : t==='questions' ? renderQuestions()
    : t==='reperes' ? renderReperes()
    : renderMethodes();
}

/* ================= Accueil & progression ================= */
function stats(g){
  const D = DATA[g], p = prog(g);
  const f = D.fiches.filter(x=>p.read[ficheKey(x)]).length;
  const q = D.questions.filter(x=>p.qa[qaKey(x)]==='ok').length;
  const e = D.epreuves.filter(x=>{ const r=p.ep[x.id]; return r && (Object.keys(r.sn).length || Object.keys(r.sc).length); }).length;
  return { f:[f, D.fiches.length], q:[q, D.questions.length], e:[e, D.epreuves.length] };
}
function renderHome(){
  const card = (s,g,title,sub)=>{
    const st = stats(g);
    return `<button class="serie-card" onclick="chooseSerie('${s}')">
      <div class="row between"><div><div class="stitle">${title}</div><div class="muted">${sub}</div></div><span class="go">›</span></div>
      ${bar('Fiches lues', st.f)}${bar('Questions maîtrisées', st.q)}${bar('Épreuves travaillées', st.e)}
    </button>`;
  };
  return `
  <div class="card fade-in">
    <p class="muted" style="margin:0;">Fiches de cours, épreuves type BAC avec corrigés, cartes de révision, repères et méthodes, en Histoire-Géographie pour les classes de Terminale au Bénin. Ta progression est enregistrée sur cet appareil.</p>
  </div>
  <h2 class="sec">Choisis ta série</h2>
  ${card('AB','ab','Séries A · B','Littéraires')}
  ${card('CD','cd','Séries C · D','Scientifiques')}
  <div class="card" style="margin-top:1.2rem;">
    <h3 style="margin:0 0 .4rem;">Utiliser l'app sans connexion</h3>
    <p class="muted" style="margin:0;" id="offlineStatus">Ouvre l'app une première fois avec internet : elle se sauvegarde ensuite automatiquement sur ton téléphone et fonctionne sans connexion. Utilise « Ajouter à l'écran d'accueil » depuis le menu de ton navigateur pour l'installer comme une vraie application.</p>
  </div>
  <button class="link-btn" onclick="resetProgress(this)">Réinitialiser ma progression</button>
  <p class="muted center" style="margin-top:1.2rem;">Contenu élaboré à partir des guides pédagogiques de Terminale. À utiliser en complément de ton cours.</p>
  `;
}
function resetProgress(btn){
  if(!btn.dataset.sure){ btn.dataset.sure='1'; btn.textContent='Toucher encore pour confirmer'; return; }
  P = {}; persist(); render();
}
/* ================= Fiches ================= */
let ficheListCache = [];
function renderFichesTab(){
  const st = stats(groupKey());
  return `<div class="card">${bar('Fiches lues', st.f)}
    <input id="fsearch" type="search" placeholder="Rechercher une fiche…" value="${esc(state.filter)}" oninput="state.filter=this.value; updateFiches()"></div>
    <div id="ficheRes">${ficheResults()}</div>`;
}
function updateFiches(){ document.getElementById('ficheRes').innerHTML = ficheResults(); }
function ficheResults(){
  const d = currentData(), p = prog(groupKey());
  const groups = {};
  d.fiches.forEach(f=>{ (groups[f.groupe] = groups[f.groupe]||[]).push(f); });
  const q = state.filter.trim().toLowerCase();
  ficheListCache = [];
  let html = '';
  Object.keys(groups).forEach(gk=>{
    const items = groups[gk].filter(f => !q || (f.rubrique+' '+f.texte+' '+f.titre).toLowerCase().includes(q));
    if(!items.length) return;
    html += `<h2 class="sec">${esc(items[0].titre)}</h2><div class="card">`;
    items.forEach(f=>{
      const idx = ficheListCache.length;
      ficheListCache.push(f);
      const first = f.texte.split('\n')[0].replace(/^• /,'');
      html += `<div class="list-item" onclick="openDetail('fiche',${idx})">
        <h3>${p.read[ficheKey(f)] ? '<span class="okmark">✓</span> ' : ''}${esc(f.rubrique)}</h3>
        <p>${esc(first.slice(0,90))}${first.length>90?'…':''}</p></div>`;
    });
    html += `</div>`;
  });
  if(!ficheListCache.length) html = `<div class="empty">Aucune fiche trouvée.</div>`;
  return html;
}
function renderFicheDetail(i){
  const f = ficheListCache[i];
  if(!f) return `<div class="empty">Fiche introuvable.</div>`;
  const p = prog(groupKey()), k = ficheKey(f);
  if(!p.read[k]){ p.read[k]=1; persist(); }
  const last = ficheListCache.length-1;
  return `<div class="card fade-in">
    <span class="tag">${esc(f.groupe)}</span>
    <p class="muted" style="margin:.5rem 0 0;">${esc(f.titre)}</p>
    <h2 class="sec" style="margin-top:.6rem;">${esc(f.rubrique)}</h2>
    <div class="body">${rich(f.texte)}</div>
  </div>
  <div class="grid2">
    <button class="nav-btn" ${i>0?`onclick="showFiche(${i-1})"`:'disabled'}>← Précédente</button>
    <button class="nav-btn" ${i<last?`onclick="showFiche(${i+1})"`:'disabled'}>Suivante →</button>
  </div>
  <button class="link-btn" onclick="markUnread(${i},this)">Marquer comme non lue</button>`;
}
function markUnread(i,btn){
  const f=ficheListCache[i]; const p=prog(groupKey());
  delete p.read[ficheKey(f)]; persist(); btn.textContent='Marquée comme non lue';
}

/* ================= Épreuves & exercices ================= */
function elsFor(kind,id,pi){
  const d = currentData();
  if(kind==='ep'){
    const e = d.epreuves.find(x=>x.id===id);
    return e.parts[pi].elements.map(el=>({label:el.label, points:el.points, text:el.text}));
  }
  return d.corriges_exercices.filter(c=>c.id===id).sort((a,b)=>a.ordre-b.ordre)
    .map(c=>({label:c.element, points:c.points, text:c.texte}));
}
function totalText(kind,id,pi){
  const els = elsFor(kind,id,pi), r = rec(kind,id);
  let got=0, gr=0, max=0;
  els.forEach((el,li)=>{ max+=el.points; const v=r.sc[pi+'_'+li]; if(v!==undefined){ gr++; got+=v; } });
  if(!gr) return 'Évalue-toi élément par élément pour obtenir ta note.';
  return `Ma note : ${fmt(got)} / ${fmt(max)}` + (gr<els.length ? ' (partielle)' : '');
}
function statusOf(kind,id,n){
  const r = prog(groupKey())[kind][id];
  if(!r) return '';
  let got=0, gr=0, cnt=0, max=0;
  for(let pi=0; pi<n; pi++){
    elsFor(kind,id,pi).forEach((el,li)=>{ cnt++; max+=el.points; const v=r.sc[pi+'_'+li]; if(v!==undefined){ gr++; got+=v; } });
  }
  if(gr>0) return `<span class="chip ok">${fmt(got)}/${fmt(max)}${gr<cnt?' …':''}</span>`;
  if(Object.keys(r.sn).length) return `<span class="chip">Corrigé vu</span>`;
  return '';
}
function setSc(kind,id,pi,li,val){
  const r = rec(kind,id), key = pi+'_'+li;
  if(val==='') delete r.sc[key]; else r.sc[key] = parseFloat(val);
  persist();
  const t = document.getElementById(`tot_${kind}_${id}_${pi}`);
  if(t) t.textContent = totalText(kind,id,pi);
}
function setDraft(kind,id,pi,val){ rec(kind,id).dr[pi] = val; persist(); }
function toggleCorr(kind,id,pi,btn){
  const el = document.getElementById(`corr_${kind}_${id}_${pi}`);
  const on = el.classList.toggle('shown');
  btn.textContent = on ? 'Masquer le corrigé' : 'Voir le corrigé';
  if(on){ rec(kind,id).sn[pi]=1; persist(); }
}
function corrBlock(kind,id,pi){
  const els = elsFor(kind,id,pi), r = rec(kind,id);
  let h = `<div class="corr-block${r.sn[pi]?' shown':''}" id="corr_${kind}_${id}_${pi}">`;
  els.forEach((el,li)=>{
    const cur = r.sc[pi+'_'+li];
    let opts = '<option value="">—</option>';
    for(let v=0; v<=el.points+1e-9; v+=0.5){ opts += `<option value="${v}"${cur===v?' selected':''}>${fmt(v)}</option>`; }
    h += `<div class="el"><strong>${esc(el.label)}</strong> <span class="badge-pts">${fmt(el.points)} pts</span>
      ${rich(el.text)}
      <label class="grade">Ma note : <select onchange="setSc('${kind}','${id}',${pi},${li},this.value)">${opts}</select> / ${fmt(el.points)}</label></div>`;
  });
  h += `<p class="total" id="tot_${kind}_${id}_${pi}">${totalText(kind,id,pi)}</p></div>`;
  return h;
}
function draftBlock(kind,id,pi){
  const r = rec(kind,id);
  return `<details class="draft"${r.dr[pi]?' open':''}><summary>✍️ Écrire ma réponse (brouillon)</summary>
    <textarea placeholder="Rédige ici, puis compare avec le corrigé…" oninput="setDraft('${kind}','${id}',${pi},this.value)">${esc(r.dr[pi]||'')}</textarea></details>`;
}

function renderEpreuvesTab(){
  const d = currentData();
  const hasEx = !!(d.exercices && d.exercices.length);
  let html = '';
  if(hasEx){
    html += `<div class="pill-row">
      <button class="pill ${state.epMode==='ep'?'active':''}" onclick="setEpMode('ep')">Épreuves type BAC</button>
      <button class="pill ${state.epMode==='ex'?'active':''}" onclick="setEpMode('ex')">Exercices avancés</button></div>`;
  }
  return html + ((hasEx && state.epMode==='ex') ? renderExList() : renderEpreuvesList());
}
function setEpMode(m){ state.epMode=m; render(); }
function renderEpreuvesList(){
  const d = currentData();
  let html = `<div class="card"><p class="muted" style="margin:0;">Compétence disciplinaire : ${esc(DATA.competence)}</p></div><div class="card">`;
  d.epreuves.forEach((e,i)=>{
    const parties = e.parts.map(p=>p.partie).join(' + ');
    html += `<div class="list-item" onclick="openDetail('epreuve',${i})">
      <div class="row between"><h3>Épreuve n°${esc(e.num)}</h3>${statusOf('ep',e.id,e.parts.length)}</div>
      <p>${esc(parties)} · ${e.parts.map(p=>esc(p.sa)).join(', ')}</p></div>`;
  });
  return html + `</div>`;
}
function renderExList(){
  const d = currentData();
  let html = `<div class="card"><p class="muted" style="margin:0;">Sujets plus difficiles, avec corrigé type et barème sur ${fmt(10)} points.</p></div><div class="card">`;
  d.exercices.forEach((e,i)=>{
    html += `<div class="list-item" onclick="openDetail('ex',${i})">
      <div class="row between"><h3>Exercice n°${esc(e.id.slice(1))} · ${esc(e.sa)}</h3>${statusOf('ex',e.id,1)}</div>
      <p>${esc(e.enonce.slice(0,90))}…</p></div>`;
  });
  return html + `</div>`;
}
function renderEpreuveDetail(e){
  let html = '';
  e.parts.forEach((p,pi)=>{
    const r = rec('ep',e.id);
    html += `<div class="card fade-in">
      <span class="tag">${esc(p.partie)}</span><span class="tag">${esc(p.type)}</span>
      <p class="muted" style="margin:.5rem 0 0;">${esc(p.sa)}</p>
      <h2 class="sec">Contexte d'évaluation</h2><p>${esc(p.contexte)}</p>
      <h2 class="sec">Tâche</h2><p>${esc(p.tache)}</p>
      ${p.support ? `<h2 class="sec">Support</h2><p style="font-style:italic;">${esc(p.support)}</p>` : ''}
      <h2 class="sec">Consignes</h2>

      ${corrBlock('ep',e.id,pi)}
    </div>`;

function renderExDetail(e){

  return `<div class="card fade-in">
    <span class="tag">${esc(e.sa)}</span><span class="tag">${esc(e.niveau)}</span><span class="tag">${fmt(e.total)} pts</span>
    <h2 class="sec">Énoncé</h2><p style="line-height:1.55;">${esc(e.enonce)}</p>
    ${draftBlock('ex',e.id,0)}
    <button class="reveal-btn" onclick="toggleCorr('ex','${e.id}',0,this)">${r.sn[0]?'Masquer le corrigé':'Voir le corrigé'}</button>
    ${corrBlock('ex',e.id,0)}

/* ================= Quiz ================= */
function quizGroups(){ return (QUIZDATA[groupKey()] || []); }
function quizCounts(){
  let quizN=0, qN=0;
  quizGroups().forEach(g=>g.quizzes.forEach(qz=>{ quizN++; qN += qz.questions.length; }));
  return {quizN, qN};
}
function quizDoneCount(){
  const p = prog(groupKey()).qz; let done=0, total=0;
  quizGroups().forEach(g=>g.quizzes.forEach(qz=>{ total++; if(p[qz.id]) done++; }));
  return [done,total];
}
function renderQuizTab(){
  const s = state.quiz;
  if(s.screen==='play') return renderQuizPlay();
  if(s.screen==='result') return renderQuizResult();
  if(s.screen==='quizzes') return renderQuizList();
  return renderQuizGroups();
}
function renderQuizGroups(){
  const groups = quizGroups(), p = prog(groupKey()).qz;
  let html = `<div class="card">${bar('Quiz terminés', quizDoneCount())}<p class="muted" style="margin:.5rem 0 0;">Choisis une situation d'apprentissage (SA) ou un thème, puis un quiz sur un ou deux sous-thèmes précis (5-6 questions).</p></div>`;
  groups.forEach((g,gi)=>{
    const n = g.quizzes.length;
    const doneN = g.quizzes.filter(qz=>p[qz.id]).length;
    html += `<div class="list-item" onclick="quizOpenGroup(${gi})">
      <div class="row between"><h3>${esc(g.groupe)}</h3><span class="chip${doneN===n?' ok':''}">${doneN}/${n}</span></div>
      <p>${esc(g.titre)}</p></div>`;
  });
  if(!groups.length) html += `<div class="empty">Pas encore de quiz pour cette série.</div>`;
  return `<div class="card">${html}</div>`;
}
function quizOpenGroup(gi){ state.quiz = {screen:'quizzes', groupIdx:gi, quizIdx:null, pos:0, picked:null, checked:false, ok:0}; render(); window.scrollTo(0,0); }
function quizBackToGroups(){ state.quiz.screen='groups'; state.quiz.groupIdx=null; render(); window.scrollTo(0,0); }
function renderQuizList(){
  const g = quizGroups()[state.quiz.groupIdx];
  const p = prog(groupKey()).qz;
  let html = `<button class="link-btn" style="margin:0 0 .6rem;" onclick="quizBackToGroups()">← Toutes les SA</button>
  <div class="card"><h2 class="sec" style="margin-top:0;">${esc(g.groupe)}</h2><p class="muted" style="margin:0;">${esc(g.titre)}</p></div><div class="card">`;
  g.quizzes.forEach((qz,qi)=>{
    const r = p[qz.id];
    html += `<div class="list-item" onclick="quizOpenQuiz(${qi})">
      <div class="row between"><h3>${esc(qz.titre)}</h3>${r?`<span class="chip ok">${r.ok}/${r.total}</span>`:''}</div>
      <p>${qz.questions.length} questions</p></div>`;
  });
  return html + `</div>`;
}
function quizOpenQuiz(qi){ state.quiz.screen='play'; state.quiz.quizIdx=qi; state.quiz.pos=0; state.quiz.picked=null; state.quiz.checked=false; state.quiz.ok=0; render(); window.scrollTo(0,0); }
function quizBackToQuizzes(){ state.quiz.screen='quizzes'; state.quiz.quizIdx=null; render(); window.scrollTo(0,0); }
function currentQuiz(){ return quizGroups()[state.quiz.groupIdx].quizzes[state.quiz.quizIdx]; }
function renderQuizPlay(){
  const s = state.quiz, qz = currentQuiz(), it = qz.questions[s.pos];
  const pct = Math.round(100*s.pos/qz.questions.length);
  let optsHtml = '';
  it.choices.forEach((c,ci)=>{
    let cls = 'quiz-opt';
    if(s.checked){
      if(ci===it.correct) cls += ' correct';
      else if(ci===s.picked) cls += ' wrong';
    } else if(s.picked===ci) cls += ' picked';
    optsHtml += `<button class="${cls}" ${s.checked?'disabled':''} onclick="quizPick(${ci})">${esc(c)}</button>`;
  });
  return `<button class="link-btn" style="margin:0 0 .6rem;" onclick="quizBackToQuizzes()">← ${esc(qz.titre)}</button>
  <div class="row between muted"><span>Question ${s.pos+1} / ${qz.questions.length}</span><span>✅ ${s.ok}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card fcard fade-in">
    <p class="qtxt">${esc(it.q)}</p>
    <div class="quiz-opts">${optsHtml}</div>
    ${s.checked
      ? `<button class="reveal-btn" style="width:100%; margin-top:.8rem;" onclick="quizNext()">${s.pos+1<qz.questions.length?'Question suivante →':'Voir le résultat 🎉'}</button>`
      : `<button class="reveal-btn" style="width:100%; margin-top:.8rem;" ${s.picked===null?'disabled':''} onclick="quizCheck()">Valider ma réponse</button>`}
  </div>`;
}
function quizPick(ci){ if(state.quiz.checked) return; state.quiz.picked=ci; render(); }
function quizCheck(){
  const s = state.quiz, qz = currentQuiz(), it = qz.questions[s.pos];
  if(s.picked===it.correct) s.ok++;
  s.checked = true; render();
}
function quizNext(){
  const s = state.quiz, qz = currentQuiz();
  if(s.pos+1 < qz.questions.length){ s.pos++; s.picked=null; s.checked=false; render(); window.scrollTo(0,0); return; }
  const r = rec('qz', qz.id);
  const p = prog(groupKey()).qz;
  p[qz.id] = { ok:s.ok, total:qz.questions.length };
  persist();
  s.screen='result'; render(); window.scrollTo(0,0);
}
function renderQuizResult(){
  const s = state.quiz, qz = currentQuiz();
  const pct = Math.round(100*s.ok/qz.questions.length);
  const msg = pct>=80?'Excellent ! 🏆':pct>=50?'Bien joué, continue 💪':'À revoir tranquillement 📘';
  return `<div class="card center fade-in">
    <h2 class="sec">${esc(qz.titre)}</h2>
    <p style="font-size:1.4rem; font-weight:700; margin:.4rem 0;">${s.ok} / ${qz.questions.length}</p>
    <p class="muted">${msg}</p>
    <div class="grid2" style="margin-top:1rem;">
      <button class="nav-btn" onclick="quizOpenQuiz(state.quiz.quizIdx)">Recommencer</button>
      <button class="nav-btn" onclick="quizBackToQuizzes()">Autres quiz</button>
    </div>
  </div>`;
}

/* ================= Révision (cartes + liste) ================= */
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildDeck(){
  const d = currentData(), p = prog(groupKey()), r = state.rev;
  let idx = d.questions.map((_,i)=>i).filter(i=>{
    const it = d.questions[i];
    if(r.f==='H') return it.partie==='Histoire';
    if(r.f==='G') return it.partie==='Géographie';
    if(r.f==='R') return p.qa[qaKey(it)]==='redo';
    return true;
  });
  if(r.shuffle) shuffleArr(idx);
  r.deck = idx; r.pos = 0; r.shown = false; r.ok = 0; r.redo = 0;
}
function setRevMode(m){ state.rev.mode=m; state.filter=''; render(); }
function setRevF(f){ state.rev.f=f; buildDeck(); render(); }
function toggleShuffle(){ state.rev.shuffle=!state.rev.shuffle; buildDeck(); render(); }
function restartDeck(){ buildDeck(); render(); window.scrollTo(0,0); }
function revealCard(){ state.rev.shown=true; render(); }
function rate(v){
  const d = currentData(), r = state.rev, it = d.questions[r.deck[r.pos]];
  prog(groupKey()).qa[qaKey(it)] = v; persist();
  if(v==='ok') r.ok++; else r.redo++;
  r.pos++; r.shown=false; render(); window.scrollTo(0,0);
}
function renderQuestions(){
  const r = state.rev;
  if(!r.deck) buildDeck();
  const st = stats(groupKey());
  let html = `<div class="card">${bar('Questions maîtrisées', st.q)}</div>
  <div class="pill-row">
    <button class="pill ${r.mode==='cards'?'active':''}" onclick="setRevMode('cards')">🃏 Cartes</button>
    <button class="pill ${r.mode==='list'?'active':''}" onclick="setRevMode('list')">📋 Liste</button>
  </div>`;
  if(r.mode==='list'){
    html += `<div class="card"><input id="qsearch" type="search" placeholder="Rechercher une question…" value="${esc(state.filter)}" oninput="state.filter=this.value; updateQ()"></div><div id="qRes">${qResults()}</div>`;
    return html;
  }
  const pill = (f,l)=>`<button class="pill small ${r.f===f?'active':''}" onclick="setRevF('${f}')">${l}</button>`;
  html += `<div class="pill-row">${pill('all','Toutes')}${pill('H','Histoire')}${pill('G','Géographie')}${pill('R','🔁 À revoir')}
    <button class="pill small ${r.shuffle?'active':''}" onclick="toggleShuffle()">🔀 Mélanger</button></div>`;
  return html + renderCards();
}
function renderCards(){
  const d = currentData(), r = state.rev;
  if(!r.deck.length) return `<div class="empty">Aucune question dans ce filtre.</div>`;
  if(r.pos >= r.deck.length){
    return `<div class="card center fade-in"><h2 class="sec">Série terminée 🎉</h2>
      <p>✅ ${r.ok} maîtrisée(s) · 🔁 ${r.redo} à revoir</p>
      <button class="reveal-btn" onclick="restartDeck()">Recommencer</button></div>`;
  }
  const it = d.questions[r.deck[r.pos]];
  const pct = Math.round(100*r.pos/r.deck.length);
  return `<div class="row between muted"><span>${r.pos+1} / ${r.deck.length}</span><span>✅ ${r.ok} · 🔁 ${r.redo}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card fcard fade-in">
    <span class="tag">${esc(it.partie)}</span><span class="tag">${esc(it.sa)}</span>
    <p class="qtxt">${esc(it.q)}</p>
    ${r.shown
      ? `<div class="ans">${rich(it.r)}</div><div class="grid2"><button class="btn-redo" onclick="rate('redo')">🔁 À revoir</button><button class="btn-ok" onclick="rate('ok')">✅ Je savais</button></div>`
      : `<button class="reveal-btn" style="width:100%;" onclick="revealCard()">Voir la réponse</button>`}
  </div>`;
}
function updateQ(){ document.getElementById('qRes').innerHTML = qResults(); }
function qResults(){
  const d = currentData(), p = prog(groupKey());
  const q = state.filter.trim().toLowerCase();
  let html = `<div class="card">`, count = 0;
  d.questions.forEach((it,i)=>{
    if(q && !(it.q+' '+it.r+' '+it.sa).toLowerCase().includes(q)) return;
    count++;
    const s = p.qa[qaKey(it)];
    html += `<div class="qa-card" style="padding:.8rem 0; border-bottom:1px solid var(--border);">
      <span class="tag">${esc(it.partie)}</span><span class="tag">${esc(it.sa)}</span>${s==='ok'?'<span class="okmark">✓</span>':(s==='redo'?'🔁':'')}
      <p style="margin:.4rem 0 0; font-weight:600;">${esc(it.q)}</p>
      <div class="a" id="qa_${i}">${rich(it.r)}</div>
      <button class="reveal-btn" style="margin-top:.5rem;" onclick="const el=document.getElementById('qa_${i}'); el.classList.toggle('shown'); this.textContent=el.classList.contains('shown')?'Masquer la réponse':'Voir la réponse'">Voir la réponse</button>
    </div>`;
  });
  html += `</div>`;
  if(!count) html = `<div class="empty">Aucune question trouvée.</div>`;
  return html;
}

/* ================= Repères ================= */
function setRep(m){ state.rep=m; render(); }
function toggleTest(){ state.test=!state.test; render(); }
function renderReperes(){
  const d = currentData();
  const list = d.reperes.filter(r => r.cat === (state.rep==='perso' ? 'Personnage' : 'Chronologie'));
  return `
  <div class="pill-row">
    <button class="pill ${state.rep!=='perso'?'active':''}" onclick="setRep('chrono')">Chronologie</button>

  </div>
  ${state.test ? '<p class="hint">Touche une ligne pour révéler la réponse.</p>' : ''}
  <div class="card${state.test?' testmode':''}">
    ${list.map(r=>`
      <div class="list-item rp" onclick="this.classList.toggle('on')">
        <h3>${esc(r.a)}</h3>
        <p>${esc(r.b)}</p>
      </div>`).join('')}

/* ================= Méthodes ================= */
function renderMethodes(){
  const m = (DATA.ab && DATA.ab.methodes) || [];
  return `<p class="hint">Ces méthodes valent pour toutes les séries.</p>` +
    m.map((x,i)=>`<details class="card meth"${i===0?' open':''}><summary>${esc(x.titre)}</summary><div class="body">${rich(x.texte)}</div></details>`).join('');
}

/* ================= Démarrage ================= */
(function init(){
  const s = load('serie', null);
  if(s === 'AB' || s === 'CD'){ state.serie = s; state.view='tabs'; state.tab = load('tab','fiches'); }
  render();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
